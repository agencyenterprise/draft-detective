name: Security Scan

on:
  pull_request:
    branches: ["**"]

jobs:
  scan-backend:
    name: Trivy Security Scan - Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: docker build -t ai-reviewer-api:${{ github.sha }} -f Dockerfile .

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ai-reviewer-api:${{ github.sha }}
          format: table
          exit-code: 0
          scanners: vuln

  scan-frontend:
    name: Trivy Security Scan - Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Scanned in two parts instead of building the image, whose `next build`
      # alone took over two minutes: the npm dependencies from the lockfile,
      # and the OS packages from the base image the Dockerfile starts from.
      - name: Scan Frontend Dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend
          format: table
          exit-code: 0
          scanners: vuln

      - name: Read Frontend Base Image
        id: base-image
        run: echo "ref=$(awk 'toupper($1) == "FROM" { print $2; exit }' frontend/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Scan Frontend Base Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.base-image.outputs.ref }}
          format: table
          exit-code: 0
          scanners: vuln

  scan-postgres:
    name: Trivy Security Scan - Postgres
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan PostgreSQL Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: postgres:16-alpine
          format: table
          exit-code: 0
          scanners: vuln
