on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ./frontend/package.json

      # Pins Node to .nvmrc (the runner default is older than `engines` asks
      # for) and restores the pnpm store, so install links packages instead of
      # downloading all of them.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/**/*.[jt]s', 'frontend/**/*.[jt]sx', '!frontend/node_modules/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install
        working-directory: ./frontend

      - name: Run lint
        run: pnpm run lint
        working-directory: ./frontend

      - name: Run tests
        run: pnpm run test
        working-directory: ./frontend

      - name: Run build
        run: pnpm run build
        working-directory: ./frontend
