<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="render-size" content="1040x1010" />
  <title>Mockup: Run assessments</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="./mockup.js"></script>
</head>
<!-- Synthetic example of the assessment picker. Names, descriptions and categories match the app; durations are illustrative. -->
<body class="bg-neutral-500">
<div class="flex h-[1010px] items-center justify-center p-[72px]">
  <div class="flex max-h-full w-full max-w-4xl flex-col overflow-hidden rounded-lg border bg-background shadow-lg">
    <div class="border-b px-6 pt-6 pb-4">
      <h2 class="text-lg leading-none font-semibold">Run assessments</h2>
      <p class="mt-2 text-sm text-muted-foreground">Choose which assessments to run on your document. <span class="text-primary underline underline-offset-4">How assessments work</span></p>
    </div>

    <div class="min-h-0 flex-1 space-y-4 overflow-hidden px-6 py-4">
      <div class="flex items-center">
        <h2 class="text-sm font-medium">Assessments<span class="ml-1 text-destructive">*</span><span class="ml-2 text-xs font-normal tabular-nums text-muted-foreground">3/18 selected</span></h2>
        <span class="ml-auto flex items-center gap-1">
          <span class="inline-flex h-7 items-center rounded-md px-2 text-xs font-medium">Select all</span>
          <span class="inline-flex h-7 items-center rounded-md px-2 text-xs font-medium">Deselect all</span>
        </span>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <span class="mr-0.5 font-mono text-[10px] tracking-wide text-muted-foreground uppercase">Presets</span>
        <span class="inline-flex h-7 items-center gap-1.5 rounded-full border border-primary bg-primary px-2.5 text-xs text-primary-foreground"><i data-lucide="check" class="size-3"></i>Standard Review<span class="font-mono text-[10px] tabular-nums text-primary-foreground/80">3</span></span>
        <span class="inline-flex h-7 items-center gap-1.5 rounded-full border bg-background px-2.5 text-xs">Editorial Review<span class="font-mono text-[10px] tabular-nums text-muted-foreground">7</span></span>
      </div>
      <div id="categories" class="space-y-4"></div>
    </div>

    <div class="space-y-4 border-t px-6 py-4">
      <label class="flex w-full items-center gap-3 rounded-md bg-amber-500/10 px-2 py-2">
        <span class="flex size-4 shrink-0 items-center justify-center rounded-[4px] border border-primary bg-primary text-primary-foreground"><i data-lucide="check" class="size-3.5"></i></span>
        <span class="flex size-7 shrink-0 items-center justify-center rounded-md bg-amber-500/15 text-amber-700"><i data-lucide="globe" class="size-4"></i></span>
        <span class="min-w-0 flex-1">
          <span class="block text-sm leading-tight font-medium">I consent to web search using parts or the whole document for this assessment</span>
          <span class="block text-[13px] leading-snug text-muted-foreground">Parts of the document are sent as search queries, so avoid confidential material. Don't proceed if you don't consent.</span>
        </span>
      </label>
      <div class="flex justify-end gap-2">
        <span class="inline-flex h-9 items-center rounded-md border bg-background px-4 text-sm font-medium shadow-xs">Cancel</span>
        <span class="inline-flex h-9 items-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-xs">Run 3 assessments</span>
      </div>
    </div>
  </div>
</div>

<script>
  const CATEGORIES = [
    ['Citation Check', [
      ['file-check', 'Reference Error Checker', 'Are your references accurate? Uses web search to check each citation exists online and that the author, title, publisher, and year match public sources. Useful for catching typos or hallucinated references.', ['web'], '~6 min', true],
    ]],
    ['Substantive Review', [
      ['clipboard-check', 'Claim Reference Validation', 'Checks every citation in your document against its referenced source and returns a verdict for each claim: supported, partially supported, unsupported, or unverifiable.', ['refs'], '~9 min'],
      ['brain-circuit', 'Internal Inference Validation', "Does your reasoning hold up? Flags logical leaps, unsupported conclusions, and arguments where the evidence doesn't support the claim.", [], '~5 min'],
      ['scale', 'Methodological Alignment', 'Does your methodology match standard practices in the literature? Uses web search to find standard methods for a topic area, then compares them against your approach.', ['web'], '~7 min'],
      ['chart-column', 'Reproducibility Check', 'Could someone reproduce your results from the document alone? Extracts main results and classifies each by how reproducible it is based on whether the data is present and the methodology is described.', ['alpha'], '~6 min'],
      ['clipboard-check', 'Recommendation Check', "Are the document's recommendations supported by its own findings, and can a reader act on them? Flags recommendations whose evidence is missing, weak, indirect or contradictory.", ['alpha'], '~4 min', true],
    ]],
    ['Language', [
      ['message-square-warning', 'Advocacy & Tone', 'Does your document use neutral, objective language? Flags advocacy language, trigger words, and subjective tone.', [], '~3 min', true],
      ['pen-line', 'Active Voice & Clear Actors', 'Does your prose say who does what? Flags passive-voice sentences and sentences whose inanimate subject hides the responsible party, with an active rewrite for each.', ['edits', 'alpha'], '~3 min'],
      ['scissors-line-dashed', 'Concision & Precision', 'Does every sentence earn its length and say something specific? Flags wordy constructions, run-on sentences, filler, vague references and empty framing, with a tighter rewrite for each.', ['edits', 'alpha'], '~3 min'],
    ]],
  ];
  const TRAITS = {
    web: ['globe', 'Web Search', false],
    refs: ['files', 'Needs Full Text References', false],
    edits: ['file-pen-line', 'Proposed Edits', false],
    alpha: ['flask-conical', 'Alpha', true],
  };
  const trait = (key) => {
    const [icon, label, secondary] = TRAITS[key];
    const look = secondary ? 'border-transparent bg-secondary text-secondary-foreground' : 'text-foreground';
    return `<span class="inline-flex h-5 items-center gap-1 rounded-md border px-1.5 text-[11px] font-normal whitespace-nowrap ${look}"><i data-lucide="${icon}" class="size-3"></i>${label}</span>`;
  };
  const row = ([icon, name, description, traits, eta, checked]) => `
    <div class="flex w-full items-center gap-3 rounded-md px-2 py-2 ${checked ? 'bg-primary/5' : ''}">
      <span class="flex size-4 shrink-0 items-center justify-center rounded-[4px] border shadow-xs ${checked ? 'border-primary bg-primary text-primary-foreground' : 'border-input'}">${checked ? '<i data-lucide="check" class="size-3.5"></i>' : ''}</span>
      <span class="flex size-7 shrink-0 items-center justify-center rounded-md ${checked ? 'bg-primary/10 text-primary' : 'bg-muted text-muted-foreground'}"><i data-lucide="${icon}" class="size-4"></i></span>
      <span class="min-w-0 flex-1">
        <span class="flex flex-wrap items-center gap-x-2 gap-y-1"><span class="truncate text-sm leading-tight font-medium">${name}</span>${traits.map(trait).join('')}</span>
        <span class="mt-0.5 line-clamp-2 text-[13px] leading-snug text-muted-foreground">${description}</span>
      </span>
      <span class="flex min-w-16 shrink-0 items-center justify-end gap-1 text-[11px] tabular-nums text-muted-foreground"><i data-lucide="clock" class="size-3.5"></i>${eta}</span>
    </div>`;
  document.getElementById('categories').innerHTML = CATEGORIES.map(([title, rows]) => `
    <section>
      <h3 class="px-2 font-mono text-[10px] tracking-wide text-muted-foreground uppercase">${title}</h3>
      <div class="mt-1.5 space-y-px">${rows.map(row).join('')}</div>
    </section>`).join('');
</script>
</body>
</html>
