apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: frontend
        # Replace with your registry: quay.io/your-org/ai-reviewer-frontend:latest
        image: ai-reviewer-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        # Only the sign-in keys from app-secrets: the rest (database, LLM keys) stays
        # with the API.
        env:
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_SECRET
        - name: AUTH_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_URL
              optional: true
        - name: AUTH_GOOGLE_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_GOOGLE_ID
              optional: true
        - name: AUTH_GOOGLE_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_GOOGLE_SECRET
              optional: true
        - name: AUTH_MICROSOFT_ENTRA_ID_ID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_MICROSOFT_ENTRA_ID_ID
              optional: true
        - name: AUTH_MICROSOFT_ENTRA_ID_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_MICROSOFT_ENTRA_ID_SECRET
              optional: true
        - name: AUTH_MICROSOFT_ENTRA_ID_ISSUER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: AUTH_MICROSOFT_ENTRA_ID_ISSUER
              optional: true
        envFrom:
        - configMapRef:
            name: frontend-config
        resources:
          requests:
            memory: 256Mi
            cpu: 250m
          limits:
            memory: 512Mi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        # Next.js caches the images it optimizes (the profile pictures) under .next/cache.
        # The image's files belong to its own user, not to this pod's, so without a
        # writable volume there each request logs an EACCES error and nothing is cached.
        volumeMounts:
        - name: next-cache
          mountPath: /app/.next/cache
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: next-cache
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
  selector:
    app: frontend
---
# OpenShift Route (ignored on vanilla Kubernetes)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
spec:
  to:
    kind: Service
    name: frontend
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

