[project]
name = "draft-detective"
version = "2.3.3"
description = "AI-powered peer-review document analysis"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "dotenv>=0.9.9",
    "langchain>=1.3.9",
    "langchain-text-splitters>=1.1.2",
    "langchain-openai>=1.1.14",
    "langchain-anthropic>=1.7.4",
    "langchain-google-genai>=4.2.1",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.1.6",
    "langgraph-checkpoint-postgres>=3.1.3",
    "langfuse>=4.15.1",
    "pgvector>=0.2.5,<0.4",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.25",
    "sqlmodel>=0.0.24",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "fastapi[standard]>=0.120.2",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.0",
    "psycopg[binary,pool]>=3.2.10",
    "alembic-postgresql-enum>=1.8.0",
    "pytest-repeat>=0.9.4",
    "xxhash>=3.5.0",
    "httpx>=0.28.1",
    "numpy>=1.24.0",
    "python-docx>=1.1.0",
    "rapidfuzz>=3.0.0",
    "aiofiles>=25.1.0",
    "python-magic>=0.4.27",
    "markitdown[docx,pdf,pptx,xls,xlsx]>=0.1.5",
    "pypdfium2>=5.6.0",
    "pillow>=13.0.0",
    "pyjwt>=2.13.0",
    "mypy>=1.19.1",
    "rich>=14.2.0",
    "tuspyserver>=4.2.3",
    "inspect-ai>=0.3.259",
    "openai>=3.1.0",
    "deepagents>=0.7.19",
    "fastmcp>=4.1.2",
    "cryptography>=50.0.0",
    "pytest-cov>=7.1.0",
    "aiotools>=2.2.3",
    "docx-editor>=0.7.1",
    "microsoft-agents-hosting-core>=1.3.0",
    "microsoft-agents-authentication-msal>=1.3.0",
    "genai-prices>=0.1.6",
    "aenum>=3.1.17",
    "markdown-it-py>=4.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
# Alembic generates these; keep migration history untouched.
extend-exclude = ["alembic/versions"]

[tool.ruff.format]
# Ruff also formats Python blocks inside Markdown; the docs and skills keep
# their snippets as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # Ruff's defaults: pyflakes and the pycodestyle errors
    "PLC0415",  # imports inside functions (AGENTS.md)
    "I",  # import sorting
    "UP",  # pyupgrade
    "B",  # bugbear
    "C4",  # comprehensions
    "PIE",
]
ignore = [
    # Moving a (str, Enum) to StrEnum changes str() and format() of every
    # member, and these values reach the database and the API.
    "UP042",
    # PEP 695 type parameters: a typing refactor, not a lint fix.
    "UP047",
    # zip(strict=) changes behaviour; each call needs its own decision.
    "B905",
    # dict(a=1) is as readable as a literal.
    "C408",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI and FastMCP declare dependencies as call defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastmcp.dependencies.CurrentContext",
    "fastmcp.server.dependencies.CurrentAccessToken",
]

[tool.ruff.lint.isort]
# The repo's alembic/ folder holds migrations, not the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# These suites import a shared fixture by name from a support module and then
# request it as a parameter, which pyflakes reads as a redefinition.
"tests/integration/test_mcp_project_reads.py" = ["F811"]
"tests/integration/test_project_content_views.py" = ["F811"]
"tests/integration/test_project_overview_view.py" = ["F811"]
"tests/integration/test_workflow_run_detail_view.py" = ["F811"]
"tests/unit/services/docx/tracked_changes/test_apply.py" = ["F811"]
"tests/unit/services/docx/tracked_changes/test_conflicts.py" = ["F811"]
"tests/unit/services/docx/tracked_changes/test_planning.py" = ["F811"]

[tool.mypy]
explicit_package_bases = true
exclude = [
    "alembic/versions/",
]

[[tool.mypy.overrides]]
module = ["aenum"]
ignore_missing_imports = true

# docx-editor is annotated throughout but ships no py.typed marker, so mypy
# declines to look at it by default. Following it anyway keeps real types at the
# seam -- Document, ParagraphInfo and the exceptions all check -- rather than
# degrading them to Any, which is what ignoring the import alone would do.
[[tool.mypy.overrides]]
module = ["docx_editor", "docx_editor.*"]
follow_untyped_imports = true

# The Agents SDK ships no py.typed either. Following it keeps real types at the
# seam rather than degrading the adapter and activity models to Any.
[[tool.mypy.overrides]]
module = ["microsoft_agents", "microsoft_agents.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "-n",
    "10",
    # Import test modules by path, not by top-level basename. Required because
    # tests use implicit namespace packages (no __init__.py), so same-named
    # files across per-workflow dirs (e.g. */test_manifest.py) would otherwise
    # collide on import.
    "--import-mode=importlib",
    # Points DATABASE_URL at the *_test database before any test imports lib,
    # so the suite never writes to the .env database.
    "-p",
    "tests.integration_db",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "ruff==0.17.0",
    "types-aiofiles>=25.1.0.20251011",
    "types-pyyaml>=6.0.12.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "evals_inspectai"]
