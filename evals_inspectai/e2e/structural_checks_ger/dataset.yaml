    # School Meal Participation After Universal Free Meals in Maine

    ## Introduction

    Maine became one of the first states to offer free school breakfast and lunch to every student regardless of income in 2022, after federal pandemic waivers expired. Advocates argued that removing means testing would reduce stigma and paperwork, while critics questioned the cost. This report is intended for state education and agriculture officials, school nutrition directors and legislators in states considering similar programs. It builds on evaluations of the federal Community Eligibility Provision, which found that universal meals raised participation in high-poverty schools. Its contribution is the first statewide analysis covering every district, including the low-poverty districts that community eligibility never reached. It covers the 2019–20 through 2023–24 school years and does not examine meal quality or student health outcomes.

    ## Acknowledgements

    We thank the child nutrition staff of the Maine Department of Education for monthly meal counts.

    ## Data and Methods

    We used monthly meal counts reported by every Maine school food authority, linked to enrollment and district poverty rates.

    ## Results

    Lunch participation rose from 51 percent to 69 percent of enrolled students, with the largest gains in districts where fewer than 30 percent of students had previously qualified for free meals.

    ## Conclusion

    Universal free meals raised participation most where few students had qualified before, and states considering the policy should expect their largest gains in low-poverty districts.

    ## References

    1. Schwartz, A. E., and Rothbart, M. W. (2020). Let them eat lunch: The impact of universal free meals on student performance. *Journal of Policy Analysis and Management*, 39(2), 376–410.
    2. Maine Department of Education (2024). *School Nutrition Program Participation Data*.
