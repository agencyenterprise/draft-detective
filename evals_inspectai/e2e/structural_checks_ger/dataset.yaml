# Eval samples for the structural_checks_ger workflow, in inventory form (see
# evals_inspectai/common/issue_inventory.py). The check has three parts, and the samples come from the two
# suites it replaces, each completed so the parts it did not test pass:
#
# - Required sections. A missing section is about something absent, so its expected issue has no anchor and
#   is matched on its "Missing Section: <name>" title, severity high. The exception is an appendix the body
#   refers to but the document lacks: the skill places that issue on the referring sentence, so it is
#   anchored there.
# - About This. A missing preface element has no anchor either and is matched on its "Preface: <rule>
#   Missing" title, severity medium. With no preface, only "Missing Section: About This" is expected.
# - About the Authors. An author issue is anchored on the bio it is about and matched on the stable "Author
#   Bio Issue" part of its title, since the skill puts the author's name after it as written in the bio (with
#   or without "Dr."), severity medium. The skill asks for one issue per author listing every failed rule.
#   With no biographies, only "Missing Section: About the Authors" is expected. Decoys are bios a correct run
#   leaves alone, tagged with the rule that would misfire.
#
# The required-sections samples (the first group) had a short preface and no biographies: each preface was
# extended with sentences covering the elements it lacked, keeping the sample's own sentences and traps, and
# two passing bios were added. The About This and authors samples (the second group) lacked Acknowledgements,
# a Conclusion and References, which were added; two "Data" headings became "Data and Methods". On the two
# published reports, the preface elements a careful reader could judge either way are optional
# (required: false). The skill proposes no edits.


