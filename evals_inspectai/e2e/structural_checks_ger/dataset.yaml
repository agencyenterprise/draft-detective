    # Evaluation of Early Childhood Education Programmes

    ## About This Report

    This evaluation assesses the effectiveness of three early childhood education programmes funded by the European Commission. Public spending on early childhood education has grown across Europe, but evidence comparing programme models remains scarce. It aims to determine which of the three programmes most improves school readiness. It is intended for programme funders at the European Commission and for national education ministries. It builds on Heckman's (2006) work on early skill formation and on the OECD's Starting Strong reviews. Its contribution is a three-year comparison of the programmes against a matched control group. It covers children aged three to five in the three funded programmes and does not examine outcomes after school entry.

    ## Acknowledgements

    We thank the programme coordinators and participating families for their cooperation throughout the data collection phase.

    ## Methods

    A quasi-experimental design compared outcomes for 1,200 children enrolled in the programmes against a matched control group over three years.

    ## Results

    Children in all three programmes showed significantly higher school-readiness scores compared to the control group. Programme C showed the largest effect size (d = 0.72).

    Full statistical breakdowns are presented in Appendix A.

    ## Conclusion

    All three programmes demonstrated positive outcomes. Programme C should be prioritised for scale-up given its superior effect sizes.

    ## References

    1. Heckman, J. J. (2006). Skill formation and the economics of investing in disadvantaged children. *Science*, 312(5782), 1900–1902.
    2. OECD (2021). *Starting Strong: Supporting Families and Children*. Paris: OECD Publishing.

    ## About the Authors

    Dr. Elise Martin is a senior evaluator at the Centre for Early Education Research. Her research focuses on early childhood programme evaluation. She holds a Ph.D. in education from the University of Amsterdam.

    Jonas Weber is a research analyst at the Centre for Early Education Research. His research focuses on school readiness measurement. He holds an M.Sc. in psychology from Leiden University.
