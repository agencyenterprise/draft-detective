    # Research Report on Climate Adaptation

    ## About This Report

    This report examines climate adaptation strategies across coastal communities. It was produced by the Research Institute for Environmental Studies to inform policy decisions. Coastal flooding has grown more frequent, yet local governments have little comparable evidence on which adaptation measures work. It aims to identify which adaptation measures most reduce flood-related disruption. It is intended for coastal planners and for state and federal adaptation funders. It builds on the IPCC's Sixth Assessment Report and on recent work on coastal resilience metrics (Jones and Smith, 2022). Its contribution is a comparison of communities with and without adaptation plans that draws on both sea-level data and interviews. It covers 12 coastal communities and does not examine inland or riverine flooding.

    ## Acknowledgements

    The authors thank the many researchers, government officials, and community members who contributed their time and expertise to this work. Funding was provided by the National Science Foundation.

    ## Methods

    We conducted a mixed-methods study combining quantitative analysis of sea-level data with qualitative interviews across 12 coastal communities. Data were collected between January and June 2024.

    ## Results

    Findings indicate that communities with dedicated adaptation plans experienced 40% fewer flood-related disruptions than those without. Early warning systems were the single most cost-effective intervention identified.

    ## Conclusion

    Coastal communities that invest in proactive adaptation measures are significantly better positioned to withstand climate shocks. Policymakers should prioritise funding for community-led adaptation planning.

    ## References

    1. IPCC, 2023. *Sixth Assessment Report: Impacts, Adaptation and Vulnerability*. Geneva: IPCC.
    2. Jones, A., & Smith, B. (2022). Coastal resilience metrics. *Journal of Climate Policy*, 18(3), 45–67.

    ## About the Authors

    Dr. Maya Patel is a senior researcher at the Research Institute for Environmental Studies. Her research focuses on coastal flood risk and adaptation planning. She holds a Ph.D. in environmental science from the University of Miami.

    Owen Clarke is a policy analyst at the Research Institute for Environmental Studies. His research focuses on local climate adaptation finance. He holds an M.P.P. from Duke University.
