    # Apprenticeship Completion in the Construction Trades

    ## About This Report

    This report looks at why apprentices in the construction trades do or do not finish their programs. Fewer than two thirds of construction apprentices in the state finish their programs, and contractors report shortages of journey-level workers. It aims to identify which program features predict completion. It is intended for the state apprenticeship council, trade unions and contractors. It builds on Kuehn's (2019) national study of apprenticeship completion. Its contribution is the first study to follow a full cohort of the state's construction apprentices. It covers apprentices who started in 2018 and does not examine other trades.

    ## Acknowledgements

    We thank the state apprenticeship council and the four trade unions that shared program records.

    ## Methods

    We followed 2,300 apprentices who started programs in 2018 and surveyed 410 of them. The survey instrument is reproduced in Appendix B.

    ## Results

    Fifty-eight percent finished within six years. Apprentices who had a mentor on their first job site were 1.6 times as likely to finish.

    ## Conclusion

    Assigning a mentor on the first job site is a low-cost way to raise completion.

    ## References

    1. Kuehn, D. (2019). Registered apprenticeship completion. *Industrial Relations*, 58(3), 402–431.

    ## About the Authors

    Dr. Erin Walsh is a senior researcher at the State Workforce Research Institute. Her research focuses on apprenticeship and workforce training. She holds a Ph.D. in labor economics from Cornell University.

    Andre Silva is a research analyst at the State Workforce Research Institute. His research focuses on construction labor markets. He holds an M.A. in sociology from the University of Pittsburgh.

    ## Appendix B: Survey Instrument

    Q1. How many job sites have you worked on since starting your apprenticeship? Q2. Did someone on your first job site help you learn the trade?
