    # Road Salt and Stream Chloride

    ## About This Report

    This report measures how winter road salt affects chloride levels in the county's streams. Chloride levels in the county's streams have risen for two decades, and road salt is the suspected cause. It aims to measure how much salt applied on nearby roads raises stream chloride. It is intended for the county highway department and watershed managers. It builds on research on freshwater salinization (Kaushal, 2018). Its contribution is four years of monthly readings matched to salt application records. It covers 18 streams from 2021 to 2024 and does not examine groundwater.

    ## Acknowledgements

    The county highway department shared salt application records, and volunteers from the watershed council collected water samples.

    ## Methods

    We sampled 18 streams monthly from 2021 to 2024 and matched chloride readings to salt applied on nearby roads. Monitoring site coordinates are listed in Appendix A.

    ## Results

    Chloride levels in streams near major roads exceeded the chronic toxicity threshold in 9 of 12 winter months, against 1 of 12 for streams away from roads.

    ## Conclusion

    Reducing salt on roads near streams would do the most to lower chloride levels.

    ## References

    1. Kaushal, S. (2018). Freshwater salinization syndrome. *PNAS*, 115(4), E574–E583.

    ## About the Authors

    Dr. Anna Fischer is a senior hydrologist at the County Watershed Research Center. Her research focuses on road salt and freshwater salinization. She holds a Ph.D. in hydrology from the University of Arizona.

