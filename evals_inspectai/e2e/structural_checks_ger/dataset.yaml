    # Library Wi-Fi Hotspot Lending

    ## About This Report

    This report reviews the first year of the library system's program lending mobile Wi-Fi hotspots. Many households in the library system's area have no home internet, and the library began lending hotspots to fill that gap. It aims to measure how often hotspots are borrowed and what borrowers use them for. It is intended for library administrators and the county board. It builds on the Public Library Association's (2023) survey of digital equity programs. Its contribution is the first year of lending and borrower data for the program. It covers all 600 hotspots in the program's first year and does not examine other digital equity services.

    ## Acknowledgements

    Branch managers across the library system collected the lending data for this report.

    ## Methods

    We analysed lending records for all 600 hotspots and surveyed 250 borrowers when they returned a device.

    ## Results

    Hotspots were checked out 91 percent of the time. Most borrowers used them for schoolwork or job applications.

    ## Conclusion

    Demand exceeds supply, and the library should add hotspots at the branches with the longest waiting lists.

    ## References

    1. Public Library Association (2023). *Digital Equity Programs Survey*.

