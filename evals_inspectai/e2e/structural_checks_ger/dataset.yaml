    # Community Health Worker Programs and Emergency Visits

    ## Foreword

    Community health worker programs have spread quickly, but evidence on whether they reduce emergency visits is thin. This report reviews one county's program to help other counties decide whether to adopt it. It aims to estimate whether the county's program reduced emergency visits among the residents it enrolled. It is intended for county health officials and hospital systems weighing similar programs. It builds on earlier studies of community health workers and acute care use (Rivera and Chen, 2022). Its contribution is a matched comparison of enrollees with similar residents over 18 months. It covers one county's program from 2021 to 2023 and does not examine program costs or patient satisfaction.

    ## Thanks

    The county health department shared program records, and the regional hospital system provided visit data. Their staff answered many questions.

    ## Data and Methods

    We matched 3,400 program enrollees to 3,400 similar residents who did not enroll, using age, diagnosis and prior visits, and compared emergency visits over 18 months.

    ## Outcomes

    Enrollees made 23 percent fewer emergency visits than the matched group. The gap was largest for residents with diabetes and smallest for residents with asthma.

    ## Recommendations

    Counties considering a program should target residents with chronic conditions that need regular follow-up, such as diabetes, where the program's effect was largest.

    ## Sources

    - County Health Department, *Community Health Worker Program Records, 2021–2023*.
    - Rivera, P., and Chen, M. (2022). Community health workers and acute care use. *Health Affairs*, 41(6), 812–820.

    ## About the Authors

    Dr. Rosa Alvarez is a senior health services researcher at the County Health Research Institute. Her research focuses on community health worker programs and acute care use. She holds a Ph.D. in health policy from the University of North Carolina.

    Peter Lin is a biostatistician at the County Health Research Institute. His research focuses on matched comparison designs for program evaluation. He holds an M.S. in biostatistics from Emory University.
