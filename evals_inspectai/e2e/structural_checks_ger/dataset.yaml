    # Wildfire Smoke and School Attendance

    ## Introduction

    This report asks how wildfire smoke days affect school attendance in the western part of the state. Wildfire smoke days have become more common in the state, and schools have little guidance on how they affect attendance. It is intended for state education officials and school district leaders. It builds on research on behavioural responses to wildfire smoke (Burke et al., 2022). Its contribution is a school-level estimate for the western part of the state. It covers 210 schools from 2019 to 2023 and does not examine learning outcomes.

    ## Acknowledgements

    We thank the state education agency for attendance records and the air quality district for daily monitor data.

    ## Methods

    We linked daily attendance for 210 schools to the nearest air quality monitor for the 2019–2023 school years and compared attendance on smoke days with other days at the same school.

    ## Results

    Attendance fell by 1.8 percentage points on smoke days and by 3.1 points on days with the highest particulate readings. Elementary schools saw larger drops than high schools.

    ## References

    1. Burke, M., et al. (2022). Exposures and behavioural responses to wildfire smoke. *Nature Human Behaviour*, 6, 1351–1361.

    ## About the Authors

    Dr. Lena Park is a senior epidemiologist at the Western Environmental Health Institute. Her research focuses on air pollution and children's health. She holds a Ph.D. in environmental health from the University of Washington.

    Diego Morales is a research associate at the Western Environmental Health Institute. His research focuses on school attendance data. He holds an M.P.H. from Oregon Health & Science University.
