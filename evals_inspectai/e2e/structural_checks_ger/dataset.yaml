    # Eviction Filings After the End of Pandemic Protections

    ## About This Report

    When federal and state eviction moratoria expired in 2021 and 2022, housing advocates warned of a surge in filings, but courts in different states reported sharply different trends. This report aims to measure how eviction filings changed after the moratoria ended and which local policies were associated with smaller increases. It is intended for state and local housing officials, court administrators and legal aid organizations. It draws on the Eviction Lab's national filing series and on earlier evaluations of right-to-counsel programmes in New York City and San Francisco. The report contributes new court-record data for 38 counties that had no public filing series before 2023. It covers residential eviction filings from January 2019 through December 2024 and does not examine informal evictions or commercial tenancies.

    ## Acknowledgements

    We thank the clerks of the 38 county courts who provided docket records.

    ## Data and Methods

    We collected docket-level filing records from 38 county courts and matched them to local policy changes.

    ## Findings

    Filings returned to 85 percent of their prepandemic level by 2024. Counties with emergency rental assistance or right-to-counsel programmes saw smaller rebounds.

    ## Conclusion

    Rental assistance and right-to-counsel programmes were associated with smaller rebounds in filings, and states planning for future housing shocks should weigh them first.

    ## References

    1. Eviction Lab (2024). *Eviction Tracking System*. Princeton, NJ: Princeton University.
    2. Ellen, I. G., O'Regan, K., House, S., and Brenner, R. (2021). Do lawyers matter? Early evidence on eviction patterns after the rollout of universal access to counsel in New York City. *Housing Policy Debate*, 31(3–5), 540–561.

