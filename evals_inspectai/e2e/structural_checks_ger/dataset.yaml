    # Food Bank Demand After Benefit Reductions

    ## About This Report

    This report examines how demand at the county's food banks changed after emergency food benefits ended in March 2023. When emergency food benefits ended, food bank directors warned they could not meet the demand that would follow. It aims to measure how much visits rose and who the new visitors were. It is intended for county officials and food bank funders. It builds on Hartman and Liu's (2021) work on measuring food bank use. Its contribution is the first county-wide count of visits across all 11 food banks. It covers 2022 to 2024 and does not examine other food assistance programs.

    ## Methods

    We analysed monthly visit logs from 11 food banks for 2022–2024 and interviewed their directors. Visit counts follow Hartman and Liu (2021), and the benefit timeline follows the state social services department (2023).

    ## Results

    Visits rose 34 percent in the six months after benefits ended, and first-time visitors made up almost half of the increase. Directors reported running short of fresh produce most weeks.

    ## Conclusion

    The end of emergency benefits sharply raised demand, and food banks will need more fresh food supply to meet it.

    ## About the Authors

    Dr. Nora Kim is a senior researcher at the County Social Policy Institute. Her research focuses on food insecurity and benefit programs. She holds a Ph.D. in social work from Washington University in St. Louis.

