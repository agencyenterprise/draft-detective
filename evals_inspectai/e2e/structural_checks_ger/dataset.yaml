    # Congestion Pricing and Transit Ridership in Stockholm and London

    ## Preface

    New York City began charging vehicles to enter lower Manhattan in January 2025, and other large cities are considering similar charges, yet evidence on how congestion pricing affects public transit comes mostly from the first years of European schemes. This report aims to estimate how transit ridership changed in Stockholm and London in the decade after each city introduced congestion charges, and what drove those changes. It is intended for city transportation officials, transit agency planners and state legislators considering congestion pricing. It builds on Eliasson's (2014) evaluation of the Stockholm trial and on Transport for London's annual monitoring reports, which cover only the first years of each scheme. The report's contribution is a consistent ten-year comparison of the two cities that separates the effect of the charge from fare changes and service expansions. It covers bus and rail ridership within each charging zone and does not examine air quality, retail sales or equity effects.

    ## Acknowledgements

    We thank Transport for London and Region Stockholm for ridership data by line.

    ## Methods

    We assembled monthly ridership by line for both cities and used synthetic control methods to estimate ridership without the charge.

    ## Findings

    Transit ridership into the charging zones was 6 to 9 percent higher after ten years than the synthetic controls predicted. About half of the gain in London came from bus service added with charge revenue.

    ## Conclusion

    Congestion charges raised transit ridership in both cities over a decade, and cities adopting one should plan to put part of the revenue into transit service.

    ## References

    1. Eliasson, J. (2014). *The Stockholm Congestion Charges: An Overview*. CTS Working Paper 2014:7. Stockholm: Centre for Transport Studies.
    2. Transport for London (2008). *Central London Congestion Charging: Impacts Monitoring, Sixth Annual Report*. London: TfL.

    ## The Authors

    Dr. Ingrid Svensson is a professor of transport economics at the Nordic Institute for Urban Studies. Her research focuses on road pricing, public transit demand and the evaluation of urban transport policy. She holds a Ph.D. in economics from the Stockholm School of Economics.

    James Whitfield is a senior transport planner at the Metropolitan Mobility Research Group in London. His work centres on transit service planning and the use of congestion charge revenue. He earned an M.Sc. in transport planning from University College London.
