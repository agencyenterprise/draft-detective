    # Medicaid Renewal Outreach

    ## About This Report

    This report evaluates text-message reminders the state sent to Medicaid enrollees before their coverage renewal date. Many Medicaid enrollees lose coverage at renewal because they miss paperwork deadlines, not because they are no longer eligible. It aims to estimate whether the reminders raised on-time renewal. It is intended for state Medicaid officials and enrollment assisters. It builds on research on Medicaid churning (Sommers, 2020). Its contribution is a comparison of counties that sent reminders with counties that had not yet started. It covers 48,000 enrollees and does not examine other outreach methods.

    ## Acknowledgements

    The state Medicaid agency provided enrollment records and message logs.

    ## Methods

    We compared renewal rates for 48,000 enrollees who received reminders with those of similar enrollees in counties that had not yet started sending them. Detailed regression tables are provided in the appendix.

    ## Results

    Enrollees who received reminders were 6 percentage points more likely to renew on time.

    ## Conclusion

    Text reminders are an inexpensive way to reduce coverage loss at renewal, and the state should send them in every county.

    ## References

    1. Sommers, B. (2020). Medicaid churning. *Health Affairs*, 39(1), 1–8.

