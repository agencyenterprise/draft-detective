    # Container Port Congestion and Retail Prices

    ## About This Report

    In 2021 and 2022, backlogs at the ports of Los Angeles and Long Beach left hundreds of container ships waiting offshore, and retailers warned that shipping delays would push up shelf prices. This report aims to measure how much of the rise in retail goods prices during that period can be attributed to port congestion. It is written for trade and transportation policymakers, port authorities and economists who study inflation. It builds on the Federal Reserve Bank of New York's Global Supply Chain Pressure Index and on recent studies of shipping costs and import prices. The report contributes estimates at the product level, linking container dwell times to price changes for 240 imported goods. It covers goods imported through West Coast ports between 2019 and 2023 and does not address air freight or services prices.

    ## Acknowledgements

    We thank U.S. Customs and Border Protection for access to import records.

    ## Approach

    We matched vessel-level dwell times to customs records and scanner price data for imported consumer goods.

    ## Findings

    Port congestion accounts for roughly one-fifth of the increase in prices of imported durable goods in 2021. Its effect faded within six months of backlogs clearing.

    ## Conclusion

    Port congestion explains a modest and short-lived share of the 2021 rise in durable goods prices, so port investment alone would do little to prevent a similar spike.

    ## References

    1. Benigno, G., di Giovanni, J., Groen, J. J. J., and Noble, A. I. (2022). *The GSCPI: A New Barometer of Global Supply Chain Pressures*. Federal Reserve Bank of New York Staff Reports, No. 1017.
    2. Carrière-Swallow, Y., Deb, P., Furceri, D., Jiménez, D., and Ostry, J. D. (2023). Shipping costs and inflation. *Journal of International Money and Finance*, 130, 102771.

    ## About the Authors

    Dr. Samuel Osei is a senior fellow at the Center for Trade and Logistics Research. His research focuses on maritime shipping, port operations and supply chain resilience. He previously advised the federal Maritime Administration on port investment priorities.

    Laura Jensen is an economist at the Center for Trade and Logistics Research. She studies import prices and the pass-through of shipping costs to consumers. She holds an M.S. in economics from the London School of Economics.
