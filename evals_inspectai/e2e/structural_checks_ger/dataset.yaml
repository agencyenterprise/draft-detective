    # Broadband Subsidies and Small Business Sales

    #### Introduction

    This report asks whether a state broadband subsidy raised online sales for small businesses in rural counties. Many rural small businesses still lack fast internet, and the state has spent heavily on subsidies to close that gap. It is intended for state economic development officials and broadband offices. It builds on Kim's (2022) work on rural broadband and firm growth. Its contribution is the first business-level estimate of the subsidy's effect on sales. It covers small businesses in rural counties and does not examine urban businesses or employment.

    #### Approach

    We compared sales tax records for 1,150 businesses in subsidised and unsubsidised counties before and after the program began.

    #### Findings

    Online sales grew 14 percent faster in subsidised counties. Businesses that had no website before the program saw the largest gains.

    #### Conclusions

    Subsidies helped most where businesses had not yet moved online, which suggests pairing them with help building a first website.

    **Acknowledgements.** We are grateful to the state revenue department for access to anonymised sales tax records and to the rural development office for program data.

    **References.** Kim, S. (2022). Rural broadband and firm growth. *Regional Science Review*, 30(4), 55–71. State Broadband Office (2023). *Program Report, Year Two*.

    #### About the Authors

    Dr. Hannah Brooks is a senior economist at the Rural Economy Research Center. Her research focuses on rural broadband and small business growth. She holds a Ph.D. in economics from Iowa State University.

    Victor Osei is a research analyst at the Rural Economy Research Center. His research focuses on state tax data and firm performance. He holds an M.A. in economics from the University of Nebraska.
