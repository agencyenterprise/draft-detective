    # Teacher Retention in Rural School Districts

    ## Preface

    This report examines why teachers leave rural districts in the state and what districts have tried in response. It was written for the state education department and district superintendents. Rural districts in the state have struggled to keep teachers for a decade, and some have lost a fifth of their staff in a single year. It aims to identify the main reasons teachers leave and which district responses keep them. It builds on Ingersoll's (2021) national work on rural teacher turnover. Its contribution is the first account to pair the state's personnel records with interviews of teachers who left. It covers 14 rural districts from 2018 to 2024 and does not examine urban or suburban districts.

    ## Acknowledgments

    We thank the superintendents of the 14 participating districts and the teachers who took part in interviews. The study was funded by the Hollis Family Foundation.

    ## Research Design

    We combined state personnel records for 2018–2024 with 62 semi-structured interviews with current and former teachers. Retention was measured as the share of teachers who returned to the same district the following year.

    ## Key Findings

    Retention in rural districts averaged 81 percent, eight points below the state average. Former teachers most often cited housing costs and isolation, not pay, as the reason they left.

    ## Discussion

    Housing support may matter more than salary increases for rural retention. Districts that offered subsidised housing kept 88 percent of their teachers.

    ## Works Cited

    1. Ingersoll, R. (2021). *Teacher turnover in rural America*. Philadelphia: CPRE.
    2. Morales, L. (2023). Housing and the rural teacher labor market. *Education Finance and Policy*, 18(2), 201–224.

    ## About the Authors

    Dr. Laura Nguyen is a senior researcher at the State Education Policy Center. Her research focuses on the rural teacher labor market. She holds a Ph.D. in education policy from Vanderbilt University.

    Caleb Ford is a research associate at the State Education Policy Center. His research focuses on teacher housing and compensation. He holds an M.Ed. from the University of Kansas.
