    # Groundwater Pricing and Farm Water Use in the Central Valley

    ## Preface

    Groundwater levels in California's Central Valley have fallen sharply over the past two decades, and the state's 2014 groundwater law now requires local agencies to bring basins into balance. This report sets out to estimate how farmers would change their pumping if agencies charged a per-acre-foot fee, and to identify fee levels that would meet sustainability targets. It builds on earlier work by Bruno and Jessoe (2021), who estimated the price elasticity of agricultural water demand from electricity records, and on the Public Policy Institute of California's basin-level assessments. Its main contribution is a field-level demand model that links pumping records to crop choices, which earlier studies could only approximate at the district level.

    ## Acknowledgements

    We thank the three groundwater sustainability agencies for metered pumping records and their staff for answering questions about local allocation rules.

    ## Data and Methods

    We combined metered pumping records for 1,840 fields in three groundwater sustainability agencies with satellite crop maps for 2016–2023. A discrete-continuous choice model estimates how crop mix and irrigation intensity respond to the marginal cost of water.

    ## Findings

    A fee of $60 per acre-foot would reduce pumping by an estimated 14 percent, mostly by shifting fields from alfalfa to fallow or to less water-intensive crops. Permanent crops such as almonds responded little in the short run.

    ## Conclusion

    A per-acre-foot fee can cut pumping substantially within a few years, but agencies that rely on one should expect little response where permanent crops dominate.

    ## References

    1. Bruno, E. M., and Jessoe, K. (2021). Missing markets: Evidence on agricultural groundwater demand from volumetric pricing. *Journal of Public Economics*, 196, 104374.
