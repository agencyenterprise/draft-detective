    # Evaluating a Guaranteed Income Pilot: Interim Report

    ## About This Report

    This interim report describes the design of the city's guaranteed income pilot, which pays 500 families $750 a month for two years. Results of the evaluation are expected in 2027. Guaranteed income pilots have spread across the country, but few have tested payments to families at this scale. It aims to set out the pilot's design and how the evaluation will judge it. It is intended for city officials, funders and other cities planning similar pilots. It builds on the evaluation of Stockton's guaranteed income demonstration (West et al., 2021). Its contribution is a lottery-based design that lets the evaluation attribute outcomes to the payments. It covers the pilot's design and enrolment and does not report outcomes, which the final report will present.

    ## Acknowledgements

    The pilot is funded by the city and the Larkin Foundation. We thank the families who agreed to take part.

    ## Methods

    Families were chosen by lottery from 4,100 applicants, and 500 families who applied but were not chosen form the comparison group. Both groups complete a survey every six months on employment, housing and health.

    ## Conclusion

    The lottery design will let the evaluation attribute differences between the groups to the payments themselves. The final report will compare the groups on each survey measure.

    ## References

    1. West, S., et al. (2021). *Preliminary Analysis: SEED's First Year*. Stockton Economic Empowerment Demonstration.

    ## About the Authors

    Dr. Imani Wright is a senior researcher at the City Economic Mobility Lab. Her research focuses on cash transfer programs and family well-being. She holds a Ph.D. in economics from the University of Chicago.

