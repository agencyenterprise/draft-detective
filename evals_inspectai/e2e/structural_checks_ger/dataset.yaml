    # Hospital Price Transparency Compliance, 2021–2024

    ## Introduction

    Federal rules have required hospitals to post their negotiated prices online since January 2021, yet early audits found that many hospitals posted incomplete or unusable files. This report assesses how far hospital compliance has improved and whether posted prices can support comparison shopping by patients. It is written for federal and state regulators, health plan benefit designers and patient advocates who rely on these files. It extends the compliance audits published by Turquoise Health and by Jiang et al. (2023), which examined only the first year of the rule. The report's contribution is the first four-year panel of compliance scores, built with a scoring method that separates missing files from files that are present but unusable. The analysis covers general acute-care hospitals in the 20 most populous states and does not assess price accuracy, critical-access hospitals or ambulatory surgery centres.

    ## Acknowledgements

    We thank the state hospital associations that answered our questions about file formats.

    ## Approach

    We downloaded each hospital's machine-readable file every six months and scored it against the rule's required data elements.

    ## Results

    Full compliance rose from 21 percent of hospitals in 2021 to 58 percent in 2024. Files that were present but unusable remained common among hospitals in large systems.

    ## Conclusion

    Compliance has improved but remains incomplete, and regulators should judge hospitals on whether their files can be used, not only on whether a file is posted.

    ## References

    1. Jiang, J. X., Polsky, D., Littlejohn, J., Wang, Y., Zare, H., and Bai, G. (2023). Patterns of hospital price transparency compliance. *JAMA Health Forum*, 4(5), e231187.
    2. Turquoise Health (2022). *Price Transparency Impact Report*.

    ## Contributors

    Dr. Rachel Adeyemi is a health economist at the Northgate Health Policy Institute. Her research examines hospital pricing and insurer–provider bargaining. She holds a Ph.D. in health policy from Harvard University.

    Kevin Marsh is a research associate at the Northgate Health Policy Institute, where he studies price transparency regulation. He built the compliance scoring tool used in this report.

    Sofia Lindqvist is a data scientist at the Northgate Health Policy Institute. Her work focuses on large-scale collection and cleaning of health care price data. She earned an M.S. in statistics from the University of Washington.
