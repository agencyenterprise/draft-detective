    # Four-Day School Weeks in Rural Missouri

    ## About This Publication

    Over the past decade, more than a quarter of Missouri's school districts have moved to a four-day week, most citing tight budgets and difficulty recruiting teachers. This publication aims to estimate how the switch affected student achievement, teacher retention and district spending. It is written for school board members, state education officials and legislators weighing limits on the practice. Its contribution is a comparison of districts that adopted the four-day week with similar districts that did not, using six years of data from before and after adoption. The analysis is limited to rural districts that switched between 2017 and 2021 and does not address urban or suburban districts or effects on families' child-care costs.

    ## Acknowledgements

    We thank the Missouri Department of Elementary and Secondary Education for district-level enrollment, staffing and finance data.

    ## Method

    We matched 61 adopting districts to 122 comparison districts on enrollment, spending and prior test scores and compared their trends.

    ## Results

    Achievement growth in mathematics was slightly slower in adopting districts, while teacher turnover fell by four percentage points. Spending savings averaged less than 2 percent.

    ## Conclusion

    The four-day week saved districts little and slowed mathematics growth slightly, while it helped districts keep their teachers; legislators should weigh both before limiting the practice.

    ## References

    1. Missouri Department of Elementary and Secondary Education (2023). *Four-Day School Week Districts, 2010–2023*.
    2. Missouri Department of Elementary and Secondary Education (2024). *Annual Performance Report Data Files*.

    ## About the Author

    Nathan Brooks is a policy researcher at the Heartland Education Policy Institute. His research focuses on school finance and the rural teacher labor market. He holds an M.P.P. from the Harris School of Public Policy at the University of Chicago.
