    # Recycling Contamination in Curbside Collection

    ## About This Report

    This report looks at how much non-recyclable material ends up in the city's curbside recycling bins and why. Contaminated loads raise the city's recycling costs, and the sorting facility has rejected more of them each year. It aims to measure how much non-recyclable material reaches curbside bins and which items cause it. It is intended for the city's solid waste division and council. It builds on research on household sorting errors (Nguyen, 2021) and on the city's 2022 waste characterization study. Its contribution is a bin-level audit across eight neighbourhoods. It covers curbside bins in 2024 and does not examine commercial recycling.

    ## Acknowledgements

    The city's solid waste division provided audit data, and the regional sorting facility let us observe its lines.

    ## Methods

    We audited 400 bins across eight neighbourhoods in spring and fall 2024, sorting each bin's contents by material.

    ## Results

    One bin in five contained enough non-recyclable material to contaminate a load. Plastic bags were the most common contaminant.

    ## Conclusion

    Targeted outreach about plastic bags would remove the largest single source of contamination.

    ## References

    1. City Solid Waste Division (2023). *Technical Appendix to the 2022 Waste Characterization Study*.
    2. Nguyen, T. (2021). Household sorting errors in single-stream recycling. *Waste Management*, 120, 45–53.

    ## About the Authors

    Dr. Rachel Moore is a senior researcher at the City Sustainability Research Office. Her research focuses on household recycling behaviour. She holds a Ph.D. in environmental policy from the University of California, Berkeley.

    Jamal Hassan is a research analyst at the City Sustainability Research Office. His research focuses on waste audits and material recovery. He holds an M.S. in environmental engineering from the University of Washington.
