    # Workforce Training Vouchers: Evaluation of the State Pilot

    ## Background

    The U.S. Department of Labor funds the training voucher program. The state workforce agency sets eligibility rules, and eleven local workforce boards issue vouchers, which participants spend at community colleges and private training providers.

    ## Findings

    Participants at the four boards whose career counselors worked on community college campuses completed training at a rate of 78 percent, compared with 61 percent at the seven boards without on-campus counselors.

    None of the eleven boards reported participants' employment outcomes beyond six months after training, so the evaluation could not tell whether earnings gains persisted.

    Under pilot waivers at two boards, part-time workers who received vouchers completed training at the same rate as full-time workers (71 percent and 73 percent). Current eligibility rules exclude part-time workers in the other nine areas.

    ## Recommendations

    1. Improve outcomes for program participants through stronger coordination.
    2. The state workforce agency should require local boards to report participants' employment outcomes beyond six months after training.
    3. Policymakers should expand eligibility for training vouchers to part-time workers.
  expected_issues:
  - id: improve_outcomes_support
    anchor: Improve outcomes for program participants through stronger coordination.
    severity: medium
  - id: improve_outcomes_not_actionable
    title: Recommendation Not Actionable
    anchor: Improve outcomes for program participants through stronger coordination.
    severity: medium
  - id: improve_outcomes_audience
    title: Recommendation Audience Unclear
    anchor: Improve outcomes for program participants through stronger coordination.
    severity: medium
  - id: report_outcomes_support
    anchor: The state workforce agency should require local boards to report
    severity: none
  - id: part_time_support
    anchor: Policymakers should expand eligibility for training vouchers to part-time workers.
    severity: medium
  - id: part_time_audience
    title: Recommendation Audience Unclear
    anchor: Policymakers should expand eligibility for training vouchers to part-time workers.
    severity: medium
  decoys:
  - anchor: Improve outcomes for program participants through stronger coordination.
    title: Too Many Recommendations
    reason: three_or_fewer
  notes: 'Four parties could act (the federal department, the state agency, local boards, colleges). Recommendation 1
    states a goal with an abstract means and no actor; the co-located counselor finding backs its direction only
    generically (partial). Recommendation 2 names its actor and a concrete step the six-month gap supports. Recommendation
    3 names only "policymakers" and extends a two-board waiver result to the other nine areas (partial, pilot-to-similar-sites).'
