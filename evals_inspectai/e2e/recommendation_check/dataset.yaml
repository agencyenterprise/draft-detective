    # Reducing Wait Times for Disability Claims

    ## Background

    The Social Security Administration decides disability claims with help from state Disability Determination Services offices, which gather medical evidence. Claimants' doctors and hospitals supply records.

    ## Findings

    Claims waited a median of 41 days for medical records requested by mail, compared with 9 days for records requested through the electronic exchange that 12 of the 50 state offices use.

    State offices that used the exchange decided claims a median of 34 days faster than those that did not, after accounting for claim type.

    In interviews, staff at every one of the 38 offices without the exchange named the setup cost as the main obstacle.

    ## Conclusions

    Electronic records exchange was associated with markedly shorter decision times.

    ## Recommendations

    1. The Social Security Administration should fund the setup of the electronic records exchange in the 38 state offices that do not yet use it.
    2. State Disability Determination Services offices should request medical records through the electronic exchange whenever a provider participates in it.
  expected_issues:
  - id: fund_exchange_support
    anchor: The Social Security Administration should fund the setup of the electronic records exchange
    severity: none
  - id: request_electronically_support
    anchor: State Disability Determination Services offices should request medical records
    severity: none
  decoys:
  - anchor: Electronic records exchange was associated with markedly shorter decision times.
    reason: conclusion
  - anchor: The Social Security Administration should fund the setup of the electronic records exchange
    title: Too Many Recommendations
    reason: three_or_fewer
  notes: 'Well-formed recommendations: each names its actor and a concrete, supported step. Only the two informational
    support issues are expected.'
