    # Annual Air Quality Report

    ## Overview

    This report summarises pollutant readings across twelve monitoring stations between January and December.

    ## PM2.5 Trends

    Mean annual PM2.5 fell from 24 µg/m³ in the previous year to 21 µg/m³ this year, a reduction of approximately 12 percent. The station closest to the new low-emission zone (Station 4) showed a 28 percent reduction.

    ## NO₂ Trends

    NO₂ readings were stable across all stations, with no statistically significant change year-over-year.

    ## Ozone Trends

    Ozone showed a small seasonal increase in summer months, consistent with prior years.

    ## Conclusion

    The data indicate that targeted low-emission zones are correlated with localised PM2.5 reductions. NO₂ levels were unchanged. Ozone showed the usual seasonal pattern.
  decoys:
  - anchor: targeted low-emission zones are correlated with localised PM2.5 reductions
    reason: conclusion
  - anchor: Ozone showed the usual seasonal pattern
    reason: conclusion
  notes: 'Findings and a factual conclusion only: no calls to action. The decoys are conclusion sentences that restate
    findings and must not be read as recommendations.'
