# Eval samples for the recommendation_check workflow, in inventory form: one expected issue per
# recommendation occurrence, anchored by its wording, with the severity its classification maps to
# (none = supported, medium = partially supported, high = unsupported). Titles are free-form for
# this workflow, so none is named. See evals_inspectai/common/issue_inventory.py.
# Figures are referenced by local PNG path and inlined at upload.
- input: |
    # Remote Work Productivity Study

    ## Findings

    A twelve-month survey of 1,240 employees across four departments found that median self-reported productivity rose by 14 percent after the introduction of fully remote work. Engineering teams showed the largest gain at 19 percent, while customer support saw a smaller but still positive 6 percent gain. Meeting hours fell by an average of 4.2 hours per week per employee.

    Employee retention over the study period rose from 82 percent to 91 percent year-over-year, with exit-interview data attributing the change primarily to schedule flexibility.

    ## Recommendations

    1. Continue the fully remote work policy across all four departments based on the sustained productivity and retention gains observed.
    2. Reduce the standing-meeting load further by capping recurring meetings at six hours per week per employee, building on the observed 4.2-hour reduction.
    3. Expand schedule flexibility to contractor staff, who were not covered by the present study.
  expected_issues:
  - id: continue_remote
    anchor: Continue the fully remote work policy across all four departments
    severity: none
  - id: cap_meetings_six_hours
    anchor: capping recurring meetings at six hours per week
    severity: medium
  - id: contractor_flexibility
    anchor: Expand schedule flexibility to contractor staff
    severity: high
  notes: Recommendation 1 restates the productivity and retention findings. Recommendation 2 adds a six-hour cap
    the 4.2-hour finding does not establish (threshold rule). Recommendation 3 extends to contractors the study
    never covered (out-of-scope population).
- input: |
    # Coastal Erosion Mitigation: Pilot Programme Report

    ## Findings

    The pilot installed permeable groynes at three of the five monitoring sites (S1, S2, S3) over a 24-month period. Sites S4 and S5 served as untreated controls.

    Mean annual erosion at the treated sites fell from 58 mm/year to 22 mm/year, a 62 percent reduction. The control sites showed no significant change (61 mm/year vs 59 mm/year). Cost per linear metre of intervention was 1,420 USD, roughly 30 percent below the original budget estimate.

    No measurable change in beach width or sediment composition was observed at any site during the study period.

    ## Recommendations

    1. Scale the permeable groyne intervention to all five sites, given the observed 62 percent reduction in erosion at treated sites and the favourable cost performance.
    2. Use the intervention to restore beach width along the wider regional coastline.
  expected_issues:
  - id: scale_to_all_sites
    anchor: Scale the permeable groyne intervention to all five sites
    severity: medium
  - id: restore_beach_width
    anchor: Use the intervention to restore beach width
    severity: high
  notes: 'Recommendation 1 extends the intervention to S4 and S5, which were untreated controls (pilot-to-unmeasured-site
    extrapolation). Recommendation 2 is contradicted: the findings state no measurable change in beach width.'
- input: |
    # Annual Air Quality Report

    ## Overview

    This report summarises pollutant readings across twelve monitoring stations between January and December.

    ## PM2.5 Trends

    Mean annual PM2.5 fell from 24 µg/m³ in the previous year to 21 µg/m³ this year, a reduction of approximately 12 percent. The station closest to the new low-emission zone (Station 4) showed a 28 percent reduction.

    ## NO₂ Trends

    NO₂ readings were stable across all stations, with no statistically significant change year-over-year.

    ## Ozone Trends

    Ozone showed a small seasonal increase in summer months, consistent with prior years.

    ## Conclusion

    The data indicate that targeted low-emission zones are correlated with localised PM2.5 reductions. NO₂ levels were unchanged. Ozone showed the usual seasonal pattern.
  decoys:
  - anchor: targeted low-emission zones are correlated with localised PM2.5 reductions
    reason: conclusion
  - anchor: Ozone showed the usual seasonal pattern
    reason: conclusion
  notes: 'Findings and a factual conclusion only: no calls to action. The decoys are conclusion sentences that restate
    findings and must not be read as recommendations.'
