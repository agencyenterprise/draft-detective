    # Workplace Safety: Annual Incident Review

    ## Findings

    Reportable incidents fell from 47 in the prior year to 31 in the current year, a 34 percent reduction. The introduction of mandatory pre-shift safety briefings in March is the largest single change correlated with the reduction; in months following the introduction, incident rates were 42 percent lower than in equivalent months the previous year.

    Near-miss reporting rose from 112 to 198 reports over the same period. Internal review suggests the increase reflects greater willingness to report rather than a genuine rise in near-miss frequency.

    Lost-time injury rate fell from 3.1 to 2.4 per 100,000 hours worked.

    ## Findings and Recommendations

    ### Recommendations

    1. Make pre-shift safety briefings a permanent fixture across all sites, given the 42 percent reduction in incident rates in months following their introduction.
    2. Continue to encourage near-miss reporting and treat increases in reports as a positive indicator of safety culture rather than a deterioration.
    3. Roll out the mandatory safety briefings to contractor sites worldwide.
  expected_issues:
  - id: permanent_briefings
    anchor: Make pre-shift safety briefings a permanent fixture across all sites
    severity: medium
  - id: near_miss_reporting
    anchor: Continue to encourage near-miss reporting
    severity: none
  - id: contractor_sites_worldwide
    anchor: Roll out the mandatory safety briefings to contractor sites worldwide
    severity: high
  notes: Recommendation 1 makes the briefings permanent and network-wide, a horizon and scope the studied period
    does not establish. Recommendation 2 is supported by the document's own reading of the near-miss increase. Recommendation
    3 extends to contractor sites worldwide, never studied.
