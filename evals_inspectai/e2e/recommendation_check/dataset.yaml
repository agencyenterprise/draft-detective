    # Early Literacy Screening in Grades K–2

    ## Background

    The state Department of Education sets screening requirements and funds reading coaches. School districts choose screening tools, and schools administer them.

    ## Findings

    Districts that screened students in grades K–2 three times a year identified 1.8 times as many students with reading difficulties as districts that screened once a year.

    Teachers in 14 of the 20 districts studied said they did not receive screening results until four to six weeks after testing. Districts that returned results within one week started interventions a median of 29 days earlier.

    Schools with a full-time reading coach delivered intervention to 84 percent of flagged students, compared with 52 percent in schools without one.

    ## Recommendations

    We recommend that the state Department of Education:

    1. Require districts to screen students in grades K–2 three times a year.
    2. Set a deadline for returning screening results to teachers.
       - Require districts to return results within one week of testing.
       - Publish each district's turnaround time every year.
    3. Fund a full-time reading coach in every elementary school.
  expected_issues:
  - id: screen_three_times_support
    anchor: Require districts to screen students in grades K–2 three times a year.
    severity: none
  - id: deadline_support
    anchor: Set a deadline for returning screening results to teachers.
  - id: reading_coach_support
    anchor: Fund a full-time reading coach in every elementary school.
  decoys:
  - anchor: Require districts to screen students in grades K–2 three times a year.
    title: Recommendation Audience Unclear
    reason: lead_in_audience
  - anchor: Fund a full-time reading coach in every elementary school.
    title: Recommendation Audience Unclear
    reason: lead_in_audience
  - anchor: Publish each district's turnaround time every year.
    title: Too Many Recommendations
    reason: sub_items
  notes: 'Three parties could act, but the lead-in addresses every recommendation to the state Department of Education.
    Recommendation 2 has two sub-points that elaborate it, so the document makes three recommendations, not five.
    Severity is left unscored for recommendation 2 (its second sub-point has no direct finding) and 3 (studied
    districts extended statewide).'
