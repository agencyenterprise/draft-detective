    # Regional Hospital Emergency Department Throughput Review

    ## Findings

    Median time from arrival to triage was 38 minutes on weekday evenings, when the department had one triage nurse on duty, against 12 minutes at other times, when it had two.

    Patients waiting for an inpatient bed spent a median of 6.5 hours in the emergency department. Beds were assigned only at the 7 a.m. and 3 p.m. bed meetings, and waits were longest for patients admitted just after a meeting.

    Emergency department laboratory results took a median of 74 minutes when porters carried the samples and 29 minutes during the two-week trial in which a runner was assigned to the department.

    Twenty-two percent of patients who left without being seen did so after being told the wait would be more than three hours.

    Discharge prescriptions filled at the hospital pharmacy before the patient left were followed by 14 percent fewer 30-day return visits than prescriptions sent to outside pharmacies.

    ## Recommendations

    1. Add a second triage nurse on weekday evenings.
    2. Assign inpatient beds continuously through the day rather than only at the two daily bed meetings.
    3. Assign a dedicated runner to carry emergency department laboratory samples.
    4. Give patients in the waiting room updated wait-time estimates every hour.
    5. Fill discharge prescriptions at the hospital pharmacy before patients leave.
  expected_issues:
  - id: triage_nurse_support
    anchor: Add a second triage nurse on weekday evenings.
    severity: none
  - id: continuous_beds_support
    anchor: Assign inpatient beds continuously through the day
  - id: runner_support
    anchor: Assign a dedicated runner to carry emergency department laboratory samples.
  - id: wait_estimates_support
    anchor: Give patients in the waiting room updated wait-time estimates every hour.
  - id: discharge_prescriptions_support
    anchor: Fill discharge prescriptions at the hospital pharmacy before patients leave.
    severity: none
  - id: too_many
    title: Too Many Recommendations
    anchor: Add a second triage nurse on weekday evenings.
    severity: low
  decoys:
  - anchor: Add a second triage nurse on weekday evenings.
    title: Recommendation Audience Unclear
    reason: single_actor
  - anchor: Assign a dedicated runner to carry emergency department laboratory samples.
    title: Recommendation Not Actionable
    reason: concrete_action
  notes: 'Five distinct, concrete recommendations for one hospital: one length issue, anchored on the first. Support
    severities are left unscored where two classifications are defensible (a trial result, bed timing, hourly estimates);
    the sample is about the count.'
