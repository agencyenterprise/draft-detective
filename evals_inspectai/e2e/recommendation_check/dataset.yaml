# Eval samples for the recommendation_check workflow, in inventory form: one expected issue per
# recommendation occurrence, anchored by its wording, with the severity its classification maps to
# (none = supported, medium = partially supported, high = unsupported). Support issues have free-form
# titles, so none is named for them. The actionability, audience and length issues (RAND EEI item 8)
# have fixed titles, which are named; decoys that carry a title are recommendations a correct run
# reports for support but must not report under that title. See evals_inspectai/common/issue_inventory.py.
# Figures are referenced by local PNG path and inlined at upload.
- input: |
    # Remote Work Productivity Study

    ## Findings

    A twelve-month survey of 1,240 employees across four departments found that median self-reported productivity rose by 14 percent after the introduction of fully remote work. Engineering teams showed the largest gain at 19 percent, while customer support saw a smaller but still positive 6 percent gain. Meeting hours fell by an average of 4.2 hours per week per employee.

    Employee retention over the study period rose from 82 percent to 91 percent year-over-year, with exit-interview data attributing the change primarily to schedule flexibility.

    ## Recommendations

    1. Continue the fully remote work policy across all four departments based on the sustained productivity and retention gains observed.
    2. Reduce the standing-meeting load further by capping recurring meetings at six hours per week per employee, building on the observed 4.2-hour reduction.
    3. Expand schedule flexibility to contractor staff, who were not covered by the present study.
  expected_issues:
  - id: continue_remote
    anchor: Continue the fully remote work policy across all four departments
    severity: none
  - id: cap_meetings_six_hours
    anchor: capping recurring meetings at six hours per week
    severity: medium
  - id: contractor_flexibility
    anchor: Expand schedule flexibility to contractor staff
    severity: high
  decoys:
  - anchor: Continue the fully remote work policy across all four departments
    title: Recommendation Audience Unclear
    reason: single_actor
  notes: Recommendation 1 restates the productivity and retention findings. Recommendation 2 adds a six-hour cap
    the 4.2-hour finding does not establish (threshold rule). Recommendation 3 extends to contractors the study
    never covered (out-of-scope population).
