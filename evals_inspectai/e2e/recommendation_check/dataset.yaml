    # Hospital Readmission Reduction Pilot

    ## Findings

    A six-month pilot of post-discharge nurse calls covered 412 patients across two cardiology wards. The 30-day readmission rate for the pilot cohort was 11.2 percent, compared to 18.4 percent in the matched control cohort drawn from the prior year. The difference (-7.2 percentage points) was statistically significant at p < 0.01.

    Average call duration was 14 minutes. Per-patient cost was 38 USD. Estimated savings per avoided readmission was 8,400 USD.

    Patient-reported satisfaction with the call programme averaged 4.6/5.

    ## Conclusion and Recommendations

    1. Roll out the post-discharge nurse call programme to the remaining cardiology wards in the network, given the demonstrated 7.2-percentage-point reduction in readmissions and favourable cost-benefit profile.
    2. Extend the call programme to oncology wards as a next step, where readmission rates have historically been comparable to cardiology.
  expected_issues:
  - id: cardiology_rollout
    anchor: Roll out the post-discharge nurse call programme to the remaining cardiology wards
    severity: medium
  - id: oncology_extension
    anchor: Extend the call programme to oncology wards
    severity: high
  notes: Recommendation 1 extends the two-ward pilot to the remaining cardiology wards (closely related, unmeasured).
    Recommendation 2 extends to oncology, a population never measured.
