    # Closing the Broadband Adoption Gap

    ## Background

    The Federal Communications Commission maintains the national broadband coverage map. State broadband offices distribute federal grants, and county governments and internet service providers carry out local deployment and outreach.

    ## Findings

    A national comparison with field tests found that the coverage map listed service at 18 percent of addresses that had none. Where providers had filed address-level coverage data, the error was 3 percent.

    Counties that wrote a joint plan with their state broadband office had adoption rates 9 points higher than counties that planned alone.

    Among households with service available but no subscription, 41 percent named monthly cost as the main reason.

    ## Recommendations

    - A more integrated approach to broadband planning is needed.
    - The Federal Communications Commission should require providers to file address-level coverage data for the national map.
    - Stakeholders should take steps to address affordability barriers.
