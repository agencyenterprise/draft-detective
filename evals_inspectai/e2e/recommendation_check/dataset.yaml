    # Coastal Erosion Mitigation: Pilot Programme Report

    ## Findings

    The pilot installed permeable groynes at three of the five monitoring sites (S1, S2, S3) over a 24-month period. Sites S4 and S5 served as untreated controls.

    Mean annual erosion at the treated sites fell from 58 mm/year to 22 mm/year, a 62 percent reduction. The control sites showed no significant change (61 mm/year vs 59 mm/year). Cost per linear metre of intervention was 1,420 USD, roughly 30 percent below the original budget estimate.

    No measurable change in beach width or sediment composition was observed at any site during the study period.

    ## Recommendations

    1. Scale the permeable groyne intervention to all five sites, given the observed 62 percent reduction in erosion at treated sites and the favourable cost performance.
    2. Use the intervention to restore beach width along the wider regional coastline.
  expected_issues:
  - id: scale_to_all_sites
    anchor: Scale the permeable groyne intervention to all five sites
    severity: medium
  - id: restore_beach_width
    anchor: Use the intervention to restore beach width
    severity: high
  decoys:
  - anchor: Scale the permeable groyne intervention to all five sites
    title: Recommendation Audience Unclear
    reason: single_actor
  notes: 'Recommendation 1 extends the intervention to S4 and S5, which were untreated controls (pilot-to-unmeasured-site
    extrapolation). Recommendation 2 is contradicted: the findings state no measurable change in beach width. The report
    names no party but the pilot itself, so neither recommendation has an unclear audience.'
