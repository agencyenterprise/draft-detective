    # High-Dosage Tutoring: Second-Year Results

    ## Background

    The state education agency funds the tutoring program, school districts hire and train tutors, and schools schedule sessions during the school day. The program served students in grades 3 through 5.

    ## Findings

    Students in grades 3 through 5 who attended at least 40 sessions gained the equivalent of 0.2 years of additional learning in math over the school year.

    Among students who started the year below grade level, each additional ten sessions was associated with a further 0.05 years of learning, with no sign of the gains levelling off within the range observed.

    ## Recommendations for School Districts

    - Consider extending the tutoring program to sixth grade, where many of the same students continue to struggle in math.
    - Increase the number of tutoring sessions for students who start the year below grade level.
