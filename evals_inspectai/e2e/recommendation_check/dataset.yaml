    # Public Library Digital Services Review

    ## Executive Summary

    This review assessed digital service uptake at twenty-two public library branches over the 2024 calendar year.

    ### Recommendations

    - **Expand e-book lending budget across all branches.**
    - **Open extended evening hours at the five busiest branches.**
    - **Replace ageing self-checkout terminals.**

    ## Findings

    E-book loans grew 38 percent year-over-year and now represent 41 percent of all loans system-wide. Branches that exhausted their e-book budget within the first nine months saw flat or declining overall loan numbers in Q4.

    Foot traffic data shows the five busiest branches (Central, Eastgate, Westwood, Riverside, Hilltop) operate above 95 percent of seating capacity for the final hour of every weekday. No data was collected on demand outside currently operating hours.

    No equipment audit was performed during this review.

    ## Detailed Recommendations

    1. Increase the e-book lending budget by at least 25 percent across all branches, prioritising those that exhausted their allocation in the first nine months. The 38 percent growth in e-book loans, coupled with reduced overall lending where budgets were exhausted, justifies expanded investment.
    2. Open extended evening hours (until 10 PM) at the five busiest branches — Central, Eastgate, Westwood, Riverside, and Hilltop — to absorb demand from patrons currently turned away during peak final-hour periods.
    3. Replace ageing self-checkout terminals across the network within the next 18 months to improve patron experience.
  expected_issues:
  - id: summary_ebook_budget
    anchor: Expand e-book lending budget across all branches.
    severity: none
  - id: summary_evening_hours
    anchor: Open extended evening hours at the five busiest branches.
    severity: medium
  - id: summary_terminals
    anchor: Replace ageing self-checkout terminals.
    severity: high
  - id: detailed_ebook_25pct
    anchor: Increase the e-book lending budget by at least 25 percent
    severity: medium
  - id: detailed_hours_10pm
    anchor: Open extended evening hours (until 10 PM)
    severity: medium
  - id: detailed_terminals_18mo
    anchor: Replace ageing self-checkout terminals across the network within the next 18 months
    severity: high
  decoys:
  - anchor: Increase the e-book lending budget by at least 25 percent
    title: Too Many Recommendations
    reason: restatements_counted_once
  notes: 'Two recommendation sections, three recommendations each, evaluated per occurrence. The summary e-book
    line is supported; the detailed version adds a 25 percent threshold. Both evening-hours lines are partial: capacity
    in the final hour is measured, demand after closing is not. Both terminal lines are unsupported: no equipment
    audit was performed.'
