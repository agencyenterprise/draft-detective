    This internal note documents a minor UI copy change in our web application. The button currently labelled "Download" on the reports page will be renamed to "Export". This is a cosmetic wording change with no functional impact, and the note makes no empirical, scientific, or statistical claims.

    ## Decision

    We will rename the button in the next release. No user research or external literature informed or is relevant to this decision.

    ## References

    None.
  publication_date: "2026-01-01"
