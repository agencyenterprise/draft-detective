# Eval samples for the live_reports_v2 workflow, in inventory form. Each record dates the project
# (`publication_date`) and each expected issue is anchored on a claim that later evidence overturned
# or materially updated: a standard superseded, a guideline reversed, a record broken. Topics are
# chosen so the later evidence is plentiful and settled, and the search almost always finds it. Its
# `rationale` names what changed and where, for the judged criterion; no source is asserted. Titles are
# free-form and several issues may cover one claim. Claims that still hold are optional: the skill may
# cite newer evidence that supports them. Decoys are sentences newer research cannot update: historical
# facts, local facts, procedure. Every paragraph is one line, so a line identifies one claim.
# See evals_inspectai/common/issue_inventory.py.

- input: |
    # State of the Art in Machine Translation (2017)

    ## Overview

    This brief summarizes the leading approaches to automated machine translation as of early 2017.

    ## Claims

    Phrase-based statistical machine translation (SMT) is the most accurate approach to automated translation.

    Phrase-based SMT is also the most widely deployed approach in commercial translation services.

    Neural approaches show early promise but remain experimental and are not yet competitive with SMT on standard benchmarks for most language pairs.

    IBM's Candide project introduced statistical methods to machine translation in the early 1990s.

    ## References

    1. Koehn, P. (2010). Statistical Machine Translation. Cambridge University Press.
  publication_date: "2017-01-01"
  expected_issues:
  - id: most_accurate
    anchor: Phrase-based statistical machine translation (SMT) is the most accurate approach
    rationale: >-
      Overturned: the Transformer (Vaswani et al. 2017) and neural systems at the WMT shared tasks from 2017
      on outperformed phrase-based SMT; comparative studies (Bentivogli et al. 2018) and reviews (Stahlberg
      2020) document neural MT as the more accurate approach.
  - id: most_deployed
    anchor: Phrase-based SMT is also the most widely deployed approach
    rationale: >-
      Overturned: the major commercial services moved to neural MT (Google's GNMT from late 2016, followed by
      Microsoft, DeepL, Amazon), and later reviews (Stahlberg 2020) describe neural MT as having superseded
      statistical MT in deployment.
  - id: neural_experimental
    anchor: remain experimental and are not yet competitive with SMT
    rationale: >-
      Overturned by the same evidence: neural systems won most WMT 2017 and later tasks, and the Transformer
      became the standard architecture.
  decoys:
  - anchor: IBM's Candide project introduced statistical methods
    reason: historical_fact
  - anchor: This brief summarizes the leading approaches
    reason: procedural
  notes: The original sample, with its claims on separate lines and a historical fact added.

- input: |
    # The HTTP Protocol: Current Version (2015)

    ## Overview

    This brief describes the current state of the Hypertext Transfer Protocol (HTTP) as of the start of 2015.

    ## Claims

    HTTP/1.1 is the current and latest standardized version of the HTTP protocol.

    There is no newer standardized version of HTTP in use.

    Every version of HTTP runs over TCP connections.

    HTTP/1.1 was first published as RFC 2068 in 1997 and revised as RFC 2616 in 1999.

    ## References

    1. Fielding, R., et al. (1999). RFC 2616: Hypertext Transfer Protocol -- HTTP/1.1. IETF.
  publication_date: "2015-01-01"
  expected_issues:
  - id: latest
    anchor: HTTP/1.1 is the current and latest standardized version
    rationale: >-
      Overturned in May 2015 when HTTP/2 was standardized as RFC 7540 (Belshe, Peon & Thomson), later revised
      as RFC 9113 (2022), and HTTP/3 followed as RFC 9114 (2022).
  - id: no_newer
    anchor: There is no newer standardized version of HTTP in use.
    rationale: >-
      Overturned by HTTP/2 (RFC 7540, 2015) and HTTP/3 (RFC 9114, 2022), both widely deployed.
  - id: tcp
    anchor: Every version of HTTP runs over TCP connections.
    rationale: >-
      Overturned by HTTP/3, which runs over QUIC on UDP (RFC 9000, 2021; RFC 9114, 2022).
  - id: rfc_history
    anchor: HTTP/1.1 was first published as RFC 2068 in 1997
    required: false
  notes: >-
    The original sample, with its claims split and the transport claim added. The RFC history is optional:
    true as history, but RFC 2616 was since obsoleted (RFC 7230 in 2014, RFC 9112 in 2022), which a run may
    fairly point out.

