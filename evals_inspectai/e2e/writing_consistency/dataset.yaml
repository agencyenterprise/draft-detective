# Eval samples for the writing_consistency workflow, in inventory form: one expected issue per
# inconsistency, anchored at the first minority occurrence, with edit expectations, plus decoys
# whose variation is legitimate. Titles carry the variants after a colon ("Inconsistent Term:
# students / pupils"), so an expected title names the stable prefix; where a family could fairly be
# reported under two prefixes (a spelling that is also a number style), the title is just
# "Inconsistent", which any of them contains. See evals_inspectai/common/issue_inventory.py.

# ---- terms ----------------------------------------------------------------------------------
- input: |
    # Survey Results

    ## Chapter 1

    We surveyed 412 participants in spring 2025. Participants answered 40 questions about scheduling and workload. Most participants completed the survey in under 15 minutes.

    ## Chapter 2

    Respondents rated scheduling as their main concern. Sixty percent of respondents said the new roster reduced their commute.
  expected_issues:
  - id: participants_respondents
    title: Inconsistent Term
    anchor: Respondents rated scheduling as their main concern
    edit_expected: true
    severity: medium
    edit:
      must_include: ["Participants rated"]
  notes: One group, two names across chapters. The majority form is participants (3 to 2).
- input: |
    # Program Overview

    ## Chapter 1

    The Community Health Program (the program) opened in 2021. The program serves four counties. We evaluated the program's first two years.

    ## Chapter 2

    The program's staff numbered 14 in 2023. Contractors who supplied the vans were not part of the staff and were paid per trip.
  decoys:
  - anchor: The program serves four counties
    reason: glossed_short_form
  - anchor: Contractors who supplied the vans were not part of the staff
    reason: different_things

# ---- spelling and capitalization ----------------------------------------------------------
- input: |
    # Costs

    ## Chapter 1

    The organization's costs rose 6 percent in 2023. The organization spent a third of its budget on staff. We asked the organization how it expected costs to move.

    ## Chapter 2

    The organisation expected costs to keep rising. One administrator cited the report "Organisational Spending in Rural Counties" as the basis for the estimate.
  expected_issues:
  - id: organization_spelling
    title: Inconsistent Spelling
    anchor: The organisation expected costs to keep rising
    edit_expected: true
    severity: low
    edit:
      must_include: ["The organization expected"]
  decoys:
  - anchor: Organisational Spending in Rural Counties
    reason: quoted
- input: |
    # Oversight

    ## Chapter 1

    The Department of Education funded the pilot. The Department set the reporting schedule, and the Department reviewed each quarterly report.

    ## Chapter 2

    In 2024 the department shortened the schedule to twice a year. Federal Reserve data were not used in this evaluation.
  expected_issues:
  - id: department_capitalization
    title: Inconsistent Spelling
    anchor: In 2024 the department shortened the schedule
    edit_expected: true
    severity: low
    edit:
      must_include: ["the Department shortened"]
  decoys:
  - anchor: Federal Reserve data were not used
    reason: proper_name

