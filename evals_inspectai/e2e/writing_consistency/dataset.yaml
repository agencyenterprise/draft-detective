  notes: The 365-line, 12,000-word report the Active Voice and Concision records use, with nine verbs whose tense does
    not fit their sentence planted from the first chapter to the last (three in the final fifth), so a run that reads
    the start closely and skims the rest loses recall. The report's own consistency findings (spellings, number style)
    and two arguable present perfects are optional. Titles that a run could fairly file as a finding out of step with
    the other findings use the bare word Tense.

# ---- tone -----------------------------------------------------------------------------------
- input: |
    # Approach

    ## Chapter 1

    We designed the survey with the agency and we piloted it in four schools. We then revised six questions.

    ## Chapter 4

    The authors caution that the second year does not allow the same comparison. One principal told us, "We would keep it if the state kept paying."
