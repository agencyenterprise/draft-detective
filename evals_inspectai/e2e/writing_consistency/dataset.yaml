# ---- tense ----------------------------------------------------------------------------------
- input: |
    # Findings

    ## Chapter 3

    Teachers reported higher satisfaction after the schedule change. Attendance rose in 30 of 38 schools. Principals report that recruiting was easier in the second year. Most districts operate on a July fiscal year, which shaped the timing of the change. This chapter describes the findings in the order the agency asked for them.
  expected_issues:
  - id: principals_report
    title: Inconsistent Tense
    anchor: Principals report that recruiting was easier
    edit_expected: true
    severity: medium
    edit:
      must_include: ["Principals reported"]
  decoys:
  - anchor: Most districts operate on a July fiscal year
    reason: general_truth
  - anchor: This chapter describes the findings
    reason: signposting_tense

# ---- verb tense that does not fit the sentence ----------------------------------------------
- input: |
    # Staffing

    ## Chapter 2

    The agency cut its permitting staff from 40 to 31 between 2021 and 2023. Last year, the agency has cut the review period for small projects from 90 days to 45. Since 2022, the agency has posted every decision online within a week.
  expected_issues:
  - id: last_year_present_perfect
    title: Verb Tense
    anchor: Last year, the agency has cut the review period
    edit_expected: true
    severity: low
    edit:
      must_include: ["the agency cut the review period"]
  decoys:
  - anchor: Since 2022, the agency has posted every decision online
    reason: ongoing_present_perfect
  notes: A finished time (last year) takes the simple past; "since 2022" for something still happening takes the present perfect.
- input: |
    # Background

    ## Chapter 1

    Studies of after-school tutoring show that small groups raise reading scores; in particular, teachers in these studies described tutoring as most useful for students who missed school (Baird and Moss, 2019). Baird and Moss (2019) found that groups of three worked better than groups of six.
  expected_issues:
  - id: literature_simple_past
    title: Verb Tense
    anchor: teachers in these studies described tutoring
    edit_expected: true
    severity: low
    edit:
      must_include: ["have described"]
  decoys:
  - anchor: Baird and Moss (2019) found that groups of three
    reason: dated_study
  notes: A sentence summarizing what research shows, framed in the present, reports what the studies' subjects said in the present perfect. One study named with its year as the subject keeps the past.
- input: |
    # Pilot Results

    ## Chapter 3

    The pilot ran from July 2022 to June 2024, when its grant expired. Over its two years, the pilot has reduced wait times at both clinics by about a third. Both clinics have kept the shorter schedule since the pilot ended. We found that patients missed fewer appointments in the second year.
  expected_issues:
  - id: finished_pilot_present_perfect
    title: Tense
    anchor: Over its two years, the pilot has reduced wait times
    edit_expected: true
    severity: low
    edit:
      must_include: ["the pilot reduced wait times"]
  decoys:
  - anchor: Both clinics have kept the shorter schedule since the pilot ended
    reason: ongoing_present_perfect
  notes: What a finished program did over its run takes the simple past. The title is the bare word Tense, since a run could fairly file this as a finding out of step with the other findings.
- input: |
    # Implications

    ## Chapter 5

    Participants may not notice these delays directly, but they appear in the enrollment data. Future programs would benefit from a longer planning period. A shorter intake form could reduce the delays further, and the state should fund a pilot of one. Staff said the waiting list is still growing.
  decoys:
  - anchor: Participants may not notice these delays directly
    reason: hedge
  - anchor: Future programs would benefit from a longer planning period
    reason: conditional
  - anchor: A shorter intake form could reduce the delays further
    reason: hedge
  - anchor: Staff said the waiting list is still growing
    reason: reported_speech
  notes: Hedges, conditionals and recommendations keep their modal verbs; they are not findings to move into the past tense. Reported speech about a situation that continues may keep the present.
- input: file://e2e/writing_consistency/files/home_visit_evaluation.md
  expected_issues:
  - id: before_launch_present_perfect
    title: Verb Tense
    anchor: Before the program launched, the county has relied on hospital social workers
    edit_expected: true
    severity: low
    edit:
      must_not_include: ["has relied"]
  - id: in_2023_present_perfect
    title: Verb Tense
    anchor: In 2023, the program has added a second clinic
    edit_expected: true
    severity: low
    edit:
      must_include: ["the program added"]
  - id: at_baseline_present_perfect
    title: Verb Tense
    anchor: At baseline, most enrolled patients have missed at least one clinic appointment
    edit_expected: true
    severity: low
    edit:
      must_include: ["had missed"]
  - id: since_simple_past
    title: Verb Tense
    anchor: Since the program began in 2021, community health workers completed more than 3,000 home visits
    edit_expected: true
    severity: low
    edit:
      must_include: ["have completed"]
  - id: pilot_phase_present_perfect
    title: Tense
    anchor: During the pilot phase, the program has strengthened referrals
    edit_expected: true
    severity: low
    edit:
      must_include: ["the program strengthened"]
  - id: literature_reported
    title: Verb Tense
    anchor: patients with diabetes reported fewer missed doses
    edit_expected: true
    severity: low
    edit:
      must_include: ["have reported"]
  decoys:
  - anchor: This chapter describes the program and the questions
    reason: signposting_tense
  - anchor: Medicaid covers home visits in the state only when a physician orders them
    reason: general_truth
  - anchor: Since 2022, the program has employed 14 community health workers
    reason: ongoing_present_perfect
  - anchor: Several community health workers said the caseloads are still too large
    reason: reported_speech
  - anchor: Patients may not notice these changes directly
    reason: hedge
  - anchor: Hale and Ortiz (2020) found that monthly visits worked best
    reason: dated_study
  - anchor: Future programs would benefit from hiring community health workers
    reason: conditional
  - anchor: The county should keep the monthly schedule
    reason: recommendation
  notes: Six verbs whose tense does not fit the sentence, against findings otherwise reported in the past and terms
    used consistently, so tense is the only thing to report. Patterns from reviewer feedback comparing Draft Detective
    with a paragraph-rewriting style editor (a finished program's results in the present perfect, a literature summary
    in the simple past), plus the time markers that fix a tense (in 2023, at baseline, since, before).

