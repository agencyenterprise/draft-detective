# Long-report samples for the abbreviation_scan_v2 workflow, run by abbreviation_checker_report_e2e. Ported from
# PR 782 (Grant Ellison): one published RAND report and nine copies of it with first inline definitions removed,
# each copy differing from the base only on the edited lines, so every line number carries over. The documents
# live in files/; the record shape and labelling conventions are dataset.yaml's (see its header).
#
# The catalogue was relabelled from the text against skills/abbreviation-extraction/SKILL.md rather than copied
# from the PR, whose labels missed occurrences on busy lines and left the endnotes in scope. Exempt occurrences
# are not recorded, as the skill says. Tables and captions are recorded like body text: following the house
# style that every acronym is defined and listed, the benchmark acronyms first used in the appendix benchmark
# table (MMLU, GPQA, WMDP, LitQA, DBQA, BioLP, WCBB) each fail Rules 2 and 3 there. Judgement calls, made once and
# applied to every record: the contents list is in scope (it holds no abbreviations) while the list of figures
# and tables, which repeats their titles, is not recorded; model, conference, journal and software names are
# exempt (benchmarks are not), as are document identifiers, statistical notation (N, p, F1), the
# magnitude suffix of model sizes (the B in "70B"), "vs" (Latin shorthand), "ID" (common shorthand) and "UK"
# (the country); VCT, HPCT and MBCT, which the report defines and discusses in the body, are in scope there; the
# CAST in the www.rand.org/CAST link is inside a URL.
- input: file://e2e/abbreviation_checker/files/benchmarks_report.md
  abbreviations_section_found: true
  abbreviations:
    - {abbr: "AI", occurrence_number: 1, line_start: 25, inline_definition: "artificial intelligence", abbreviations_section_definition: "artificial intelligence"}
