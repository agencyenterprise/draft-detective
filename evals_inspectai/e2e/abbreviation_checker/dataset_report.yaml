    (lines 112-172), the document number, ID, UK (the country), et al., vs, F1/N/p notation and the B of model
    sizes. IRT's first recorded use is therefore its definition on line 239, not the bare figure-list entry on
    line 133. The CAST in the www.rand.org/CAST link is inside a URL, which the skill skips entirely, and ID
    ('item IDs') is common shorthand, so neither raises an issue (both are decoys). Issues: Rule 2 for LLM (first
    used bare in 'LLM-based' on line 429, defined only on line 481) and for ML, DNA, I/O, API and the seven
    benchmark acronyms of the Appendix B table (MMLU, GPQA, WMDP, LitQA, DBQA, BioLP, WCBB), which also fail Rule
    3. Rule 5 at line 269: 'Item response time (IRT)' conflicts with the first definition 'Item Response Theory'
    on line 239, a real typo in the report; the workflow's fuzzy comparison (text_matches, 85) currently scores it
    91 and misses it. 'Item-Response Theory' on line 261 and 'two-parameter logistic model' on line 485 are
    consistent redefinitions.
