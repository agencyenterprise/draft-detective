# Long-report samples for the abbreviation_scan_v2 workflow, run by abbreviation_checker_report_e2e. Ported from
# PR 782 (Grant Ellison): one published RAND report and nine copies of it with first inline definitions removed,
# each copy differing from the base only on the edited lines, so every line number carries over. The documents
# live in files/; the record shape and labelling conventions are dataset.yaml's (see its header).
#
# The catalogue was relabelled from the text against skills/abbreviation-extraction/SKILL.md rather than copied
# from the PR, whose labels missed occurrences on busy lines and left the endnotes in scope. Judgement calls, made
# once and applied to every record: the contents and figure lists are in scope (no rule excludes them); model
# names (recorded with their version, e.g. "GPT-4o"), benchmark, conference, journal and software names are exempt,
# as are document identifiers and statistical notation (N, p, F1); "vs" is Latin shorthand, recorded as written
# (the report has both "vs" and "vs."); VCT, HPCT and MBCT stay in scope in the benchmark table, since they stand
# for names the report defines. Following the skill, "ID" is common shorthand (exempt) and the CAST in the
# www.rand.org/CAST link is inside a URL, so it is not recorded at all.
- input: file://e2e/abbreviation_checker/files/benchmarks_report.md
  abbreviations_section_found: true
  abbreviations:
    - {abbr: "AI", occurrence_number: 1, line_start: 3, abbreviations_section_definition: "artificial intelligence", ignored: true}
    - {abbr: "RAND", occurrence_number: 1, line_start: 9, ignored: true}
