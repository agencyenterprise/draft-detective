    # Evaluating a Workforce Training Subsidy

    ## Abbreviations

    - CBA: Collective Bargaining Agreement
    - GDP: Gross Domestic Product

    ## Introduction

    This report presents a cost-benefit analysis (CBA) of a state subsidy that pays employers to train newly hired workers. The subsidy costs the state about 0.1 percent of its gross domestic product (GDP) each year.

    ## Approach

    The CBA compares the subsidy's cost with the additional earnings of trained workers over ten years, discounted at three percent.

    ## Results

    Under every discount rate we tested, the CBA found that benefits exceeded costs, although the margin narrowed when earnings gains were assumed to fade after five years. Relative to GDP, the net benefit is small.

