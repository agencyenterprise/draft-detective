    # Community Gardens and Neighbourhood Wellbeing

    ## Introduction

    Community gardens have spread across many cities over the past two decades. This report asks whether residents who take part in a shared garden describe stronger ties with their neighbours than residents who do not.

    ## Methods

    We interviewed forty-two gardeners and thirty-eight neighbours who lived within walking distance of six gardens. Each interview followed the same set of open questions about daily contact, trust and shared projects, and two researchers coded every transcript independently.

    ## Findings

    Gardeners described more frequent informal contact with neighbours, most often while tending plots on weekend mornings. Several neighbours who did not garden still reported that the gardens gave them a reason to stop and talk. Trust was described in similar terms by both groups.

    ## Conclusion

    Shared gardens appear to create occasions for contact rather than to change how residents feel about one another. Planners who want to strengthen neighbourhood ties may find that the value of a garden lies in the routine meetings it makes possible.
