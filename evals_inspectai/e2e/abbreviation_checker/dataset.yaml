    # Food Assistance and Household Food Security After the Pandemic

    ## Abbreviations

    - CPS: Current Population Survey
    - EBT: Electronic Benefit Transfer
    - FNS: Food and Nutrition Service
    - SNAP: Supplemental Nutrition Assistance Program
    - USDA: United States Department of Agriculture
    - WIC: Special Supplemental Nutrition Program for Women, Infants, and Children

    ## Summary

    This report examines how participation in the Supplemental Nutrition Assistance Program (SNAP) changed between 2019 and 2023, and how those changes relate to household food security. It draws on administrative caseload data and on the food security questions fielded each December in the CPS.

    Emergency allotments raised SNAP benefits for most households during the pandemic and ended in early 2023. Food insecurity fell while the allotments were in place and rose again within months of their end.

    The sharpest increases after the allotments ended were among households with young children, and the smallest among households headed by older adults.

    ## Introduction

    Food insecurity, the condition of lacking reliable access to enough food for an active and healthy life, is measured in the United States through an eighteen-item questionnaire administered to a nationally representative sample of households.

    The questionnaire asks about experiences over the previous twelve months, from worrying that food would run out before there was money to buy more, to skipping meals or going a whole day without eating. Households that report several of these experiences are classified as having low or very low food security.

    The United States Department of Agriculture (USDA) publishes annual estimates from that questionnaire, and those estimates have become the standard benchmark against which food assistance programs are judged.

    Two programs account for most federal food assistance to low-income households. SNAP provides monthly benefits that households spend at authorized retailers.

    The Special Supplemental Nutrition Program for Women, Infants, and Children (WIC) provides specific foods, nutrition education and referrals to pregnant women, new mothers and young children.

    Both programs are administered at the federal level by the Food and Nutrition Service (FNS), an agency within the USDA, and delivered by state and local agencies that set many of the procedures participants encounter.

    The pandemic changed both programs at once. Congress authorized emergency allotments that raised every SNAP household's benefit to the maximum for its size, and states were allowed to waive interview requirements.

    WIC agencies were permitted to certify participants remotely rather than in person. These changes were temporary, and most had ended by the spring of 2023.

    This report asks three questions. First, how did participation in each program change over the period? Second, how did food security change among eligible households, and did those changes track the emergency measures?

    Third, which households were most affected when the measures ended, and what do their experiences suggest about the design of future emergency responses?

    ## Background

    ### Program Rules Before the Pandemic

    Before 2020, a household's SNAP benefit was calculated as the maximum benefit for its size minus thirty percent of its net income. Households with no net income received the maximum, and most working households received considerably less.

    Benefits were loaded monthly onto an electronic benefit transfer (EBT) card that works like a debit card at participating stores. Households could carry unspent benefits forward from one month to the next.

    Most households must recertify their eligibility every six or twelve months, reporting changes in income and household size, and many are required to complete an interview each time. Households that miss a recertification deadline lose their benefits until they reapply.

    WIC operates differently. Participants receive a monthly package of specific foods chosen for their nutritional value, such as infant formula, milk, whole grains and fresh produce.

    In most states the package is redeemed through the same kind of EBT card. Eligibility depends on income and on a nutritional risk assessment carried out by a health professional.

    ### Emergency Measures

    The emergency allotments began in March 2020 and were extended month by month. At their peak, they raised the average benefit per person by more than a third.

    A later increase in the Thrifty Food Plan, the cost benchmark on which the maximum benefit is based, took effect in October 2021 and remained in place after the allotments ended.

    Other temporary measures ran alongside the allotments. Schools that closed during the pandemic issued replacement benefits for the free and reduced-price meals their students would have received, and some states extended certification periods so that households did not have to reapply while offices were closed.

    States ended the allotments on different schedules. Eighteen states ended them before the federal end date, most during 2021 and 2022, while the remainder continued until February 2023.

    This staggered timing provides the variation our analysis relies on, since households in neighbouring states with similar economies lost the allotments many months apart.

    ## Data and Methods

    ### Food Security Measures

    Our food security measures come from the December food security supplement to the Census Bureau's monthly labor force survey, which the Bureau fields on behalf of the USDA each year.

    We pool the supplements from 2019 through 2023 and restrict the sample to households with incomes below 185 percent of the poverty line, the group broadly eligible for at least one of the two programs.

    A household is classified as food insecure when it reports three or more of the conditions the questionnaire asks about, such as worrying that food would run out or cutting the size of meals.

    ### Participation and Population Data

    Participation data come from monthly state caseload reports that FNS publishes for each program. Survey respondents are known to under-report receipt of benefits, so we rely on the administrative counts for participation.

    County measures of poverty, household composition and housing costs come from the American Community Survey (ACS) five-year estimates. We use them to weight state caseload trends by the characteristics of the eligible population.

    ### Comparison Design

    Our main comparison contrasts states that ended the emergency allotments early with states that continued them until the federal end date.

    We estimate the change in food insecurity in each group relative to its own 2019 level, adjusting for state unemployment rates and the ACS measures described above.

    We test the sensitivity of the results to the choice of comparison year, to the exclusion of the largest states, and to alternative thresholds for classifying a household as food insecure.

    ## Results

    ### SNAP Participation

    SNAP participation rose from about thirty-six million people in early 2020 to more than forty-two million by the middle of 2021, then held roughly steady through the end of the emergency allotments.

    The rise was concentrated in the first six months of the pandemic, when unemployment was highest and many households applied for assistance for the first time.

    Participation did not fall sharply when the allotments ended. The number of participants in early-ending states declined by less than two percent in the six months after their last allotment.

    This suggests that households stayed enrolled even as their benefits fell, rather than leaving the program once the additional support was withdrawn.

    ### WIC Participation

    WIC participation followed a different path. Enrollment had been falling for a decade before the pandemic, and it continued to fall during 2020 despite the move to remote certification.

    It began to recover in 2022, a change that state agencies attributed to remote services and to a temporary increase in the fruit and vegetable benefit.

    ### Food Security

    Among eligible households, the share reporting food insecurity fell from 27 percent in 2019 to 23 percent in 2021, the lowest level recorded for this group since the Current Population Survey (CPS) began asking the questions.

    In states that ended the allotments early, food insecurity returned to its 2019 level within a year. In states that continued them, it remained below that level until 2023.

    The increase after the allotments ended was largest among households with children under five, many of which also participated in WIC.

    It was smallest among households headed by someone aged sixty or older, whose benefits had been lower before the pandemic and fell least when the allotments ended.

    These patterns are consistent with a RAND analysis of benefit timing, which found that households spend most of their monthly benefit within the first two weeks after it is loaded onto their EBT card.

    The same analysis found that food insecurity is most often reported in the final week of the month, when the benefit has largely been spent.

    ## Discussion

    The emergency allotments appear to have done what they were intended to do. They raised the resources available for food at a time of economic disruption, and food insecurity fell while they were in place.

    Their end reversed much of that improvement, and the reversal was sharpest for the households the allotments had helped most.

    The stability of SNAP participation after the allotments ended deserves attention. It suggests that the fall in food security reflected the size of the benefit rather than a loss of access.

    That distinction matters for policy, because it points toward benefit levels rather than enrollment procedures as the lever with the larger effect on food security.

    Our results have limits. State decisions to end the allotments early were not random: early-ending states had lower unemployment and, on average, lower benefit take-up before the pandemic.

    Adjusting for unemployment and the ACS population measures narrows but may not remove these differences, so the estimates should be read as upper bounds on the effect of the allotments.

    ## Policy Implications

    The FNS could make the evaluation of both programs easier by publishing caseload counts by household type, not only by state. Without that detail, analysts must rely on survey data that under-report participation.

    States considering changes to SNAP administration may also wish to retain the remote certification options that WIC agencies used during the pandemic.

    Those options appear to have helped reverse a long decline in enrollment, and they cost little to maintain once the systems supporting them are in place.

    ## Conclusion

    Temporary increases in food assistance lowered food insecurity among low-income households during the pandemic, and their end raised it again.

    The evidence from states that ended the allotments early suggests that the size of the benefit, more than enrollment, drove those changes.

    ## References

    - Food and Nutrition Service (2023). SNAP Data Tables: National Level Annual Summary. United States Department of Agriculture.
    - Rabbitt, Matthew, and colleagues (2023). Household Food Security in the United States in 2022. USDA Economic Research Service, Economic Research Report 325.
    - RAND Corporation (2022). Benefit Timing and Food Spending Among SNAP Households.
