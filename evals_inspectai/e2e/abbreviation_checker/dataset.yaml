# Eval samples for the abbreviation_scan_v2 workflow. One record per document; `input` is the document under
# review as markdown.
#
# Each record carries two layers of ground truth.
#
# The catalogue (`abbreviations_section_found`, `abbreviations`) is what the extraction agents should record,
# following skills/abbreviation-extraction/SKILL.md: one entry per occurrence, keyed by the abbreviation in its
# singular base form and its occurrence number (1 = first appearance), with its line span, the inline
# definition that accompanies that occurrence (omitted when there is none), the definition listed in the
# Abbreviations section (omitted when it is not listed or there is no section), and `ignored: true` when the
# occurrence is excluded (headings, references, footnotes, exempt classes, and the always-excluded RAND, MIT
# and ChatGPT). Occurrences inside the Abbreviations section itself are never recorded. `line_end` is omitted
# when it equals `line_start`.
#
# The inventory (`expected_issues`, `decoys`, see evals_inspectai/common/issue_inventory.py) is what a user
# sees: the issues the workflow builds from that catalogue, following skills/abbreviation-scan/SKILL.md. Each
# uses the rule's exact title and severity medium, and is anchored on a short verbatim quote from the line of
# the offending occurrence (the first non-excluded use, or for Rule 5 the first conflicting definition), except
# "No Abbreviations section found", which concerns the whole document and is matched on its title alone.
# Decoys are lines a correct run must not report under the given title: excluded occurrences (by the exclusion
# that applies), later uses that the first-use rules must not reach, and definitions that do not conflict.
- input: |
    # Artificial Intelligence in Healthcare

    ## Abbreviations

    - AI: Artificial Intelligence
    - LLM: Large Language Model
    - NLP: Natural Language Processing

    ## Introduction

    Artificial Intelligence (AI) is transforming healthcare. Large Language Models (LLM) and Natural Language Processing (NLP) are key enabling technologies.

    AI enables faster diagnosis and triage. LLMs can process vast amounts of medical literature and summarise findings. NLP extracts structured insights from unstructured clinical notes.

    ## Conclusion

    AI, LLM, and NLP will continue to shape the future of healthcare delivery.
  abbreviations_section_found: true
  abbreviations:
    - {abbr: "AI", occurrence_number: 1, line_start: 11, inline_definition: "Artificial Intelligence", abbreviations_section_definition: "Artificial Intelligence"}
    - {abbr: "LLM", occurrence_number: 1, line_start: 11, inline_definition: "Large Language Models", abbreviations_section_definition: "Large Language Model"}
    - {abbr: "NLP", occurrence_number: 1, line_start: 11, inline_definition: "Natural Language Processing", abbreviations_section_definition: "Natural Language Processing"}
    - {abbr: "AI", occurrence_number: 2, line_start: 13, abbreviations_section_definition: "Artificial Intelligence"}
    - {abbr: "LLM", occurrence_number: 2, line_start: 13, abbreviations_section_definition: "Large Language Model"}
    - {abbr: "NLP", occurrence_number: 2, line_start: 13, abbreviations_section_definition: "Natural Language Processing"}
    - {abbr: "AI", occurrence_number: 3, line_start: 17, abbreviations_section_definition: "Artificial Intelligence"}
    - {abbr: "LLM", occurrence_number: 3, line_start: 17, abbreviations_section_definition: "Large Language Model"}
    - {abbr: "NLP", occurrence_number: 3, line_start: 17, abbreviations_section_definition: "Natural Language Processing"}
  expected_issues: []
  notes: >-
    AI, LLM, and NLP each have an inline definition at their first occurrence on line 11 and all three are listed
    in the Abbreviations section. Each appears again on lines 13 and 17 without inline definitions. 9 total
    occurrences, all non-ignored. Issues: none. LLM's inline 'Large Language Models' differs from its entry 'Large
    Language Model' only by the plural, which Rule 4 treats as trivial.
