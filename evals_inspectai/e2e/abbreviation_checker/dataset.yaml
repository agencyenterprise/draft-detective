    # Broadband Access in Rural Counties

    ## Introduction

    The Federal Communications Commission (FCC) estimates that millions of rural households still lack a fixed connection that meets its minimum speed benchmark. Many of these households are served only by digital subscriber line (DSL) service over ageing copper lines.

    ## Provider Coverage

    Internet service providers (ISPs) report coverage by census block, and the FCC publishes those filings in its national broadband map. Because a block counts as served when a single address can be connected, ISPs can overstate coverage in sparsely settled areas.

    ## Findings

    Across the counties we studied, DSL remained the only wired option for about a third of households. Field checks found that a quarter of the addresses the FCC map listed as served could not order the advertised speed.

    ## Conclusion

    Coverage data that reflects individual addresses, rather than whole blocks, would give ISPs and state agencies a clearer picture of where investment is needed.
