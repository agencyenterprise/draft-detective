# Eval samples for the inference_validation_v2 workflow, in inventory form. Each expected issue is
# anchored on the sentence that draws the invalid conclusion, titled with the stable part of the
# skill's "Invalid Inference: <label>" title, and carries the labeller's account of the flaw
# (`rationale`), which the judged criterion compares the reported analysis against. Decoys are
# sound inferences a correct run leaves alone, each tagged with the adjudicator's reason for
# rejecting it (bounded, adequately supported, valid deduction, hedged, a stated limitation) and
# titled so a report bracketing their line flags them too. Severity is the adjudicator's call and
# is not checked. Figures are referenced by local PNG path.
# See evals_inspectai/common/issue_inventory.py.

# ---- sound reasoning: nothing to report ------------------------------------------------------
- input: |
    # Effect of Reduced Pump Cycle Times

    The maintenance team measured pump cycle times at all four sites before and after a software upgrade. Across 1,200 cycles, the upgraded controller reduced the average cycle time from 4.2 s to 3.6 s. A two-sample t-test on the 1,200 paired observations yielded p < 0.001 with an effect size of d = 0.42. We therefore conclude that, under the conditions tested at these four sites, the upgrade reduced pump cycle time.
  decoys:
  - anchor: under the conditions tested at these four sites, the upgrade reduced pump cycle time
    reason: bounded_claim
    title: Invalid Inference
  notes: A sizeable paired sample, a test with an effect size, and a conclusion bounded to the sites tested.
- input: |
    # Tutoring Pilot: Final Report

    ## Design

    We randomly assigned 640 ninth-grade students at three high schools to daily small-group math tutoring or to their usual study hall for one school year. Assignment was by lottery within each school, and 97 percent of students in both arms completed the end-of-year assessment.

    ## Results

    Students assigned to tutoring scored 0.21 standard deviations higher on the end-of-year assessment (95% CI 0.12 to 0.30). We conclude that the tutoring program raised math achievement among the ninth graders in these three schools during the pilot year.
  decoys:
  - anchor: We conclude that the tutoring program raised math achievement among the ninth graders
    reason: adequate_support
    title: Invalid Inference
  notes: >-
    The adjudicator's own worked example in another domain: randomized, adequately powered, with a
    confidence interval, and bounded to the students studied. Flagging it as overgeneralization is the
    false positive the skill warns against.
- input: |
    # Freight Labelling Audit

    Under the carrier agreement, every shipment over 20 kg requires a freight label. Shipment 311 weighed 26 kg at the dock scale. Shipment 311 therefore required a freight label, and the audit records its missing label as a breach of the agreement.
  decoys:
  - anchor: Shipment 311 therefore required a freight label
    reason: valid_deduction
    title: Invalid Inference
  notes: Modus ponens from a stated rule and a measured fact. Valid, however much it looks like a leap.
- input: |
    # Tuesday Backup Incident

    The backup job writes a completion entry to the system log whenever it finishes. The log for Tuesday contains no completion entry from the backup job, so Tuesday's backup did not finish, and we restored from Monday's snapshot instead.
  decoys:
  - anchor: so Tuesday's backup did not finish
    reason: valid_deduction
    title: Invalid Inference
  notes: Modus tollens. Contrast with the affirming-the-consequent and denying-the-antecedent records.
- input: |
    # Ballot Measure 12: Survey Results

    ## Method

    We surveyed a random sample of 2,000 registered voters drawn from the state voter file, weighted to the file's age, sex and county distribution. The margin of error is plus or minus 2.2 percentage points.

    ## Findings

    Fifty-four percent of respondents said they support Measure 12. We therefore estimate that a majority of the state's registered voters supported the measure at the time of the survey.

    ## Limitations

    We did not test alternative wordings of the question, and support may shift as the campaign advances.
  decoys:
  - anchor: We therefore estimate that a majority of the state's registered voters supported the measure
    reason: representative_sample
    title: Invalid Inference
  - anchor: We did not test alternative wordings of the question
    reason: stated_limitation
    title: Invalid Inference
  notes: >-
    A generalization from a probability sample with a stated margin of error is sound, unlike the
    online-poll record. The limitation is a weakness the authors state, not an inferential error.
- input: |
    # Early Results from the Transit Pass Program

    Ridership among pass holders rose 11 percent in the first three months, compared with 2 percent for riders who did not receive a pass. These early results suggest, but do not establish, that the pass encourages transit use; the randomized follow-up study starting in March is designed to test that.
  decoys:
  - anchor: These early results suggest, but do not establish, that the pass encourages transit use
    reason: hedged_claim
    title: Invalid Inference
  notes: A tentative claim marked as tentative, with the test that would settle it named.
- input: |
    # Sodium Reduction and Blood Pressure

    A meta-analysis of 133 randomized trials with 12,197 adult participants found that reducing sodium intake lowered systolic blood pressure by an average of 4.3 mmHg, with larger effects in participants with hypertension (Huang et al., 2020). Drawing on that evidence, this brief concludes that a sustained reduction in sodium intake can be expected to lower adults' systolic blood pressure modestly, by a few mmHg on average.
  decoys:
  - anchor: this brief concludes that a sustained reduction in sodium intake can be expected to lower adults' systolic blood pressure modestly
    reason: cited_support
    title: Invalid Inference
  notes: >-
    A modest conclusion restating what the cited meta-analysis found, for the population it studied. A
    policy recommendation (sodium limits for a cafeteria, say) would add a premise the evidence lacks:
    that the limits cut total intake.
