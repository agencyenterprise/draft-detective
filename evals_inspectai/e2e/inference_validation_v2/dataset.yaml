    # Warehouse Staffing, Fiscal Year 2024

    ## Headcount

    The warehouse employed 212 staff at the start of the fiscal year and 238 at the end. Most of the increase came in the receiving team, which grew from 41 to 60 people after the second loading dock opened in May.

    ## Turnover

    Forty-seven employees left during the year, 22 of them in the first three months of their employment. Exit interviews were completed with 31 of the 47.
