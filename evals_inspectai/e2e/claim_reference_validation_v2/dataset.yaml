    # Discussion

    Microplastic contamination is now ubiquitous: prior work has shown that 93% of bottled water samples worldwide contain detectable microplastic particles (Patel et al., 2018). This finding motivates global regulatory action.

    ## References

    1. Patel, R., et al. (2018). Microplastic contamination in bottled water: a North American survey.
  sources:
  - &patel
    file_name: patel_2018_microplastics.md
    markdown: |
      # Microplastic Contamination in Bottled Water: A North American Survey (2018)

      ## Abstract

      We analyzed 259 bottled water samples sourced exclusively from retailers in the United States and Canada. 93% of samples contained at least one detectable microplastic particle.

      ## Geographic scope

      Sampling was restricted to North American distribution channels. Brands sold in Europe, Asia, Africa, South America, and Oceania were not included. We make no claims about contamination rates in other regions.
  expected_issues:
  - id: patel_worldwide
    title: partially_supported
    anchor: 93% of bottled water samples worldwide contain detectable microplastic particles
    rationale: >-
      The 93% figure is right, but the survey sampled only North American retailers and makes no claim about other regions, so "worldwide" overreaches.
