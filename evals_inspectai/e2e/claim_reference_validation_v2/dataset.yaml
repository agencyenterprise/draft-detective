# Eval samples for the claim_reference_validation_v2 workflow, in inventory form. The workflow
# reports one record per in-text citation, whatever its verdict, so every citation in a document is
# an expected issue: anchored on the cited claim, titled with the evidence-alignment level a correct
# run assigns (supported, partially_supported, unsupported, unverifiable; the eval reads the level
# as the title), and carrying the labeller's account of what the source says (`rationale`), which the
# judged criterion compares the reported rationale against. Decoys are lines a correct run does not
# report: bibliography entries, footnote entries, a footnote marker pointing to commentary, claims
# that cite nothing. `sources` are the supporting files uploaded with the document; a cited work with
# no source is unverifiable. YAML anchors reuse a source across records.
# See evals_inspectai/common/issue_inventory.py.

# ---- one citation, one level --------------------------------------------------------------------
- input: |
    # Introduction

    Remote work has reshaped how teams collaborate.

    A 2020 industry survey found that fully remote employees reported a 30% increase in self-reported productivity compared to in-office baselines (Smith, 2020). This shift has prompted firms to rethink office footprints.

    ## Methods

    We synthesize three industry surveys to estimate the directional effect of remote work on weekly output.

    ## References

    1. Smith, J. (2020). Remote work productivity survey 2020. Journal of Workplace Studies.
  sources:
  - &smith
    file_name: smith_2020_remote_productivity.md
    markdown: |
      # Remote Work Productivity Survey 2020

      ## Key Findings

      Across 4,200 respondents, fully remote employees reported a 30% increase in self-reported productivity relative to their pre-pandemic in-office baselines. The effect was strongest among engineering and design roles, where deep-focus time rose substantially.

      ## Methodology

      The survey was conducted between March and August 2020. Respondents were drawn from 12 industries.
  expected_issues:
  - id: smith_productivity
    title: supported
    anchor: fully remote employees reported a 30% increase in self-reported productivity
    rationale: >-
      The survey reports exactly this: a 30% increase in self-reported productivity for fully remote employees against in-office baselines.
  decoys:
  - anchor: 1. Smith, J. (2020). Remote work productivity survey 2020.
    reason: reference_entry
  - anchor: Remote work has reshaped how teams collaborate.
    reason: uncited_claim
- input: |
    # Findings

    Our analysis indicates that remote work doubles the rate of cross-team collaboration in large enterprises (Doe, 2019). This contrasts with prior assumptions that distributed teams collaborate less.

    ## References

    1. Doe, A. (2019). Cross-team collaboration in distributed organizations. Journal of Org Studies.
  sources:
  - &doe
    file_name: doe_2019_collab.md
    markdown: |
      # Cross-Team Collaboration in Distributed Organizations (2019)

      This study examines collaboration patterns in distributed software organizations. We find that the volume of cross-team Slack messages was roughly comparable between co-located and distributed teams, with no statistically significant difference (p = 0.42). We did not measure changes in collaboration over time as remote work was adopted.
  expected_issues:
  - id: doe_doubles
    title: unsupported
    anchor: remote work doubles the rate of cross-team collaboration in large enterprises
    rationale: >-
      The study finds no significant difference in cross-team messaging between co-located and distributed teams, which contradicts a doubling, and it did not measure change over time.
