- input: |
    # Expanding Paid Family Leave: Evidence for the State Task Force

    ## Summary

    This memo reviews the evidence on paid family leave for the task force. It draws on five studies, cited below, and on the state's own claims data.

    ## Labor Force Effects

    California's paid family leave program increased mothers' employment one year after birth by about 7 percentage points (Rossin-Slater et al., 2013). Baum and Ruhm (2016) found that the program also increased fathers' leave-taking, although the effect was small. Paid leave programs raise women's employment in every state that has adopted them (Rossin-Slater et al., 2013).

    ## Employer Costs

    Most employers in California reported that the program had a positive or neutral effect on productivity (Appelbaum & Milkman, 2011). Small businesses, however, bore costs large enough to reduce hiring (Appelbaum & Milkman, 2011).

    ## Health

    Access to paid leave has been linked to lower rates of infant hospitalization in the first year (Pihl & Basso, 2019).

    ## Claims Data

    In 2023, 41,200 residents filed claims under the state's temporary disability program, 9 percent more than in 2022. Claims processing took 11 days on average.

    ## References

    1. Appelbaum, E., & Milkman, R. (2011). Leaves that pay: employer and worker experiences with paid family leave in California. CEPR.
    2. Baum, C., & Ruhm, C. (2016). The effects of paid family leave in California on labor market outcomes. Journal of Policy Analysis and Management.
    3. Pihl, A., & Basso, G. (2019). Did California paid family leave impact infant health? Journal of Policy Analysis and Management.
    4. Rossin-Slater, M., Ruhm, C., & Waldfogel, J. (2013). The effects of California's paid family leave program on mothers' leave-taking and subsequent labor market outcomes. Journal of Policy Analysis and Management.
  sources:
  - file_name: rossin_slater_2013_pfl.md
    markdown: |
      # The Effects of California's Paid Family Leave Program on Mothers' Leave-Taking and Subsequent Labor Market Outcomes

      ## Abstract

      We study California's paid family leave program, the first in the United States. The program roughly doubled the average length of maternity leave, from three to six weeks. We also find that it increased the usual weekly work hours of employed mothers of one- to three-year-old children by 10 to 17 percent. Our analysis covers California only.
  - file_name: baum_ruhm_2016_pfl.md
    markdown: |
      # The Effects of Paid Family Leave in California on Labor Market Outcomes

      ## Findings

      Paid family leave increased the probability that fathers took leave in the first year after a birth, by less than one percentage point. Mothers' employment one year after birth rose by about 7 percentage points.
  - file_name: appelbaum_milkman_2011_leaves.md
    markdown: |
      # Leaves That Pay: Employer and Worker Experiences with Paid Family Leave in California

      ## Employer survey

      Of the 253 employers surveyed, 89 percent reported a positive effect or no noticeable effect on productivity. Small businesses were more likely than large ones to report positive effects, and very few employers of any size reported cost increases.
  - file_name: pihl_basso_2019_infant_health.md
    markdown: |
      # Did California Paid Family Leave Impact Infant Health?

      ## Results

      We find a decline in infant hospitalizations in the first year of life after the program's introduction, driven by admissions for conditions such as respiratory infections.
  expected_issues:
  - id: rossin_slater_employment
    title: unsupported
    anchor: increased mothers' employment one year after birth by about 7 percentage points
    rationale: >-
      Rossin-Slater et al. (2013) report longer maternity leave and more weekly work hours, not a 7-point rise in employment; that figure is in Baum and Ruhm (2016), a different source.
  - id: baum_ruhm_fathers
    title: supported
    anchor: Baum and Ruhm (2016) found that the program also increased fathers' leave-taking
    rationale: >-
      Baum and Ruhm report a small increase in fathers' leave-taking, under one percentage point.
  - id: rossin_slater_every_state
    title: unsupported
    anchor: Paid leave programs raise women's employment in every state that has adopted them
    rationale: >-
      The study covers California only and does not report an employment effect; the claim about every state has nothing in the source behind it.
  - id: appelbaum_productivity
    title: supported
    anchor: Most employers in California reported that the program had a positive or neutral effect on productivity
    rationale: >-
      89 percent of surveyed employers reported a positive or no noticeable effect on productivity.
  - id: appelbaum_small_business
    title: unsupported
    anchor: Small businesses, however, bore costs large enough to reduce hiring
    rationale: >-
