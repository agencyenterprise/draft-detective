- input: |
    # Results

    Our initial hypothesis turned out to be incorrect[1], but recent published benchmarks report a consensus throughput ceiling of approximately 1.2 million operations per second for Raft-based coordination[2].

    ## Footnotes

    1. We initially believed throughput would degrade under load; see Section 3 for the corrected reasoning.
    2. Garcia, M. (2022). Modern benchmarks for distributed systems. SIGOPS.

    ## References

    1. Garcia, M. (2022). Modern benchmarks for distributed systems. SIGOPS.
  sources:
  - file_name: garcia_2022_benchmarks.md
    markdown: |
      # Modern Benchmarks for Distributed Systems (2022)

      ## Findings

      Across three coordination protocols, Raft-based implementations sustained a peak throughput of 1.2 million operations per second on the standard YCSB workload, consistent with prior reports. We treat this 1.2M ops/sec figure as the practical ceiling for well-tuned Raft deployments.
  expected_issues:
  - id: garcia_ceiling
    title: supported
    anchor: a consensus throughput ceiling of approximately 1.2 million operations per second
    rationale: >-
      The benchmark paper reports a 1.2 million operations per second peak for Raft and treats it as the practical ceiling.
  decoys:
  - anchor: We initially believed throughput would degrade under load
    reason: footnote_entry
  notes: >-
    Both markers sit in one sentence, so a report of the commentary marker (its footnote is no
    bibliographic reference) would share the claim's line; it shows as a second issue that matches
    nothing and costs precision, and as the footnote entry decoy when it quotes the commentary.
