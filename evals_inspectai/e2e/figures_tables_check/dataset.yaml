# Eval samples for the figures_tables_check workflow, in inventory form (see
# evals_inspectai/common/issue_inventory.py). One record per document; `input` is the document under review
# as markdown, figures referenced by local PNG path.
#
# An issue about one element is anchored where it sits: an untitled label or unlabeled table on that line, an
# unreferenced figure or table on its caption, a missing one on the body sentence that cites it. It is matched
# on the stable part of its title (the rule), since the skill fills in the label itself; the label the anchor
# carries is what the title check in criteria.py expects the title to name. A numbering issue concerns the
# sequence as a whole and could reasonably sit on any of the figures involved, so it has no anchor and is
# matched on "Inconsistent Numbering" alone. Decoys are elements a correct run leaves alone, tagged with the
# rule exception that applies; a decoy with a title is flagged only by an issue of that kind.
#
# Severity follows the issues skill where its scale names the finding: a body reference to a figure or table
# the document lacks is a broken or unresolvable reference (high); an unreferenced figure or table and
# inconsistent numbering are medium. A missing title fits neither description squarely ("absent mandatory
# element" or "rule violation that affects readability"), so its severity is not checked. The skill proposes
# no edits, so no record says anything about edits.
- input: |
    # Urban Mobility Survey: Annual Report

    ## About This Report

    This report presents findings from a one-year survey of commuting patterns across three districts.

    ## Survey Design

    The study deployed monitoring equipment at 26 stations. Figure 1 maps the coverage area and station locations.

    **Figure 1: Survey coverage area and monitoring station locations**

    | District | Stations | Coverage (km²) |
    |----------|----------|----------------|
    | North    | 8        | 45             |
    | Central  | 12       | 32             |
    | South    | 6        | 28             |

    ## Commute Time Results

    Commute durations fell across all districts following the intervention. Table 1 summarises average commute times before and after.

    **Table 1: Average commute times before and after intervention (minutes)**

    | District | Before | After | Change |
    |----------|--------|-------|--------|
    | North    | 34     | 29    | −15%   |
    | Central  | 42     | 36    | −14%   |
    | South    | 28     | 25    | −11%   |

    ## Modal Shift Results

    Modal shift was the primary driver of the observed time savings. Figure 2 shows the change in modal share by district.

    **Figure 2: Modal share change by district (percentage points)**

    | District | Car | Transit | Cycling | Walking |
    |----------|-----|---------|---------|---------|
    | North    | −8  | +5      | +2      | +1      |
    | Central  | −10 | +6      | +3      | +1      |
    | South    | −6  | +4      | +1      | +1      |

    ## Conclusion

    Investment in transit infrastructure reduced car dependency across all three districts.
  expected_issues: []
  notes: Clean. Two figures and one table, each captioned, numbered in sequence and cited in the body; every body
    reference resolves.
