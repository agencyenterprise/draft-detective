    # Urban Heat Island Monitoring: Summer 2025

    ## Network

    Temperature loggers were installed at 40 sites across the city (Fig. 1).

    **Fig. 1: Logger sites by land-cover class**

    | Land cover   | Sites |
    |--------------|-------|
    | Dense urban  | 14    |
    | Suburban     | 12    |
    | Parks        | 8     |
    | Rural fringe | 6     |

    ## Night-time Temperatures

    Dense urban sites were on average 3.8 °C warmer than rural fringe sites at 03:00 (Fig. 2). The gap widened during the July heatwave, when it reached 5.6 °C; hourly profiles for the heatwave week are plotted in Fig. 3.

    **Fig. 2: Mean 03:00 temperature by land-cover class, June–August 2025 (°C)**

    | Land cover   | Mean temperature |
    |--------------|------------------|
    | Dense urban  | 19.4             |
    | Suburban     | 17.9             |
    | Parks        | 16.8             |
    | Rural fringe | 15.6             |

    ## Implications

    Tree planting in dense urban districts should be prioritised in the next greening programme.
