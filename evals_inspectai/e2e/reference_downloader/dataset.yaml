# Eval samples for the reference_downloader workflow. Each record is one reference: `conclusion` is the
# outcome a correct run reaches (a list accepts any of them, for a source whose accessibility depends on the
# live web or on which copy counts), and `file_terms` are phrases from the work's own title that a downloaded
# file must contain, so a source_found is checked against the file the app kept rather than taken on the
# agent's word. Each phrase was checked against every kept copy in a run's log: found in each copy of its
# work, and in no other record's file. See evals_inspectai/e2e/reference_downloader/records.py.

