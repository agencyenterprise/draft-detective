- input: |
    # Smartphones and Teen Mental Health

    ## Overview

    This brief for the parents' association summarises what research says about smartphones and adolescent wellbeing.

    It was prepared by the association's volunteer committee for the spring newsletter.

    ## Claims

    Rates of depressive symptoms among US adolescents rose after 2012, the period in which smartphone ownership became widespread.

    Screen time is a major cause of the decline in adolescent wellbeing, with effects as large as those of heavy drug use.

    ## Our survey

    In our March survey, 71 percent of parents said their child owns a smartphone.
  publication_date: "2018-06-01"
  expected_issues:
  - id: rose
    anchor: Rates of depressive symptoms among US adolescents rose after 2012
    rationale: >-
      Supported by national survey data, uncited: Twenge et al. (2018, Clinical Psychological Science) and
      Mojtabai, Olfson & Han (2016, Pediatrics) on the rise in adolescent depression.
  - id: major_cause
    anchor: Screen time is a major cause of the decline in adolescent wellbeing
    rationale: >-
      A causal claim from correlational data, with conflicting evidence: Przybylski & Weinstein (2017,
      Psychological Science) find small, non-linear associations. The best-known rebuttal (Orben &
      Przybylski 2019) postdates the brief and must not be recommended.
  - id: overview
    anchor: This brief for the parents' association summarises what research says
    required: false
  - id: survey
    anchor: 71 percent of parents said their child owns a smartphone
    required: false
  decoys:
  - anchor: prepared by the association's volunteer committee
    reason: procedural
  notes: >-
    Dated June 2018. The effect-size comparison is the one later papers rebut, so the date check matters
    most here. The overview, which says it summarises the research, may fairly get a synthesis, and the
    survey result a national benchmark.
