# ---- fully clean: a policy mention, a technical "must", terms of art -------------------------
- input: |
    # Vaccine Storage Practices in Rural Pharmacies

    ## Background

    State pharmacy rules set storage conditions for vaccines kept on site. The state vaccine program's storage guide clearly states that refrigerated vaccines must be kept between 2°C and 8°C.

    ## Methods

    We visited 57 pharmacies in 12 rural counties between March and August 2024. Temperature loggers recorded refrigerator temperatures every 15 minutes for 30 days.

    Each logger must be calibrated against a reference thermometer before placement. To ensure accurate readings, loggers were placed in the center of the refrigerator.

    ## Results

    Refrigerators in 49 of the 57 pharmacies stayed within the 2°C to 8°C range for the full 30 days. The remaining eight recorded at least one excursion above 8°C, lasting from 20 minutes to 6 hours.

    Pharmacies that used dedicated vaccine refrigerators recorded no excursions. Those that used household combination units accounted for all eight.

    Two pharmacies reported that they had never received the state's storage guide.

    ## Discussion

    The results suggest that the type of refrigerator may matter more than staff practices, though the sample of pharmacies with household units is small.

    Hospitals in the region store vaccines in critical care units and central pharmacies, which were outside the scope of this study.
  expected_issues: []
  decoys:
  - anchor: clearly states that refrigerated vaccines must be kept
    reason: factual_policy_mention
  - anchor: Each logger must be calibrated against a reference thermometer
    reason: technical_requirement
  - anchor: To ensure accurate readings
    reason: methods_language
  - anchor: had never received the state's storage guide
    reason: descriptive_usage
  - anchor: critical care units
    reason: term_of_art
  - anchor: the type of refrigerator may matter more than staff practices
    reason: hedged_claim
  notes: Clean. The storage guide 'clearly states' a rule (a factual policy mention); the logger 'must be calibrated'
    is a technical requirement; 'ensure' is methods language; 'never received' reports what two pharmacies said;
    'critical care units' is a term of art; the Discussion hedges.

# ---- certainty words and opinion framing in one report -----------------------------------------
- input: |
    # Four-Day School Weeks in Rural Districts

    ## Introduction

    Since 2015, 31 rural districts in the state have moved to a four-day school week. This report compares attendance, test scores, and teacher retention in those districts with 62 similar districts that kept a five-day week.

    ## Data

    We used state administrative data for school years 2014-15 through 2022-23. Teacher retention is the share of teachers who returned to the same district the following year.

    ## Findings

    Attendance rates were similar in both groups, at 94 percent. Math scores in four-day districts were 0.04 standard deviations lower on average; reading scores did not differ.

    Teacher retention was 86 percent in four-day districts and 81 percent in five-day districts.

    The four-day week will definitely help rural districts recruit teachers in the coming decade.

    ## Discussion

    Without doubt, the small drop in math scores is a price worth paying.

    We believe the state should allow any district to adopt a four-day week without prior approval.

    Parents in several districts told us the extra day was used for medical appointments and family work. We did not survey parents systematically, so these accounts may not be representative.
  expected_issues:
  - id: definitely_recruit
    title: Trigger Words Detected
    anchor: will definitely help rural districts recruit teachers
    severity: low
  - id: without_doubt
    title: Advocacy Language Detected
    anchor: Without doubt, the small drop in math scores
    severity: medium
  - id: price_worth_paying_subjective
    title: Subjective Tone Detected
    anchor: is a price worth paying
    severity: medium
    required: false
  - id: we_believe_four_day
    title: Advocacy Language Detected
    anchor: We believe the state should allow any district
    severity: medium
  decoys:
  - anchor: these accounts may not be representative
    reason: hedged_claim
  notes: '''definitely'' predicts recruitment gains the retention figures do not establish (trigger, low). ''Without
    doubt'' presents a trade-off as settled (advocacy, medium); ''a price worth paying'' is also a value judgment,
    so a Subjective Tone issue on that sentence is acceptable. ''We believe the state should allow'' is an opinion-framed
    recommendation (advocacy, medium). The parent accounts are hedged.'

# ---- "requires" as a push versus "requires" as a rule or method ------------------------------
- input: |
    # Lead Testing in School Drinking Water

    ## Background

    A 2022 state law requires every public school to test each drinking water outlet for lead once every three years.

    ## Methods

    Samples were first-draw samples collected after water had sat in the pipes for at least eight hours. The laboratory method requires a 250-milliliter sample from each outlet.

    Results were compared with the state action level of 5 parts per billion.

    ## Results

    Of 14,200 outlets tested in 610 schools, 1,130 (8 percent) exceeded the action level. At least one outlet exceeded it in 290 schools (48 percent).

    Schools built before 1986 accounted for 91 percent of exceedances.

    Replacing every older fixture would certainly eliminate the problem within two years.

    ## Discussion

    Closing this gap requires an immediate overhaul of how the state funds school building repairs.

    The state's handling of the issue has been appalling, and the officials involved have shown breathtaking indifference to children's health.

    The testing covered only the outlets schools identified, so some outlets may have been missed.
  expected_issues:
  - id: certainly_eliminate
    title: Trigger Words Detected
    anchor: would certainly eliminate the problem
    severity: low
  - id: requires_overhaul
    title: Advocacy Language Detected
    anchor: Closing this gap requires an immediate overhaul
    severity: medium
  - id: appalling
    title: Subjective Tone Detected
    anchor: handling of the issue has been appalling
