    # Community College Transfer Rates

    ## Summary

    This report tracks students who started at the state's 16 community colleges in fall 2018 and measures how many transferred to a four-year university within four years.

    ## Findings

    Of 48,300 students in the cohort, 11,600 (24 percent) transferred within four years. Students who completed an associate degree before transferring made up 58 percent of transfers.

    Transfer rates ranged from 14 percent to 37 percent across colleges. Colleges with guaranteed-admission agreements had rates 6 points higher on average, though these colleges also enrolled more students who said they intended to transfer.

    ## Acknowledgments

    We thank the college registrars, who always answered our questions promptly, and the state higher education office, whose support was absolutely essential to this project.

    ## About the Authors

    Priya Raman leads the institute's postsecondary research team. In our opinion, she is the most gifted analyst of her generation.

    ## References

    Lopez, M., and Grant, K. (2020). Transfer Students Must Never Be an Afterthought. Community College Review, 48(3), 201-224.
