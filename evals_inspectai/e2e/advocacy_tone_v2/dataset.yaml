    # Heat-Related Illness Among Outdoor Workers

    ## A Note from the Authors

    We believe this is the most important workplace safety problem of the next decade, and it is urgent that readers take it seriously.

    ## Summary

    This report uses emergency department records from 2018 to 2023 to describe heat-related illness among outdoor workers in the state.

    ## Findings

    Emergency department visits for heat-related illness among outdoor workers rose from 1,420 in 2018 to 2,310 in 2023. Construction and agriculture accounted for 68 percent of visits.

    Visits were concentrated on hot days: 41 percent of visits occurred on the 9 percent of workdays when the heat index exceeded 100°F.

    Employers absolutely ignore heat warnings when deadlines are tight.

    ## Policy Context

    The state has no heat standard for outdoor work. A federal rule proposed in 2024 would have employers provide shade and rest breaks when the heat index reaches 80°F.

    It is urgent that the state adopt its own heat standard this year.

    ## Bibliography

    Rivera, L. (2023). Heat Is Absolutely the Defining Labor Issue. Labor Studies Quarterly, 12(2), 44-61.
