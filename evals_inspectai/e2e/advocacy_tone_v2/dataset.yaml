    # Library Branch Hours After the 2023 Budget Cuts

    ## Background

    In July 2023 the city reduced library funding by 12 percent. The library system responded by closing six of its 24 branches on Sundays and Mondays.

    ## Findings

    Weekly visits fell by 18 percent at the six branches with reduced hours and by 3 percent at the other branches.

    Children's program attendance at the six branches fell from 2,300 to 1,650 per month.

    The city council's decision was a callous betrayal of the families who depend on these branches.

    Branch managers recorded 410 patron requests for Sunday hours in the first month.

    ## Discussion

    The drop in visits was concentrated in branches that serve neighborhoods with the lowest household incomes.

    The library's leadership handled the cuts with admirable grace and deserves enormous credit.

    It is possible that some patrons moved to branches with unchanged hours; the data do not track individual patrons.
