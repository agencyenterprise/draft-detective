# Eval samples for the advocacy_tone_v2 workflow, in inventory form (see
# evals_inspectai/common/issue_inventory.py). Each document is the same short report with one Findings
# sentence swapped. A positive sample expects one issue on that sentence, under the check's title and with
# the severity the skill gives it (trigger words low, advocacy language and subjective tone medium). A
# negative sample is a clean document; where its Findings sentence contains a word the skill must not flag
# in that context, it is a decoy tagged with the carve-out that applies. `target_answer` is the free-text
# expectation the model-graded scorer reads.
- input: |
    # Operations Research Report

    ## Background

    The study examined operations across three sites between 2018 and 2023. Data were collected via instrumented sensors and quarterly audits.

    ## Findings

    The intervention obviously works, so further analysis is unnecessary.

    ## Methods

    A stratified sampling scheme was applied across the three sites.
  expected_issues:
  - id: obviously_works
    title: Trigger Words Detected
    anchor: The intervention obviously works
    severity: low
  - id: unnecessary_analysis_subjective
    title: Subjective Tone Detected
    anchor: further analysis is unnecessary
    severity: medium
    required: false
  notes: '''further analysis is unnecessary'' is also a dismissive evaluative judgment, so a Subjective Tone issue
    on the same sentence is acceptable but not expected.'
  target_answer: The Findings sentence uses 'obviously' to assert certainty without any cited evidence. The agent
    should report a 'Trigger Words Detected' issue (severity low) on that sentence. Advocacy and subjective tone
    are not the primary signal under test.
- input: |
    # Operations Research Report

    ## Background

    The study examined operations across three sites between 2018 and 2023. Data were collected via instrumented sensors and quarterly audits.

    ## Findings

    Section 4 of the regulation states that workers must always wear protective equipment when handling hazardous materials.

    ## Methods

    A stratified sampling scheme was applied across the three sites.
  expected_issues: []
  decoys:
  - anchor: workers must always wear protective equipment
    reason: quoted_regulation
  target_answer: The Findings sentence contains the trigger word 'always', but only as part of a factual quotation
    of a regulation in an objective context. Per the false-positive guardrail, simple factual mentions of legal
    terms should NOT be flagged. The agent should report zero advocacy/tone issues.
- input: |
    # Operations Research Report

    ## Background

    The study examined operations across three sites between 2018 and 2023. Data were collected via instrumented sensors and quarterly audits.

    ## Findings

    We believe stricter enforcement of these regulations would yield better outcomes overall.

    ## Methods

    A stratified sampling scheme was applied across the three sites.
  expected_issues:
  - id: we_believe
    title: Advocacy Language Detected
    anchor: We believe stricter enforcement
    severity: medium
  - id: better_outcomes_subjective
    title: Subjective Tone Detected
    anchor: would yield better outcomes overall
    severity: medium
    required: false
  notes: '''better outcomes overall'' is an unqualified evaluative claim, so a Subjective Tone issue on the same
    sentence is acceptable but not expected.'
  target_answer: The Findings sentence states the authors' opinion ('We believe ...') and recommends stricter enforcement
    without citing evidence. The agent should report an 'Advocacy Language Detected' issue (severity medium) on
    that sentence.
- input: |
    # Operations Research Report

    ## Background

    The study examined operations across three sites between 2018 and 2023. Data were collected via instrumented sensors and quarterly audits.

    ## Findings

    The results are remarkably impressive, and the team's tireless dedication makes this one of the most exciting breakthroughs the field has ever seen.

    ## Methods

    A stratified sampling scheme was applied across the three sites.
  expected_issues:
  - id: remarkably_impressive
    title: Subjective Tone Detected
    anchor: The results are remarkably impressive
    severity: medium
  target_answer: The Findings sentence is laden with value judgments and emotional language ('remarkably impressive',
    'tireless dedication', 'most exciting breakthroughs') rather than a neutral, evidence-based statement. It contains
    no listed trigger words or advocacy phrases, so the agent should report a 'Subjective Tone Detected' issue (severity
    medium).
