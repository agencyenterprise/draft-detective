- input: |
    # Operations Research Report

    ## Background

    The study examined operations across three sites between 2018 and 2023. Data were collected via instrumented sensors and quarterly audits.

    ## Findings

    It is urgent that policymakers act now to close these gaps before the next funding cycle.

    ## Methods

    A stratified sampling scheme was applied across the three sites.
  expected_issues:
  - id: urgent_act_now
    title: Advocacy Language Detected
    anchor: It is urgent that policymakers act now
    severity: medium
  target_answer: The Findings sentence uses the imperative/normative word 'urgent' to push urgency and a call to
    action ('act now') without citing evidence. The agent should report one 'Advocacy Language Detected' issue (severity
    medium) on that sentence.
- input: |
    # Operations Research Report

    ## Background

    The study examined operations across three sites between 2018 and 2023. Data were collected via instrumented sensors and quarterly audits.

    ## Findings

    Agencies must prioritize funding for these programs above all else.

    ## Methods

    A stratified sampling scheme was applied across the three sites.
  expected_issues:
  - id: agencies_must_prioritize
    title: Advocacy Language Detected
    anchor: Agencies must prioritize funding
    severity: medium
  - id: above_all_else_subjective
    title: Subjective Tone Detected
    anchor: above all else
    severity: medium
    required: false
  notes: '''above all else'' is an absolute value judgment, so a Subjective Tone issue on the same sentence is acceptable
    but not expected.'
  target_answer: The Findings sentence uses a standalone imperative 'must' to assert the authors' own obligation/recommendation
    ('Agencies must prioritize ... above all else') without citing evidence. This is normative advocacy, not a description
    of an existing rule. The agent should report one 'Advocacy Language Detected' issue (severity medium).
