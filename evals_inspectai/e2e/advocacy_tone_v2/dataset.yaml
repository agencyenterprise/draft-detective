    # Child Care Access for Essential Workers

    ## Introduction

    During the 2020-2021 emergency, the state paid for child care for essential workers such as hospital staff and grocery employees. This report reviews who used the program and what happened when it ended.

    ## Background

    Current state law requires licensed child care centers to keep one staff member for every four infants.

