# Eval samples for the advocacy_tone_v2 workflow, in inventory form (see
# evals_inspectai/common/issue_inventory.py). The workflow reports one issue per genuine occurrence,
# bracketing the offending sentence, titled by kind: "Trigger Words Detected" (severity low), "Advocacy
# Language Detected" and "Subjective Tone Detected" (both medium). A sentence the skill must leave alone
# is a decoy tagged with the carve-out that applies. A sentence that fairly reads as a second kind as well
# carries that second kind as an optional expected issue (`required: false`). The workflow proposes no
# edits, so no expectation names one. Every paragraph is on one line, so a sentence never spans lines.

# ---- short report, one Findings sentence swapped (samples 1-14) -------------------------------
- input: |
    # Operations Research Report

    ## Background

    The study examined operations across three sites between 2018 and 2023. Data were collected via instrumented sensors and quarterly audits.

    ## Findings

    The intervention obviously works, so further analysis is unnecessary.

    ## Methods

    A stratified sampling scheme was applied across the three sites.
  expected_issues:
  - id: obviously_works
    title: Trigger Words Detected
    anchor: The intervention obviously works
    severity: low
  - id: unnecessary_analysis_subjective
    title: Subjective Tone Detected
    anchor: further analysis is unnecessary
    severity: medium
    required: false
  notes: '''obviously'' asserts certainty with no evidence cited: a trigger word, severity low. ''further analysis
    is unnecessary'' is also a dismissive evaluative judgment, so a Subjective Tone issue on the same sentence is
    acceptable but not expected.'
