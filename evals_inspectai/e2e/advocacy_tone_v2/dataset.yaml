# ---- fully clean: every carve-out in one report -------------------------------------------------
- input: |
    # Wait Times at Urgent Care Clinics in the Metro Region

    ## Introduction

    This report describes wait times at 18 urgent care clinics in the metro region between January 2022 and June 2024. It was prepared for the regional health department.

    ## Data

    Clinics reported arrival and discharge times for 412,000 visits. To ensure comparability across clinics, we excluded visits that lacked a discharge time (2.1 percent of records).

    The state reporting rule requires clinics to submit visit logs within 30 days of the end of each quarter.

    ## Methods

    We estimated median wait times by clinic, month, and hour of arrival. Differences between clinics were tested against a critical value of 1.96.

    ## Results

    The median wait was 38 minutes across all clinics. Waits were longest on Monday evenings, when the median reached 61 minutes.

    Eleven percent of patients surveyed had never visited an urgent care clinic before.

    Clinics that added a second triage nurse had median waits 9 minutes shorter than clinics that did not.

    ## Discussion

    These results suggest that triage staffing may affect wait times, although clinics that added a nurse may differ from the others in ways the data do not capture.

    The findings may not apply to clinics outside the metro region, where patient volumes are lower.
  expected_issues: []
  decoys:
  - anchor: 18 urgent care clinics in the metro region
    reason: term_of_art
  - anchor: critical value of 1.96
    reason: term_of_art
  - anchor: To ensure comparability across clinics
    reason: methods_language
  - anchor: requires clinics to submit visit logs
    reason: existing_obligation
  - anchor: had never visited an urgent care clinic before
    reason: descriptive_usage
  - anchor: suggest that triage staffing may affect wait times
    reason: hedged_claim
  notes: Clean. 'urgent care' and 'critical value' are terms of art; 'ensure' is methods language; 'requires'
    describes an existing reporting rule; 'never' reports a survey count rather than asserting a certainty;
    the Discussion hedges its claims.

