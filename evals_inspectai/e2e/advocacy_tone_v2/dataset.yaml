# ---- several findings of different kinds in one report ----------------------------------------
- input: |
    # Eviction Diversion in Three Counties

    ## Summary

    This report examines eviction diversion programs in Adams, Baker, and Clay counties between 2021 and 2024. We compare case outcomes for tenants who entered diversion with those who went directly to a hearing.

    ## Data and Methods

    We obtained court filing records for 8,412 eviction cases and linked them to program enrollment files. To ensure consistent matching, two analysts reviewed every record that linked on name alone.

    We interviewed 22 program staff and 35 tenants. Interview transcripts were coded in two rounds by separate analysts.

    ## Findings

    Tenants who entered diversion were less likely to receive an eviction judgment: 31 percent did, compared with 58 percent of tenants who went directly to a hearing.

    The mediation sessions undoubtedly changed how landlords viewed their tenants.

    Diversion cases took a median of 47 days to close, compared with 29 days for cases that went directly to a hearing.

    ## Discussion

    In our opinion, diversion should replace the standard hearing process in every county in the state.

    The county's earlier approach was heartless, and its record before diversion is a shameful chapter in local history.

    Tenants chose whether to enter diversion, so the comparison may overstate the program's effect.
  expected_issues:
  - id: undoubtedly_changed
    title: Trigger Words Detected
    anchor: The mediation sessions undoubtedly changed
    severity: low
  - id: in_our_opinion
    title: Advocacy Language Detected
    anchor: In our opinion, diversion should replace
    severity: medium
  - id: heartless
    title: Subjective Tone Detected
    anchor: The county's earlier approach was heartless
    severity: medium
  decoys:
  - anchor: To ensure consistent matching
    reason: methods_language
  - anchor: the comparison may overstate the program's effect
    reason: hedged_claim
  notes: One finding of each kind. 'undoubtedly' asserts a change in landlords' views that nothing in the report
    measures (trigger, low); 'In our opinion' frames a statewide recommendation as opinion (advocacy, medium);
    'heartless' and 'shameful chapter' are value judgments with no listed word (subjective tone, medium). The
    methods 'ensure' and the closing hedge are neutral.

# ---- recommendations: the authors' own push next to a quoted statute ---------------------------
- input: |
    # Youth Apprenticeship Funding in the State Workforce System

    ## Introduction

    This report reviews how the state distributed federal youth workforce funds in program years 2020 through 2023, and how many participants completed an apprenticeship.

    ## Data

    We used participant records from all 12 local workforce boards. The registered apprenticeship program requires each apprentice to log 2,000 hours of on-the-job training before completion.

    ## Findings

    Of 3,140 youth enrolled in funded programs, 1,210 (39 percent) completed an apprenticeship within two years.

    Completion was 46 percent in programs with a paid pre-apprenticeship phase and 31 percent in programs without one.

    Local boards spent 78 percent of youth funds on out-of-school youth.

    ## Recommendations

    Under Section 129 of the Workforce Innovation and Opportunity Act, local areas must spend at least 75 percent of youth funds on out-of-school youth.

    The state could add a paid pre-apprenticeship phase to more programs, given the 15-point difference in completion reported above.

    The state must immediately double its apprenticeship budget, whatever the cost.

    It is critical that the legislature act before the 2027 session, or a generation of young workers will be lost.
  expected_issues:
  - id: must_double_budget
    title: Advocacy Language Detected
    anchor: The state must immediately double its apprenticeship budget
    severity: medium
  - id: whatever_the_cost_subjective
    title: Subjective Tone Detected
    anchor: whatever the cost
    severity: medium
    required: false
  - id: critical_legislature
    title: Advocacy Language Detected
    anchor: It is critical that the legislature act
    severity: medium
  - id: generation_lost_subjective
    title: Subjective Tone Detected
    anchor: a generation of young workers will be lost
    severity: medium
    required: false
  decoys:
  - anchor: local areas must spend at least 75 percent
    reason: existing_obligation
  - anchor: requires each apprentice to log 2,000 hours
    reason: existing_obligation
  - anchor: given the 15-point difference in completion reported above
    reason: supported_recommendation
  notes: Two advocacy findings in the Recommendations section, each the authors' own obligation or urgency with
    no evidence ('must immediately double ... whatever the cost'; 'It is critical that the legislature act').
    'a generation of young workers will be lost' is also emotional language, and 'whatever the cost' an absolute
    value judgment like 'above all else' in sample 7, so a Subjective Tone issue on either sentence is acceptable. Next to them, 'must' in the WIOA sentence and 'requires' in Data describe existing
    rules, and the pre-apprenticeship recommendation rests on the report's own finding, so all three are left alone.

# ---- "the policy clearly states X" versus "X is clearly the best approach" ---------------------
- input: |
    # Replacing School Bus Fleets: Options for Riverside Unified

    ## Background

    Riverside Unified operates 64 diesel school buses, 22 of which are more than 15 years old. The state clean transportation plan offers grants to districts that replace diesel buses.

    Section 4.2 of the state clean transportation plan clearly states that grant funds may cover up to 80 percent of the purchase price of an electric bus.

    ## Options

    Option A replaces the 22 oldest buses with new diesel buses at an estimated cost of $3.1 million.

    Option B replaces the same 22 buses with electric buses at an estimated cost of $7.9 million before grants and $2.4 million after grants, plus $600,000 for charging equipment.

    Option C keeps the current fleet and increases maintenance spending by $250,000 a year.

    ## Analysis

    Over a 12-year service life, estimated fuel and maintenance costs are $4.2 million for Option A, $1.9 million for Option B, and $6.0 million for Option C.

    Option B is clearly the best approach for the district.

    Everyone knows that electric buses are safer for children than diesel buses.

    These estimates assume current electricity prices and may change if rates rise.
  expected_issues:
  - id: clearly_best
    title: Trigger Words Detected
    anchor: Option B is clearly the best approach
    severity: low
  - id: best_approach_subjective
    title: Subjective Tone Detected
    anchor: the best approach for the district
    severity: medium
    required: false
  - id: everyone_knows
    title: Advocacy Language Detected
    anchor: Everyone knows that electric buses are safer
    severity: medium
  decoys:
  - anchor: clearly states that grant funds may cover
    reason: factual_policy_mention
  - anchor: may change if rates rise
    reason: hedged_claim
  notes: The skill's own pair. 'the plan clearly states that grant funds may cover ...' describes what a policy
    document says and is left alone; 'Option B is clearly the best approach' is the skill's example of a trigger
    word (low). 'the best approach', ranked on criteria the report never states, is also a value judgment, so a
    Subjective Tone issue on that sentence is acceptable, as for 'better outcomes overall' in sample 3.
    'Everyone knows' asserts a safety claim the report gives no evidence for (advocacy, medium).

