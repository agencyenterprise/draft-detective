    # Credential Programs for Displaced Workers

    ## About This Report

    This report is intended for state workforce development offices that run training programs under WIOA.

    ## Introduction

    Workers displaced by plant closures often enroll in short credential programs. We followed 1,200 WIOA participants in two states and tracked credential attainment and earnings for two years after they enrolled.

    Participants who finished a credential earned 14 percent more in the second year than those who did not.
  decoys:
  - anchor: This report is intended for state workforce development offices
    reason: specific_audience
  - anchor: tracked credential attainment and earnings
    reason: audience_vocabulary
  notes: Clean. One specific audience; WIOA and credential attainment are that audience's working terms.

