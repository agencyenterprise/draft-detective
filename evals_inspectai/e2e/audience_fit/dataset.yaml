# Eval samples for the audience_fit workflow, in inventory form: one expected issue per audience
# problem (missing, too vague, conflicting) and per paragraph or passage of technical language a
# non-technical audience would stop on, plus decoys the check must leave alone. The workflow proposes
# no edits, so no expectation here names one. "Technical Language" as an expected title also matches
# "Technical Language: Move to Appendix" (titles match as whole words), so a paragraph that could
# fairly be reported either way names the shared prefix. See evals_inspectai/common/issue_inventory.py.

# ---- target audience: missing -----------------------------------------------------------------
- input: |
    # Staffing Rural Health Clinics

    ## About This Report

    This report describes how 14 rural health clinics in three states filled nursing vacancies between 2021 and 2024. The research was funded by a state health foundation.

    ## Introduction

    Rural clinics lose nurses faster than urban hospitals and take longer to replace them. We studied how clinics that kept their vacancy rates low recruited and held on to staff.

    We interviewed 31 clinic managers and surveyed 260 nurses. Clinics that offered housing help filled vacancies in half the time of those that did not.

    ## Recommendations

    State health departments should fund housing stipends for nurses who take rural posts, and clinic networks should share recruiters across sites.
  expected_issues:
  - id: clinics_missing
    title: Target Audience Missing
    anchor: Rural clinics lose nurses faster than urban hospitals
    severity: medium
  decoys:
  - anchor: We interviewed 31 clinic managers and surveyed 260 nurses
    reason: plain_method
  notes: No sentence says who the report is for. The recommendations point at state health departments and clinic networks, which the suggested action may offer; the issue sits on the introduction's first paragraph.

# ---- target audience: too vague ---------------------------------------------------------------
- input: |
    # Broadband Subsidies and School Homework Gaps

    ## About This Report

    This report is intended for policymakers. It reviews how two federal broadband subsidies reached households with school-age children in 2023 and 2024.

    ## Introduction

    Students without home internet complete less homework than their classmates. We compared enrollment in the two subsidies across 120 school districts and found that districts which helped families apply enrolled twice as many households.

    The two subsidies were launched in different years. About one in six of the districts' students had no home connection when the first one opened.
  expected_issues:
  - id: policymakers_bare
    title: Target Audience Too Vague
    anchor: This report is intended for policymakers.
    severity: medium
  decoys:
  - anchor: About one in six of the districts' students had no home connection
    reason: plain_numbers
  notes: The bare label EEI names as too vague. School districts are the ones the finding points to, so a correct suggested action may quote the finding sentence; the plain-numbers decoy is a background sentence it has no reason to cite.

