# ---- technical audience -----------------------------------------------------------------------
- input: |
    # Hospital Mergers and Commercial Prices

    ## About This Report

    This report is intended for health economists and researchers who study hospital markets.

    ## Findings

    We estimate a difference-in-differences regression with hospital and year fixed effects, clustering standard errors by market. Commercial prices at acquired hospitals rose 6 percent relative to controls (β = 0.058, SE = 0.017), and the event-study coefficients show no pre-trend.

    ## Appendix A: Data

    Prices come from commercial claims for 2012 to 2022, aggregated to the hospital-year level.
  decoys:
  - anchor: We estimate a difference-in-differences regression with hospital and year fixed effects
    reason: technical_audience
  - anchor: β = 0.058, SE = 0.017
    reason: technical_audience
  notes: Clean. The stated audience is technical, so regression language and Greek letters belong in the main body. The appendix is there so that a run which reads technical content as belonging in an appendix whatever the audience has somewhere to send it, and is caught.
- input: |
    # A Bounded Estimator for Survey Nonresponse

    ## Introduction

    Survey nonresponse biases estimates when the people who respond differ from those who do not. We propose an estimator that bounds this bias using auxiliary administrative data, and we derive its asymptotic variance.

    ## Method

    Let Y denote the outcome and R the response indicator. Under monotone missingness, the estimator is consistent for the sharp bounds on E[Y], and a bootstrap yields valid confidence intervals.
  expected_issues:
  - id: method_paper_missing
    title: Target Audience Missing
    anchor: Survey nonresponse biases estimates when the people who respond
    severity: medium
  decoys:
  - anchor: the estimator is consistent for the sharp bounds on E[Y]
    reason: technical_audience
  - anchor: we derive its asymptotic variance
    reason: technical_audience
  notes: No audience is stated, so it is missing; but the document is about a new research method, so the inferred audience is technical and its notation is not flagged.

# ---- technical language for a policy audience -------------------------------------------------
- input: |
    # Summer Reading Programs

    ## About This Report

    This report is intended for school district leaders deciding whether to fund summer reading programs.

    ## Findings

    We compared 48 schools that ran a summer program with 52 that did not. Students in program schools gained more in reading over the summer than students in the other schools.

    The effect on reading scores was statistically significant (p < 0.01) in a regression controlling for prior achievement and school fixed effects.

    We also used propensity-score matching, which pairs each program school with a similar school that did not run the program, to check that the gains were not driven by which schools chose to apply.

    Appendix A reports the full regression estimates.
  expected_issues:
  - id: p_value_regression
    title: Technical Language
    anchor: The effect on reading scores was statistically significant (p < 0.01)
    severity: low
  decoys:
  - anchor: We compared 48 schools that ran a summer program with 52 that did not
    reason: plain_method
  - anchor: We also used propensity-score matching, which pairs each program school with a similar school
    reason: explained_term
  - anchor: Appendix A reports the full regression estimates
    reason: appendix_pointer
  notes: One jargon paragraph between plain ones. The matching method is explained where it is used, and the pointer to the appendix is what the check asks for.
- input: |
    # Wildfire Smoke and Emergency Department Visits

    ## About This Report

    This report is written for county public health directors who issue smoke advisories.

    ## Findings

    Emergency department visits for asthma rose on days when smoke pushed fine-particle levels above the federal standard. We modeled daily visits with a distributed lag nonlinear model, and the cumulative relative risk over a five-day lag window was 1.21 (95% CI 1.12 to 1.31).

    Visits rose most among children under 5 and adults over 65. Advisories issued a day before the smoke arrived were followed by smaller rises than advisories issued on the day.
  expected_issues:
  - id: dlnm
    title: Technical Language
    anchor: We modeled daily visits with a distributed lag nonlinear model
    severity: low
  decoys:
  - anchor: Visits rose most among children under 5 and adults over 65
    reason: plain_numbers
  notes: Epidemiological terms of art for health directors who issue advisories; the plain alternative keeps 1.21 (21 percent more visits over five days).

# ---- technical passage ------------------------------------------------------------------------
- input: |
    # Property Tax Relief for Older Homeowners

    ## About This Report

    This report is intended for state legislative staff drafting property tax relief bills.

    ## Chapter 1: Background

    About 38 percent of the state's homeowners are 65 or older, and property taxes on their homes rose by a third between 2015 and 2024.

    ## Chapter 2: Approach

    We used county assessor records for 2015 to 2024 and state income tax filings for the same households.

    We estimate the effect of the credit with a regression discontinuity design at the age-65 eligibility threshold, using a local linear specification with a triangular kernel and a bandwidth chosen by the Calonico, Cattaneo and Titiunik procedure.

    The running variable is the older owner's age in months. We test for manipulation with a McCrary density test and show that covariates are balanced within the bandwidth; the estimates are robust to halving and doubling it.

    ## Chapter 3: Findings

    Homeowners who became eligible for the credit were 4 percentage points less likely to sell their homes in the next three years.
  expected_issues:
  - id: rd_passage
    title: "Technical Language: Move to Appendix"
    anchor: We estimate the effect of the credit with a regression discontinuity design
    severity: medium
  decoys:
  - anchor: We used county assessor records for 2015 to 2024
    reason: plain_method
  - anchor: About 38 percent of the state's homeowners are 65 or older
    reason: plain_numbers
  notes: Two consecutive paragraphs of estimation detail. The upshot for legislative staff is the finding sentence, which a correct suggested action may quote as what to keep, so the plain-numbers decoy is a background sentence instead.

# ---- audience's own vocabulary ----------------------------------------------------------------
- input: |
    # Attendance Interventions in High-Poverty Schools

    ## About This Report

    This report is intended for school principals and district attendance officers in Title I schools.

    ## Findings

    Chronic absenteeism fell from 31 percent to 24 percent in the 18 schools that assigned each chronically absent student an adult mentor. Students with an IEP gained as much as their classmates.

    Principals said that home visits worked best when the mentor already knew the family. Schools that paired the mentors with a weekly attendance team meeting kept the gains into the second year.
  decoys:
  - anchor: Chronic absenteeism fell from 31 percent to 24 percent
    reason: audience_vocabulary
  - anchor: Students with an IEP gained as much as their classmates
    reason: audience_vocabulary
  notes: Clean. Title I, chronic absenteeism and IEP are school leaders' working terms.

# ---- appendix and quoted wording --------------------------------------------------------------
- input: |
    # Apprenticeship Wage Outcomes

    ## About This Report

    This report is intended for state apprenticeship agencies and the employers who sponsor apprentices.

    ## Findings

    Apprentices who completed their programs earned $9,200 more in the third year than similar workers who did not enroll. One sponsor told us, "We needed the propensity-score results before our board would fund a second cohort."

    ## Appendix C: Estimation

    We match apprentices to nonparticipants on propensity scores estimated by logistic regression on age, prior earnings and industry, and report average treatment effects on the treated with bootstrapped standard errors.
  decoys:
  - anchor: We needed the propensity-score results before our board would fund a second cohort
    reason: quoted
  - anchor: We match apprentices to nonparticipants on propensity scores
    reason: appendix
  notes: Clean. The only technical wording in the main body is inside a quotation; the estimation detail is in an appendix.

# ---- audience missing, inferred non-technical, with technical language -------------------------
- input: |
    # Jail Diversion for People with Mental Illness

    ## Introduction

    Many people booked into county jails have a serious mental illness. We evaluated a program that diverts them to treatment before arraignment in two counties.

    ## Findings

    Participants were rebooked less often than similar people who were not diverted. Using inverse probability of treatment weighting to balance the groups on observables, the hazard ratio for rebooking within a year was 0.71.

    ## Recommendations

    The county board should extend the program to the third court district and fund two more case managers.
  expected_issues:
  - id: jail_missing
    title: Target Audience Missing
    anchor: Many people booked into county jails have a serious mental illness
    severity: medium
  - id: iptw_hazard
    title: Technical Language
    anchor: Using inverse probability of treatment weighting to balance the groups
    severity: low
  notes: No audience is stated; the recommendations point to a county board, a non-technical reader, so the weighting and hazard-ratio language is flagged too.

