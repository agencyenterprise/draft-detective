# Eval samples for the sentence_structure workflow, in inventory form: the issues a correct run
# reports (anchored by verbatim quotes, with edit expectations) and the decoys it must leave alone
# (with the reason). See evals_inspectai/common/issue_inventory.py.
# Short snippets pin one kind each; clean documents measure false positives, including sentences
# whose only problem another Writing Style check owns; the reviewer-feedback fixtures carry the
# patterns inside long paragraphs and, in the long report, into the last chapter.

# ---- incomplete sentences ------------------------------------------------------------------
- input: |
    # Rural Broadband Grant Review

    ## Methods

    The review examined whether grantees met their buildout milestones on schedule. The milestone definitions for each grant tier described in Appendix A. We compared grantee reports with field inspection records from 2024.

    We asked grantees about three topics:

    - Timing of construction starts
    - Cost per connected household
    - Barriers to subscriber uptake

    ## Findings

    Most grantees met their first milestone on time. Two grantees reported delays of more than six months. Because the state changed its permitting rules midway through the second year.
  expected_issues:
  - id: definitions_described
    title: Incomplete Sentence
    anchor: The milestone definitions for each grant tier described in Appendix A.
    edit_expected: true
    edit:
      must_include:
      - Appendix A describes
  - id: stranded_because
    title: Incomplete Sentence
    anchor: Because the state changed its permitting rules
  decoys:
  - anchor: Timing of construction starts
    reason: list_fragment
  - anchor: Cost per connected household
    reason: list_fragment
  notes: The because-clause could explain either of the two sentences before it, so the check may attach it or ask;
    either is acceptable, and neither an edit nor its absence is scored.
- input: |
    # Small Business Loan Fund Review

    ## Methods

    The review assessed whether the fund reached businesses that banks had turned down. The loan terms for each of the three funding rounds shown in Table 1. We met with the fund's staff and reviewed files from 120 loans.

    Loan officers met with each applicant and discussed repayment them before closing. Most loans closed within 30 days of the application.
  expected_issues:
  - id: terms_shown
    title: Incomplete Sentence
    anchor: The loan terms for each of the three funding rounds shown in Table 1.
    edit_expected: true
    edit:
      must_include:
      - Table 1 shows
  - id: dropped_with
    title: Incomplete Sentence
    anchor: discussed repayment them before closing
    edit_expected: true
    edit:
      must_include:
      - repayment with them
  decoys:
  - anchor: We met with the fund's staff and reviewed files from 120 loans.
    reason: grammatical_shared
  notes: The missing verb would make a passive, so the fix leads with the table instead.

# ---- broken shared constructions -----------------------------------------------------------
- input: |
    # Community Health Worker Program Assessment

    ## Results

    The program has increased awareness of and enrolled hundreds of residents in the county's Medicaid expansion. Clinic directors described the workers as good or better than the outreach firm they replaced. We collected and analyzed intake forms from all six clinics. Patients reported improved access to and use of preventive services.

    Most workers were interested and committed to staying in the role for a second year. Turnover fell from 40 percent to 12 percent.
  expected_issues:
  - id: awareness_of_and
    title: Broken Shared Construction
    anchor: increased awareness of and enrolled hundreds of residents
    edit_expected: true
    edit:
      must_not_include:
      - awareness of and
  - id: good_or_better
    title: Broken Shared Construction
    anchor: as good or better than the outreach firm
    edit_expected: true
    edit:
      must_include:
      - as good as
  - id: interested_and_committed
    title: Broken Shared Construction
    anchor: interested and committed to staying
    edit_expected: true
    edit:
      must_include:
      - interested in
  decoys:
  - anchor: We collected and analyzed intake forms
    reason: grammatical_shared
  - anchor: improved access to and use of preventive services
    reason: grammatical_shared
  notes: Both decoys share an object that each verb or noun takes on its own; the three issues share one that fits only
    one half.

# ---- faulty parallelism --------------------------------------------------------------------
- input: |
    # Teacher Residency Program Review

    ## Program Model

    The residency aims to recruit career changers, training them alongside a mentor teacher, and to place them in hard-to-staff schools. Residents receive a stipend, tuition support, and mentors meet with them weekly. The evaluation considered not only retention in the district but residents' classroom performance.

    Both residents and mentors completed surveys in the spring. Residents valued the stipend, the cohort model, and the weekly coaching.
  expected_issues:
  - id: infinitive_gerund
    title: Faulty Parallelism
    anchor: to recruit career changers, training them alongside a mentor teacher
    edit_expected: true
    edit:
      must_not_include:
      - training them
  - id: noun_noun_clause
    title: Faulty Parallelism
    anchor: Residents receive a stipend, tuition support, and mentors meet with them weekly.
  - id: not_only_but
    anchor: not only retention in the district but residents' classroom performance
    required: false
  decoys:
  - anchor: Both residents and mentors completed surveys
    reason: correct_correlative
  - anchor: Residents valued the stipend, the cohort model, and the weekly coaching.
    reason: parallel_series
  notes: The stipend sentence can be fixed as a noun series or as two clauses, so neither an edit nor its wording is
    scored. "Not only X but Y" without "also" is accepted usage, so reporting it is optional.
- input: |
    # Food Bank Distribution Study

    ## Approach

    We examined the routes that both reduced delivery times, as well as the routes that raised fuel costs. Partner pantries either received deliveries on a fixed schedule or by request. Drivers, as well as warehouse staff, took part in the interviews.

    The study covered both urban and rural pantries, and it ran from January to June 2025.
  expected_issues:
  - id: both_as_well_as
    title: Faulty Parallelism
    anchor: both reduced delivery times, as well as the routes
    edit_expected: true
    edit:
      must_not_include:
      - both reduced
  - id: either_misplaced
    title: Faulty Parallelism
    anchor: either received deliveries on a fixed schedule or by request
    edit_expected: true
    edit:
      must_include:
      - either on a fixed schedule
  decoys:
  - anchor: Drivers, as well as warehouse staff, took part
    reason: as_well_as
  - anchor: both urban and rural pantries
    reason: correct_correlative
