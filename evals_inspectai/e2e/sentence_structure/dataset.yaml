# ---- indirect summary sentences ------------------------------------------------------------
- input: |
    # Library Digital Literacy Pilot

    ## Findings

    Three themes emerged from the interviews with librarians. Demand exceeded class capacity at every branch, older patrons preferred small groups, and most patrons wanted help with a specific task rather than a general course. Table 2 summarizes attendance by branch.

    ## Recommendations

    Several key recommendations emerged from the analysis of class attendance data, interviews with librarians, and a review of comparable programs. We list them in order of cost.

    First, the library should offer evening classes at the two branches with the longest waitlists. Second, it should train volunteers to give one-on-one help.
  expected_issues:
  - id: recommendations_emerged
    title: Indirect Summary Sentence
    anchor: Several key recommendations emerged from the analysis
    edit_expected: true
    edit:
      must_not_include:
      - emerged
  decoys:
  - anchor: Three themes emerged from the interviews with librarians.
    reason: emergent_finding
  - anchor: Table 2 summarizes attendance by branch.
    reason: direct_leadin
  - anchor: We list them in order of cost.
    reason: direct_leadin
  notes: Themes emerge from interview data; recommendations are the authors' own and do not.
- input: |
    # County Court Text Reminder Evaluation

    ## Results

    It is in Table 4 that the reminder costs for each county are presented. What the analysis showed across the four counties was a steady decline in missed court dates after reminders began. Missed court dates fell from 21 percent to 14 percent in the first year.

    ## Conclusions

    A number of conclusions arose from comparing the four counties' court records. We discuss each below, starting with cost.
  expected_issues:
  - id: cleft_table
    title: Indirect Summary Sentence
    anchor: It is in Table 4 that the reminder costs
    edit_expected: true
    edit:
      must_include:
      - Table 4
      must_not_include:
      - It is in Table 4
  - id: conclusions_arose
    title: Indirect Summary Sentence
    anchor: A number of conclusions arose from comparing
    edit_expected: true
    edit:
      must_not_include:
      - arose
  decoys:
  - anchor: What the analysis showed across the four counties
    reason: other_check
  - anchor: Missed court dates fell from 21 percent to 14 percent in the first year.
    reason: direct_leadin
  notes: The pseudo-cleft "What the analysis showed... was" is a placeholder lead-in, which Concision owns.

- input: |
    # Regional Transit Fare Study

    ## Findings

    If we assume that fares rose by 10 percent, it is possible to estimate the effect on ridership for each of the four routes. A summary of the ridership changes for each route is shown in Figure 3. This summary suggests that the express routes would lose the most riders unless the authority adds off-peak service. These numbers are reflective of two patterns in the data. The section below contains several tables to illustrate the changes by route.

    ## Conclusions

    It is in Table 5 that the cost of each option is compared. Several lessons emerged from the authority's ridership counts and rider surveys. The first concerns off-peak service.
  expected_issues:
  - id: cleft_table_5
    title: Indirect Summary Sentence
    anchor: It is in Table 5 that the cost of each option is compared.
    edit_expected: true
    edit:
      must_not_include:
      - It is in Table 5
  - id: lessons_emerged_authority
    title: Indirect Summary Sentence
    anchor: Several lessons emerged from the authority's ridership counts
    edit_expected: true
    edit:
      must_not_include:
      - emerged
  decoys:
  - anchor: it is possible to estimate the effect on ridership
    reason: other_check
  - anchor: A summary of the ridership changes for each route is shown in Figure 3.
    reason: other_check
  - anchor: This summary suggests that the express routes would lose the most riders
    reason: hedged_summary
  - anchor: These numbers are reflective of two patterns in the data.
    reason: other_check
  - anchor: The section below contains several tables to illustrate the changes by route.
    reason: direct_leadin
  notes: Lead-ins that tripped the check on real RAND drafts. Only the cleft and the misattributed "emerged" are this
    check's; the placeholder and wordy lead-ins are Concision's, the passive figure lead-in is Active Voice's, and the
    hedged "suggests" sentence must not be merged with the sentence before it into "Figure 3 shows...".

# ---- clean documents -----------------------------------------------------------------------
- input: |
    # Water Utility Rate Study

    ## Methods

    The rate scenarios were modeled by the utility's finance team. In order to compare scenarios, we held the customer base constant. The study was completed in March 2025, and it covered all residential accounts.

    The results, which were reviewed by an outside economist, appear in Chapter 3. Chapter 3 compares the three scenarios.
  expected_issues: []
  decoys:
  - anchor: The rate scenarios were modeled by the utility's finance team.
    reason: other_check
  - anchor: In order to compare scenarios, we held the customer base constant.
    reason: other_check
  - anchor: which were reviewed by an outside economist
    reason: other_check
  - anchor: Chapter 3 compares the three scenarios.
    reason: direct_leadin
  notes: Passive voice and a wordy phrase belong to other Writing Style checks; nothing here is structural.
- input: |
    # Transit Fare Discount Evaluation

    ## Background

    The county launched the discount in 2023 for riders whose household income falls below 200 percent of the federal poverty level, and by the end of 2024 more than 41,000 riders had enrolled, most of them through the online form that the transit agency introduced in the program's second month. One rider told us the program "saved me and my family both money, as well as time on the road." Riders, drivers and agency staff all described enrollment as simple.

    ## Findings

    Ridership among enrolled riders rose by 18 percent in the first year. Table 2 shows the change by route.
  expected_issues: []
  decoys:
  - anchor: The county launched the discount in 2023
    reason: long_parses
  - anchor: saved me and my family both money, as well as time on the road
    reason: quoted
  - anchor: Riders, drivers and agency staff all described enrollment as simple.
    reason: parallel_series
  - anchor: Table 2 shows the change by route.
    reason: direct_leadin
- input: |
    # Hospital Discharge Follow-Up Study

    ## Methods

    Before, during and after the pilot, nurses called patients within two days of discharge. We designed the call script with the hospital's quality team and tested it with ten patients. Patterns emerged from the call notes that the team had not anticipated.

    Table 1 lists the call outcomes, and Figure 2 shows readmissions by month. Both the call rate and the readmission rate are reported for each unit.
  expected_issues: []
  decoys:
  - anchor: Before, during and after the pilot
    reason: grammatical_shared
  - anchor: We designed the call script with the hospital's quality team and tested it with ten patients.
    reason: grammatical_shared
  - anchor: Patterns emerged from the call notes
    reason: emergent_finding
  - anchor: Table 1 lists the call outcomes
    reason: direct_leadin
  - anchor: Both the call rate and the readmission rate are reported for each unit.
    reason: correct_correlative

