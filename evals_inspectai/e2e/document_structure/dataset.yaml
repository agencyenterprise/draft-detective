    # Broadband Subsidies and Small Business Sales

    #### Introduction

    This report asks whether a state broadband subsidy raised online sales for small businesses in rural counties.

    #### Approach

    We compared sales tax records for 1,150 businesses in subsidised and unsubsidised counties before and after the program began.

    #### Findings

    Online sales grew 14 percent faster in subsidised counties. Businesses that had no website before the program saw the largest gains.

    #### Conclusions

    Subsidies helped most where businesses had not yet moved online, which suggests pairing them with help building a first website.

    **Acknowledgements.** We are grateful to the state revenue department for access to anonymised sales tax records and to the rural development office for program data.

    **References.** Kim, S. (2022). Rural broadband and firm growth. *Regional Science Review*, 30(4), 55–71. State Broadband Office (2023). *Program Report, Year Two*.
  expected_issues: []
  notes: >-
    Clean. Sections are fourth-level headings, and Acknowledgements and References are bold-labelled
