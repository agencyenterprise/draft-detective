    # Apprenticeship Completion in the Construction Trades

    ## About This Report

    This report looks at why apprentices in the construction trades do or do not finish their programs.

    ## Acknowledgements

    We thank the state apprenticeship council and the four trade unions that shared program records.

    ## Methods

    We followed 2,300 apprentices who started programs in 2018 and surveyed 410 of them. The survey instrument is reproduced in Appendix B.

    ## Results

    Fifty-eight percent finished within six years. Apprentices who had a mentor on their first job site were 1.6 times as likely to finish.

    ## Conclusion

    Assigning a mentor on the first job site is a low-cost way to raise completion.

    ## References

    1. Kuehn, D. (2019). Registered apprenticeship completion. *Industrial Relations*, 58(3), 402–431.

    ## Appendix B: Survey Instrument

    Q1. How many job sites have you worked on since starting your apprenticeship? Q2. Did someone on your first job site help you learn the trade?
