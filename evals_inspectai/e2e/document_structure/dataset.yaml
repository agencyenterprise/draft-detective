    # Evaluation of a Summer Reading Program

    ## About This Report

    This report evaluates the city library's summer reading program for children aged 6 to 10. In this report we briefly describe our methods before turning to what we found.

    ## Acknowledgements

    We thank the library's youth services staff and the families who took part.

    ## Results

    Participants lost less reading ground over the summer than non-participants: their spring-to-fall scores fell by 2 points on average, against 7 points for children who did not take part. The results were similar for boys and girls.

    ## Conclusion

    The program appears to limit summer reading loss, and the library should consider expanding it to more branches.

    ## References

    1. Alexander, K., Entwisle, D., and Olson, L. (2007). Lasting consequences of the summer learning gap. *American Sociological Review*, 72(2), 167–180.
