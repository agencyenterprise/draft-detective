    # Wildfire Smoke and School Attendance

    ## Introduction

    This report asks how wildfire smoke days affect school attendance in the western part of the state.

    ## Acknowledgements

    We thank the state education agency for attendance records and the air quality district for daily monitor data.

    ## Methods

    We linked daily attendance for 210 schools to the nearest air quality monitor for the 2019–2023 school years and compared attendance on smoke days with other days at the same school.

    ## Results

    Attendance fell by 1.8 percentage points on smoke days and by 3.1 points on days with the highest particulate readings. Elementary schools saw larger drops than high schools.

    ## References

    1. Burke, M., et al. (2022). Exposures and behavioural responses to wildfire smoke. *Nature Human Behaviour*, 6, 1351–1361.
