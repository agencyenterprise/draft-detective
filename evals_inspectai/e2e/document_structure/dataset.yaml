# Eval samples for the document_structure (Document Contents) workflow, in inventory form (see
# evals_inspectai/common/issue_inventory.py). Every issue this workflow reports is about a section the
# document lacks, so no expected issue has an anchor: each is matched on its "Missing Section: <name>" title
# alone, wherever the reported issue sits. A missing required section is high severity, per the issues
# skill. The skill proposes no edits, so no record says anything about edits.

