    # Transit Fare Changes and Ridership

    ## About This Report

    This report examines how the regional transit agency's 2024 fare changes affected ridership.

    ## Acknowledgements

    The transit agency provided fare-card data and answered our questions about the fare policy.

    ## Methods of Payment

    Riders can pay with a reloadable fare card, a mobile ticket, or cash on board. Since 2024, cash fares cost 50 cents more than card fares, and transfers are free only with a card or mobile ticket.

    ## Findings

    Weekday ridership fell 3 percent in the six months after the change, while the share of trips paid in cash fell from 18 to 9 percent.

    ## Conclusion

    The fare changes moved many riders from cash to cards at the cost of a small ridership decline. The agency should monitor whether riders without bank accounts are among those lost.

    ## References

    1. Regional Transit Agency (2024). *Fare Policy Update*.
    2. Taylor, B. (2020). Fare policy and equity. *Transport Policy*, 95, 1–9.
  expected_issues:
