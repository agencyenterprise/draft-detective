    # Recycling Contamination in Curbside Collection

    ## About This Report

    This report looks at how much non-recyclable material ends up in the city's curbside recycling bins and why.

    ## Acknowledgements

    The city's solid waste division provided audit data, and the regional sorting facility let us observe its lines.

    ## Methods

    We audited 400 bins across eight neighbourhoods in spring and fall 2024, sorting each bin's contents by material.

    ## Results

    One bin in five contained enough non-recyclable material to contaminate a load. Plastic bags were the most common contaminant.

    ## Conclusion

    Targeted outreach about plastic bags would remove the largest single source of contamination.

    ## References

    1. City Solid Waste Division (2023). *Technical Appendix to the 2022 Waste Characterization Study*.
    2. Nguyen, T. (2021). Household sorting errors in single-stream recycling. *Waste Management*, 120, 45–53.
  expected_issues: []
