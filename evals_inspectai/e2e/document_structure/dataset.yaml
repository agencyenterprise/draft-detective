    # Heat Pump Adoption in Older Homes

    ## Methods

    We surveyed 1,020 owners of homes built before 1960 who applied for the state heat pump rebate between 2021 and 2024, and compared installation rates with applicants' home characteristics.

    ## Acknowledgements

    The state energy office shared rebate application data and helped us contact applicants.

    ## Results

    Sixty-two percent of applicants installed a heat pump within a year. Owners who also received a free energy audit installed at a higher rate (74 percent) than those who did not (55 percent).

    ## Summary

    Free energy audits appear to raise follow-through on heat pump rebates in older homes, and the energy office should consider offering them to every applicant.

    ## References

    1. State Energy Office (2024). *Heat Pump Rebate Program Report*.
  expected_issues:
