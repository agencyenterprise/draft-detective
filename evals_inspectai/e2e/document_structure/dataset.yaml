    ## About This Report

    This report reviews the first year of the library system's program lending mobile Wi-Fi hotspots.

    ## Acknowledgements

    Branch managers across the library system collected the lending data for this report.

    ## Methods

    We analysed lending records for all 600 hotspots and surveyed 250 borrowers when they returned a device.

    ## Results

    Hotspots were checked out 91 percent of the time. Most borrowers used them for schoolwork or job applications.

    ## Conclusion

    Demand exceeds supply, and the library should add hotspots at the branches with the longest waiting lists.

