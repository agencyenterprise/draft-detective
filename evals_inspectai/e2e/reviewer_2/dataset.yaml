    # Food Bank Demand in 2024: Findings from the Regional Network

    **Author:** Samuel Adeyemi

    ## Abstract

    Demand at the network's 38 food banks rose 18 percent in 2024. Demand fell among seniors while rising among families with children.

    ## Data

    We use visit records from all 38 food banks, covering 420 distribution days in 2023 and 2024. Each visit records the household's size and the age of its head.

    ## Results

    | Group | 2023 visits | 2024 visits | Change |
    |---|---|---|---|
    | Families with children | 61,200 | 70,400 | +15% |
    | Seniors (head aged 65 or older) | 22,800 | 24,600 | +8% |
    | All households | 104,100 | 116,600 | +12% |

    Across the 380 distribution days in the data, the busiest month was November.

    ## Conclusion

    Rising demand is driven by families with children, while seniors are relying less on food banks. The network should shift resources from senior-focused programs to family programs.
  authors: [Adeyemi]
  weaknesses:
  - id: headline_number
    point: The abstract's 18 percent rise contradicts the results table, which shows 12 percent for all households.
  - id: seniors_direction
    point: The abstract and conclusion say senior demand fell, but the table shows senior visits rising 8 percent.
  - id: day_count
    point: The data section reports 420 distribution days and the results 380.
  - id: visits_not_households
    point: Visit counts measure visits, not distinct households, so they may overstate demand growth if the same households visit more often.
  strengths:
  - id: complete_records
    point: It uses visit records from every food bank in the network rather than a sample.
  notes: Internal inconsistencies between the abstract, the data section and the table.
