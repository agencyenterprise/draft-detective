# Eval samples for the reviewer_2 workflow. The output is a prose peer review and a rebuttal, so there
# is no issue inventory: each record lists the substantive weaknesses planted in the document, which a
# rigorous review raises, and its genuine strengths, which the review credits and does not attack. A
# judge grades each point on its own. `authors` names the document's authors, whom both outputs'
# header blocks must name; omit it for a document that names none. Figures are referenced by local
# PNG path. See evals_inspectai/e2e/reviewer_2/criteria.py.

# ---- short arguments ------------------------------------------------------------------------------
- input: |
    # Does Gamified Onboarding Improve Long-Term Retention in Mobile Apps?

    ## Abstract

    We report a study of gamified onboarding in a consumer fitness app. Users who
    received a gamified onboarding flow (badges, streaks, a progress bar) were
    retained at higher rates after 30 days than users who received a standard
    onboarding flow.

    ## Methods

    We ran an A/B test over four weeks with 5,000 new users randomly assigned to the
    gamified or standard onboarding condition. Retention was measured as the
    fraction of users who opened the app at least once between days 28 and 30.

    ## Results

    Day-30 retention was 34 percent in the gamified condition versus 28 percent in
    the standard condition. We conclude that gamification causes higher long-term
    retention and recommend that all onboarding flows adopt gamification.

    ## Conclusion

    Gamified onboarding is a universally effective retention strategy and should be
    the default for all mobile applications.
  weaknesses:
  - id: universal_claim
    point: The conclusion that gamification is "universally effective" for "all mobile applications" generalizes from a single fitness app.
  - id: long_term
    point: A 30-day window cannot support claims about long-term retention.
  - id: no_uncertainty
    point: The 34 versus 28 percent comparison is reported with no significance test, confidence interval or effect size.
  strengths:
  - id: randomized
    point: Users were randomly assigned to the two onboarding conditions, which supports a causal reading within the study.
  - id: clear_metric
    point: Retention is defined precisely (opening the app at least once between days 28 and 30).
