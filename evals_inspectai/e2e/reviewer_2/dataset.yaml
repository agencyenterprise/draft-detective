    # Retention Bonuses and Teacher Turnover in Hard-to-Staff Schools

    **Authors:** Priya Raman and Thomas Okonkwo

    ## Introduction

    Hard-to-staff schools lose teachers at twice the district average. In 2019 the district began paying a $5,000 bonus to teachers in 30 designated schools, payable only to teachers who remain in a designated school for three consecutive years. We ask whether the bonus reduced turnover.

    ## Data and Design

    We use district personnel records for every teacher employed between 2015 and 2023. We compare turnover in the 30 designated schools with turnover in 45 non-designated schools with similar poverty rates, before and after 2019, in a difference-in-differences design.

    ## Results

    Annual turnover in designated schools fell from 24 percent before 2019 to 15 percent after, while turnover in the comparison schools stayed near 17 percent. The difference-in-differences estimate is a 9 percentage point reduction.

    ## Conclusion

    Retention bonuses work. The district should extend the $5,000 bonus to every school, which would cut turnover districtwide by 9 points.
  authors: [Raman, Okonkwo]
  weaknesses:
  - id: parallel_trends
    point: No pre-2019 trends are shown for the two groups, so the parallel-trends assumption behind the difference-in-differences estimate is untested.
  - id: displacement
    point: Teachers may have moved into designated schools from other district schools, so lower turnover there can partly be displacement rather than a net gain for the district.
  - id: extrapolation
    point: Extending the bonus to every school and expecting the same 9-point cut extrapolates from hard-to-staff schools to schools with different turnover and incentives.
  - id: cost
    point: The paper gives no cost per retained teacher, so the policy recommendation lacks a cost-benefit basis.
  strengths:
  - id: admin_data
    point: Administrative personnel records cover every teacher over nine years, avoiding survey non-response.
  - id: comparison_group
    point: It uses a comparison group of schools matched on poverty rate rather than a simple before-and-after comparison.
  notes: An incentive design; the review should think like an economist about selection and displacement.
