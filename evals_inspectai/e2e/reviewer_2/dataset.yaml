    # How Rural Clinic Managers Decide Whether to Adopt Telehealth

    **Author:** Grace Whitfield

    ## Methods

    I interviewed 12 managers of rural health clinics, all members of the Northern Plains Clinic Network, between January and March 2024. I work as a regional account manager for TeleCare, a telehealth vendor, and recruited interviewees from TeleCare's customer list. Interviews lasted about 45 minutes and were recorded and transcribed.

    ## Findings

    Managers described three considerations. First, broadband: "If the connection drops twice, the patient doesn't come back," said one. Second, billing: several said reimbursement rules changed too often to plan around. Third, staff: telehealth required a coordinator most clinics could not afford.

    ## Conclusion

    Most rural clinics in the United States would adopt telehealth if broadband were reliable. Federal broadband funding is therefore the single most effective way to expand rural telehealth.
  authors: [Whitfield]
  weaknesses:
  - id: prevalence_from_interviews
    point: Twelve interviews cannot support a prevalence claim about "most rural clinics in the United States".
  - id: conflict_of_interest
    point: The interviewer works for a telehealth vendor and recruited from its customer list, a conflict of interest and a sample of clinics that already adopted telehealth.
  - id: no_analysis_method
    point: It does not say how the interviews were coded or how the three considerations were derived.
  - id: single_most_effective
    point: Calling broadband funding "the single most effective" lever contradicts its own findings, which name billing and staffing as barriers too.
  strengths:
  - id: quotes
    point: It uses interviewees' own words to illustrate how each barrier operates.
  - id: disclosure
    point: It discloses the author's employer and how interviewees were recruited, which lets readers judge the sample.
  notes: Qualitative work. The disclosure is a strength even though what it discloses is a weakness.
