    # Remote Workers Are Happier: Evidence from a National Survey

    **Authors:** Elena Marsh and Kofi Mensah

    ## Data

    We fielded an online survey through a panel of volunteers who sign up to take paid surveys, receiving 8,214 responses from employed adults in all 50 states. Respondents rated their happiness from 1 to 10 and reported whether they work fully remotely, hybrid or fully on site. The question read: "All things considered, how happy are you these days?"

    ## Results

    Fully remote workers reported an average happiness of 7.4, compared with 6.8 for on-site workers (difference 0.6, 95% CI 0.5 to 0.7).

    ## Conclusion

    Working remotely makes American workers happier. Employers who want a happier workforce should allow remote work.
  authors: [Marsh, Mensah]
  weaknesses:
  - id: opt_in_panel
    point: An opt-in panel of paid survey volunteers is not a probability sample, so it does not support a claim about American workers.
  - id: selection
    point: Workers choose, or are selected into, remote jobs, and differences in occupation, income or disposition could explain the gap; nothing is controlled.
  - id: reverse_causation
    point: Happier or healthier workers may be more likely to get or keep remote jobs.
  strengths:
  - id: wording
    point: It gives the exact wording of the happiness question.
  - id: uncertainty
    point: It reports the difference with a confidence interval.
  notes: >-
    The 8,214 responses are not listed as a strength: size does not correct an opt-in panel's bias, and a
    rigorous review may rightly say so.
