    # Thirteen Days and Thirteen Seconds: What the Cuban Missile Crisis Teaches About AI and Crisis Stability

    **Author:** Margaret Ellison

    ## Argument

    Crisis stability depends on leaders having time to deliberate. In October 1962, President Kennedy's Executive Committee met for thirteen days, rejected an early proposal for air strikes, and settled on a naval quarantine that gave Khrushchev room to withdraw. The crisis ended peacefully because there was time to think.

    ## Evidence

    Drawing on the memoirs of Robert Kennedy, Theodore Sorensen and Arthur Schlesinger, the paper reconstructs the Executive Committee's deliberations day by day, showing how the air-strike option lost support between October 16 and October 22 as members had time to consider Soviet responses.

    ## Implications for AI

    If AI decision-support systems compress a crisis from thirteen days to thirteen seconds, leaders will lose the deliberation that saved the world in 1962. Every future crisis involving AI-enabled command systems will therefore escalate to war. States should ban AI from all military decision-making.
  authors: [Ellison]
  weaknesses:
  - id: single_case
    point: A single case, chosen because it ended peacefully, cannot establish that deliberation time is what prevents escalation (selection on the outcome).
  - id: one_sided_sources
    point: The reconstruction relies on memoirs by Kennedy administration insiders and ignores declassified records and Soviet-side sources, which complicate the account (for example, the secret deal on missiles in Turkey).
  - id: determinism
    point: The claim that every AI-involved crisis "will therefore escalate to war" is deterministic and does not follow from the case.
  - id: ban_overreach
    point: A ban on AI in all military decision-making does not follow; the argument at most supports keeping humans in time-critical escalation decisions.
  strengths:
  - id: mechanism
    point: It states a clear causal mechanism (time to deliberate lets leaders abandon escalatory options) that could be tested.
  notes: >-
    A historical case study applied to technology; the review should think like a historian about sources
    and case selection. The day-by-day reconstruction is not listed as a strength, since it rests on the
    one-sided memoirs the review should question.
