    # The Summer Curfew Cut Youth Crime in Eastport

    **Authors:** Rebecca Stone and Luis Ortega

    ## Background

    After a spike in youth arrests in the summer of 2022, Eastport imposed a 10 p.m. curfew for residents under 17 from June to August 2023.

    ## Findings

    Police recorded 412 arrests of people under 17 between June and August 2022 and 298 in the same months of 2023, a 28 percent decline. Monthly arrest counts for the two summers are given in the appendix. Over the same period, adult arrests in Eastport fell 19 percent. The city also opened two new summer-jobs programs for teenagers in June 2023.

    ## Conclusion

    The curfew cut youth crime by 28 percent and should be made permanent and year-round.
  authors: [Stone, Ortega]
  weaknesses:
  - id: citywide_decline
    point: Adult arrests fell 19 percent over the same period, so much of the 28 percent decline may reflect a citywide trend rather than the curfew.
  - id: summer_jobs
    point: The summer-jobs programs that opened at the same time are an alternative explanation the paper does not address.
  - id: regression_to_mean
    point: Measuring from a spike year invites regression to the mean.
  - id: arrests_not_crime
    point: Arrests measure police activity, not crime, and a curfew itself changes policing.
  - id: year_round
    point: A year-round curfew extrapolates from a summer-only policy.
  strengths:
  - id: reports_confounders
    point: It reports the adult decline and the jobs programs itself, giving readers the facts needed to question its conclusion.
  notes: >-
    Alternative explanations the document itself supplies. The monthly counts it says are in an appendix
    are not in the document, so they are not listed as a strength.
