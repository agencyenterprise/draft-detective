    # Why Deterrence Cannot Work Against Non-State Actors

    **Author:** Viktor Hale

    ## The Argument

    Deterrence works by threatening punishment against something an adversary values. States have territory, populations and leaders that can be held at risk. Non-state armed groups have no territory to hold at risk and no return address. Therefore deterrence cannot work against non-state actors, and counterterrorism policy should abandon deterrence in favor of pre-emption.

    ## An Illustration

    After 2006, Hezbollah largely refrained from large-scale rocket attacks on Israel for more than a decade, which Hezbollah's own leader attributed to fear of the damage an Israeli response would do to Lebanon and to the group's standing there.
  authors: [Hale]
  weaknesses:
  - id: own_counterexample
    point: The Hezbollah illustration contradicts the thesis, since it shows a non-state actor restrained by fear of retaliation.
  - id: false_premise
    point: The premise that non-state groups have nothing to hold at risk is false for groups that hold territory, run social services or depend on state sponsors.
  - id: preemption_leap
    point: Pre-emption does not follow even if deterrence failed, since the paper does not argue its costs or feasibility.
  - id: deterrence_by_denial
    point: It considers only deterrence by punishment, ignoring deterrence by denial.
  strengths:
  - id: explicit_premises
    point: It lays out its premises explicitly, which makes the argument easy to evaluate.
  notes: A theoretical argument whose own illustration undermines it.
