    # Text-Message Reminders and Court Appearance: A Pre-Registered Randomized Trial

    **Authors:** Hannah Liu and Marcus Bell

    ## Design

    We pre-registered the trial's hypotheses, primary outcome and analysis plan before enrolment. Between March and September 2023, 6,800 people issued criminal summonses in Franklin County were randomly assigned to receive text-message reminders three days and one day before their court date, or no reminder. The primary outcome is appearance at the first scheduled court date, taken from court records.

    ## Results

    Failure-to-appear rates were 22.1 percent in the reminder group and 26.4 percent in the control group, a reduction of 4.3 percentage points (95% CI 2.3 to 6.3). The reminders cost $0.04 per message.

    ## Discussion

    Text-message reminders reduced missed first court dates among people issued summonses in Franklin County during the study period. Whether the effect holds for later court dates, for people held before trial or in other counties remains to be tested.
  authors: [Liu, Bell]
  weaknesses:
  - id: first_date_only
    point: The outcome covers only the first court date, so effects on later dates or case outcomes are unknown.
  - id: mechanism
    point: It does not examine why reminders work (forgetting versus logistics or fear), which matters for designing the message.
  strengths:
  - id: preregistered
    point: The hypotheses, outcome and analysis were pre-registered.
  - id: randomized
    point: Random assignment with a large sample and an objective outcome from court records.
  - id: bounded
    point: The conclusion is bounded to the county, population and period studied, and it names what remains untested.
  - id: cost
    point: It reports the intervention's cost.
  notes: >-
    A strong paper with modest weaknesses. A review that attacks its bounded conclusion as overreach,
    or its randomization as flawed, is being contrarian rather than rigorous.
