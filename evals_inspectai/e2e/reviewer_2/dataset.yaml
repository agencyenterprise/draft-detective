    # Language Models Will Make Most Cyberattacks Autonomous by 2027

    **Authors:** Daniel Kwiatkowski, Lena Brandt and Omar Haddad

    ## Summary

    We define an autonomous cyberattack as an intrusion in which a software agent selects targets, gains access and exfiltrates data with no human operator involved after launch. We argue that most cyberattacks will meet this definition by 2027.

    ## Evidence

    On the public CyberBench suite of capture-the-flag challenges, the best language-model agent solved 12 percent of challenges in 2023 and 41 percent in 2025. Two security vendors have published demonstrations of agents compromising deliberately vulnerable test networks. Extrapolating the benchmark trend, agents will solve more than 90 percent of challenges by 2027.

    ## Conclusion

    Since agents will be able to solve nearly all offensive challenges, most real-world attacks will be carried out autonomously by 2027, and defenders who do not prepare for fully autonomous adversaries will be overwhelmed.
  authors: [Kwiatkowski, Brandt, Haddad]
  weaknesses:
  - id: benchmark_gap
    point: Solving capture-the-flag challenges is not the same as conducting real intrusions against defended networks; the paper equates the two.
  - id: extrapolation
    point: Extrapolating a two-point benchmark trend to more than 90 percent by 2027 is unjustified.
  - id: base_rates
    point: It gives no base rate of how attacks are carried out today, so "most attacks" by 2027 has no baseline.
  - id: vendor_demos
    point: Vendor demonstrations on deliberately vulnerable test networks are weak and possibly interested evidence.
  - id: defenders
    point: It ignores that defenders can use the same tools, which bears on whether attackers gain a net advantage.
  strengths:
  - id: definition
    point: It defines an autonomous cyberattack precisely, which makes the claim testable.
  - id: sourced_numbers
    point: It reports concrete benchmark figures from a named public benchmark rather than anecdote alone.
  notes: A claim about AI and security; the review should be skeptical of hype without dismissing the technology.
