    # Employer Survey on Credential Use

    ## Introduction

    This report presents the results of a survey of 300 employers in the state conducted in spring 2025. The survey asked employers which short-term credentials they recognize when hiring. Chapter 2 describes the survey, Chapter 3 presents the results, and Chapter 4 sets out what the state workforce board could do with them.

    ## 2. The Survey

    We drew a random sample of 300 employers from the state's unemployment insurance records, stratified by industry, and 212 responded.

    ## 3. Results

    Employers recognize far fewer credentials than the state's approved list includes. Of the 46 credentials on the list, 11 were recognized by at least half of employers in the industries they target; 19 were recognized by fewer than one in ten. Recognition was highest for credentials that employers helped design, which suggests that employer involvement matters more than a credential's length or cost.

    ## 4. What the Workforce Board Could Do

    The board could review the 19 rarely recognized credentials and ask employers to co-design any credential it adds to the list.
  expected_issues:
  - id: no_stakes
    title: "Missing Framing: Why It Matters"
    anchor: This report presents the results of a survey of 300 employers
    severity: medium
  - id: no_novelty
    title: "Missing Framing: What Is New"
    anchor: This report presents the results of a survey of 300 employers
    line: 5
    severity: medium
  notes: >-
    The introduction says what the report does but not why a reader should care about
    credential recognition or what the survey adds; Chapter 4 answers what happens next.
