    # Wildfire Smoke and Outdoor Workers

    ## Summary

    Farmworkers and construction crews breathe more wildfire smoke than any other workers in the state, and the state's smoke rule, adopted in 2022, has never been checked against what they actually experience on smoky days. Using air monitors worn by 90 workers, this study is the first to measure their exposure directly. Employers followed the rule on most smoky days, but the rule's trigger level left workers exposed for hours before protections began, and lowering the trigger is the change most likely to help.

    ## Background

    The rule requires employers to offer N95 respirators when the air quality index reaches 151 and to move work indoors or stop it at 301.

    ## Methods

    Ninety workers at 12 farms and 8 construction sites wore personal monitors on 34 smoky days in 2024.

    ## Results

    On smoky days, workers spent an average of 3.4 hours in air above an index of 100 before the reading at the nearest regulatory monitor reached 151. Employers offered respirators on 29 of the 34 days once the trigger was reached, but workers had by then already been exposed for most of the morning. The rule worked as written; its trigger came too late.

    ## Conclusion

    Lowering the trigger to 101, or basing it on on-site readings, would start protections earlier. The state could test an on-site trigger with a group of volunteer employers during the 2026 season.
  decoys:
  - anchor: this study is the first to measure their exposure directly
    reason: framing_elsewhere
  notes: >-
    Clean. There is no introduction: the summary answers why it matters and what is new, and the
    conclusion says what happens next.

