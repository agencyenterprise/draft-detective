# Eval samples for the narrative_synthesis workflow, in inventory form: the data dumps, order
# problems, unanswered framing questions and restated points a correct run
# reports, plus decoys for every exclusion the skill states. Order and framing issues are anchored
# where the skill anchors them (the introductory section for order, why and what is new; the
# concluding or last section for what happens next), so the anchor is that section's first
# paragraph. The skill proposes no edits, so no record says anything about edits.
# See evals_inspectai/common/issue_inventory.py.

