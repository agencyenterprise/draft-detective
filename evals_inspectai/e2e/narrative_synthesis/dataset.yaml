- input: |
    # Four-Day School Weeks in Rural Districts

    ## 1. Introduction

    Rural districts that cannot fill teaching positions are turning to four-day weeks to attract staff, and 14 districts in the state have now adopted one. Parents and legislators want to know whether the shorter week costs students learning time, but earlier studies came from other states with longer school days. This report compares achievement in the state's four-day districts with similar five-day districts and recommends what the state should require of districts that adopt the schedule.

    ## 2. How the Four-Day Week Works

    Districts on a four-day week hold classes Monday through Thursday and lengthen each day by about 70 minutes, so that annual instructional hours fall by roughly 5 percent. Most use Fridays for teacher training once a month and leave the other Fridays free, and a few run optional enrichment programs on those days. Districts adopted the schedule to recruit teachers, who value the long weekend, and to save on transportation and utilities.

    ## 3. Achievement

    As Chapter 2 showed, the four-day week trims annual instructional hours by about 5 percent. Students in four-day districts scored slightly lower in math than students in similar five-day districts by the third year, a gap of about 0.05 standard deviations, and no differently in reading. The math gap was larger in districts that left Fridays unstructured, which suggests the use of the fifth day matters more than the schedule itself.

    ## 4. Staffing

    Under the four-day schedule, classes run Monday through Thursday and each day is about 70 minutes longer, which cuts annual instructional hours by roughly 5 percent. Most districts reserve one Friday a month for teacher training and leave the rest free, while a handful offer optional enrichment. The districts chose the schedule chiefly to recruit teachers, who prize the three-day weekend, and to cut transportation and utility costs. Teacher vacancies in the four-day districts fell from 11 percent to 6 percent in the two years after adoption, while vacancies in similar five-day districts stayed near 10 percent.

    ## 5. Recommendations

    The state should require four-day districts to offer structured Friday programming for students behind in math, and should track vacancy rates to confirm the recruiting benefit holds.
  expected_issues:
  - id: schedule_restated
    title: Restated Point
    anchor: Under the four-day schedule, classes run Monday through Thursday
    severity: low
  decoys:
  - anchor: As Chapter 2 showed, the four-day week trims annual instructional hours
    reason: cross_reference
  - anchor: Teacher vacancies in the four-day districts fell from 11 percent to 6 percent
    reason: single_comparison
  notes: >-
    Chapter 4 opens with three sentences that repeat Chapter 2 in new words before its own
    finding. Chapter 3 refers back to the same point in one clause, which is the right way.

