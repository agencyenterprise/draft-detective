    # Measuring Hospital Preparedness for Heat Waves

    ## Introduction

    Heat waves now send more people to emergency departments in the region than any other kind of weather, and the hospitals that receive them were built for a cooler climate. No one has asked hospitals how ready they are to operate through a week of extreme heat. We surveyed the region's 28 hospitals to find out, and we set out what the regional health authority could fund first.

    ## Findings

    Most hospitals are at Tier 2 on power and at Tier 1 on cooling. Only 4 of the 28 reached Tier 3 on any dimension, and none reached it on staffing. Hospitals at Tier 1 on cooling reported closing wards during the 2024 heat wave; those at Tier 2 did not, which suggests Tier 2 is the level that keeps wards open.

    ## The Preparedness Tiers

    We scored each hospital on four dimensions: power, cooling, water and staffing. On each, Tier 1 means the hospital has no plan for sustained heat, Tier 2 means it has a plan and the equipment to carry it out for 72 hours, and Tier 3 means it can operate for a week without outside help.

    ## Survey Methods

    All 28 hospitals completed the survey between January and March 2025, and we visited 10 of them to check their answers.

    ## Recommendations

    The authority should first fund cooling upgrades at the hospitals at Tier 1, since cooling is the dimension where a gap closed wards.
  expected_issues:
  - id: tiers_after_use
    title: Illogical Order
    anchor: Heat waves now send more people to emergency departments
    severity: medium
  notes: >-
    The findings use the tiers before the chapter that defines them, and the survey methods come
    after both.

