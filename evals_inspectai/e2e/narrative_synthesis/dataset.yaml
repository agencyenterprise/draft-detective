- input: |
    # Community Health Worker Program: First-Year Review

    ## Introduction

    Emergency room visits for uncontrolled diabetes cost the county's public hospital more than $9 million in 2023, most of it for a few hundred patients who miss follow-up appointments. The county's community health worker program is the first in the region to assign each of those patients a worker who visits them at home. This review looks at the program's first year and what the county should decide before it renews the program's funding.

    ## Who Enrolled

    The program enrolled 312 patients in its first year, 71 percent of those referred. Enrollment was lowest among patients without a stable address, whom workers could not reach for a first visit.

    ## Costs of the Program

    Patients who enrolled missed fewer follow-up appointments than they had the year before, and 58 percent reported checking their blood sugar daily, up from 22 percent at enrollment. Workers said the home visits helped most when a family member attended, since relatives often managed the patient's medications. Patients who received at least six visits were the most likely to keep their appointments.

    ## Additional Observations

    Several workers noted that referrals arrived in batches at the end of each month, which left them with more first visits than they could schedule. Two clinics sent most of the referrals.

    ## Recommendations

    The county should renew the program, fund outreach to patients without a stable address, and ask all clinics to refer patients as they are identified rather than monthly.
  decoys:
  - anchor: Costs of the Program
    reason: header_mismatch
  - anchor: Additional Observations
    reason: plain_header
  notes: >-
    Clean for this check. The section headed as costs reports patient outcomes, and the
    "Additional Observations" header is vague; both are for the Headers & Skimmability check,
    which reports mismatched and vague headers, so reporting them here would flag the same
    header twice in the editorial preset.

