- input: |
    ## Chapter 3. What Employers Reported

    We interviewed hiring managers at 42 firms between March and June 2025, and 31 of them also completed the follow-up survey.

    Employers reported that the apprenticeship pipeline is now their main source of entry-level technicians. Thirty-one percent of surveyed firms hired at least one apprentice in 2024, up from 12 percent in 2021, and most said the program had shortened the time it took to fill technician roles. For small firms, the pipeline appears to have replaced recruiting agencies altogether.

    Of the 31 firms, 14 had fewer than 50 employees, 11 had between 50 and 250, and 6 had more than 250. Average starting wages were $19.40 an hour at small firms, $21.10 at mid-sized firms and $23.75 at large firms. Retention after 12 months was 68 percent, 74 percent and 81 percent, respectively. Nine firms paid for certification exams, 17 offered tuition assistance, and 5 offered neither. Twenty-two firms had a designated mentor for each apprentice.

    Firms also described what made the program hard to sustain. Most said the paperwork for the wage subsidy took a staff member several days each quarter, and three small firms had stopped claiming the subsidy because of it.
