- input: |
    # Broadband Subsidies for Rural Households

    ## Introduction

    Roughly one in five rural households in the state still lacks a home internet connection fast enough for video calls, which shuts them out of telehealth visits, remote work and online coursework. The state's 2023 subsidy was the first program to pay providers per connected household rather than per mile of cable laid, and no one has yet asked whether that change reached the households it was meant for. This report examines who signed up in the program's first year and what the state could change before the subsidy is renewed in 2026.

    ## Recommendations

    The state should extend enrollment outreach to households without a bank account, allow community organizations to enroll households on their behalf, and publish take-up by county every quarter.

    ## Data and Methods

    We combined the state's enrollment records for 2024 with census estimates of unconnected households in each of the state's 61 rural counties, and interviewed staff at 12 providers.

    ## Findings

    Take-up was highest where providers already had customers. In the 20 counties where a provider had existing lines, 38 percent of eligible households enrolled; in the 41 counties without one, 9 percent did. Provider staff said households without a bank account could not complete the online application, which required a card for the $10 monthly copay. These gaps suggest the subsidy mostly reached households that were already close to a connection.

    ## Conclusion

    The per-household design brought connections to places providers already served, but not yet to the households hardest to reach. The changes above target the application barrier that providers described.
  expected_issues:
  - id: recommendations_first
    title: Illogical Order
    anchor: Roughly one in five rural households in the state
    severity: medium
  notes: >-
    The recommendations come before the data and findings they rest on. Framing is complete, and
    the findings interpret their numbers.
