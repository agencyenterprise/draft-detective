    # Library Card Sign-Ups, 2020 to 2024

    ## Introduction

    This report describes library card sign-ups in the city's 22 branches from 2020 to 2024. It draws on the library system's registration records.

    ## Sign-Ups by Year

    Sign-ups fell by half in 2020, when branches closed for five months, and recovered to their 2019 level by 2023. Most of the recovery came from children's cards, which the city began issuing through schools in 2022; adult sign-ups in 2024 were still 20 percent below 2019.

    ## Sign-Ups by Branch

    The four branches that added evening hours in 2023 recovered fastest, returning to their 2019 level a year before the others.
