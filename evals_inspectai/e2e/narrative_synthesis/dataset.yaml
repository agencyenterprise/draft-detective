    # Paid Family Leave Take-Up Among Hourly Workers

    ## Summary

    Hourly workers in the state use paid family leave at half the rate of salaried workers, mostly because many do not know they are eligible. A mailed notice at hire could close much of the gap.

    ## Introduction

    Workers who cannot take paid leave after a birth or a family illness are more likely to quit, and hourly workers are the group least able to go without pay. The state's program has covered hourly workers since 2020, but its reports do not separate them from salaried workers, so no one knows whether they use it. This report makes that comparison for the first time and suggests what the state could change.

    ## Findings

    Hourly workers used paid leave at half the rate of salaried workers after a birth: 31 percent against 63 percent in 2024. In interviews, most hourly workers who did not apply said they did not know they were eligible, and the gap was widest among workers at firms with fewer than 50 employees, where no one in human resources handled leave. The gap therefore looks like an information problem more than a cost problem.

    ## Next Steps

    The state could mail every new hire a notice of eligibility, and track whether hourly take-up rises in the first year.

    ## Appendix A. Detailed Take-Up Rates

    Take-up after a birth was 29 percent in retail, 33 percent in food service, 35 percent in health care support and 27 percent in warehousing in 2024. Among salaried workers it was 61 percent in retail, 64 percent in food service, 66 percent in health care support and 60 percent in warehousing. Take-up after a family illness was 8 percent for hourly and 14 percent for salaried workers.
  decoys:
  - anchor: Take-up after a birth was 29 percent in retail
    reason: appendix_data
  - anchor: Hourly workers in the state use paid family leave at half the rate
    reason: summary_restatement
  notes: >-
    Clean. The findings restate the summary by design, and the appendix holds an uninterpreted
    breakdown, which appendices may.
