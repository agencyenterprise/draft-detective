- input: |
    # Remote Work and Downtown Transit Ridership

    ## Introduction

    Downtown bus and rail ridership in the region is still 30 percent below its 2019 level, and fares cover a shrinking share of the transit agency's costs, which puts service on every route at risk. Earlier studies estimated ridership losses from remote work using national survey data; this report is the first to use the agency's own tap-card records, which show when each rider stopped commuting. We ask how much of the lost ridership comes from riders who now work from home part of the week.

    ## Data

    We analyzed 4.1 million tap-card trips from 2019 and 2024, linked to an annual rider survey that asks about work location.

    ## Findings

    Most of the lost ridership comes from hybrid workers, not from riders who stopped commuting altogether. Riders who reported working from home two or three days a week took 41 percent fewer peak-hour trips in 2024 than in 2019, while riders who never work from home took about the same number. Trips on Mondays and Fridays fell twice as much as trips midweek, which fits a pattern of hybrid workers choosing the same days to stay home.

    ## Conclusion

    Downtown ridership remains below its 2019 level. Hybrid workers account for most of the decline, and the drop is concentrated on Mondays and Fridays.
  expected_issues:
  - id: no_next_steps
    title: "Missing Framing: What Happens Next"
    anchor: Downtown ridership remains below its 2019 level.
    severity: medium
  decoys:
  - anchor: We analyzed 4.1 million tap-card trips
    reason: methods_description
  notes: >-
    The conclusion only restates the findings: nothing says what the agency could do with them or
    what should be studied next. Why it matters and what is new are answered in the introduction.
