    ## Teachers' Views of the New Schedule

    Teachers described the block schedule as the main barrier to collaboration: with no shared planning period, grade-level teams met only when someone gave up a lunch. "We see each other in the hallway and that's it," one fourth-grade teacher said, and a colleague at another school called team meetings "a thing we used to do."

    "I don't know when I'd meet with the reading coach." "The kids like the longer blocks, honestly." "We got the pacing guide in October." "My mentor is at a different school now." "The new math materials are fine but there are not enough of them." One teacher said, "I spend Sundays planning." Another said, "The schedule changes every quarter."

    Principals agreed that collaboration had suffered and said they would ask the district for a common planning period next year.
