    ## 4. Completion Rates

    In this section, we describe how completion rates changed after the college introduced co-requisite math courses.

    Before the change, 22 percent of students placed into remedial math completed a college-level math course within a year. After it, 61 percent did. The share rose for every group we examined: from 18 to 57 percent for Black students, from 21 to 60 percent for Hispanic students, and from 25 to 64 percent for students over 25.

    Taken together, these numbers show that the co-requisite model nearly tripled completion and did so without widening gaps between groups, which was the main worry faculty raised before the change.

    Table 4.1 lists completion rates for each campus.

    | Campus | Before | After |
    |---|---|---|
    | North | 24% | 63% |
    | South | 20% | 58% |
    | Downtown | 22% | 62% |

    Completion rose by similar amounts on all three campuses, so the gain does not depend on one campus's staff or students.
  decoys:
  - anchor: In this section, we describe how completion rates changed
    reason: signposting
  - anchor: Before the change, 22 percent of students placed into remedial math
    reason: interpretation_follows
  - anchor: Table 4.1 lists completion rates for each campus
    reason: table_or_figure
  notes: >-
    Clean excerpt. The numbers paragraph is interpreted by the paragraph that follows it, and the
    table is followed by its takeaway.
- input: |
    ## 3. How Districts Responded to the New Funding Formula

    Districts that gained money under the new formula spent most of it on staff, not on the programs the formula was meant to expand. Of the 40 districts that gained at least 5 percent, 31 used the gain mainly to raise salaries, which district leaders described as the only way to keep teachers from leaving for neighboring states.

    The legislature passed the formula in March 2021. The state board adopted implementing rules in August 2021. Districts received the first payments in January 2022. The board revised the English learner weight in 2022 and again in 2023. A court case over the poverty weight was filed in 2023 and dismissed in 2024. The formula's hold-harmless provision expires in 2027.

    Salary increases alone did not stop teacher departures in the districts with the highest turnover, where 18 percent of teachers still left in 2024. Leaders in those districts said working conditions, not pay, drove most departures.
  expected_issues:
  - id: chronology_dump
    title: Data Without Synthesis
    anchor: The legislature passed the formula in March 2021
