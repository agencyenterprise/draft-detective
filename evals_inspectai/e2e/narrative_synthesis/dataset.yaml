    # Evaluating a Summer Reading Program

    ## Summary

    The district's summer reading program raised fall reading scores for the students who attended most often, but only a third of invited students attended that often. Expanding transportation is the most direct way to reach more of them.

    ## 1. Introduction

    Students who read little over the summer return in the fall weeks behind where they left in June, and the gap is widest for students from low-income families. The district spends $1.2 million a year on its summer program, yet it had never compared attendees' fall scores with those of similar students who stayed home. This report makes that comparison for summer 2024 and sets out what the district could change for summer 2026.

    ## 2. Program and Data

    **Chapter summary.** The program served 1,450 invited students at six schools, and we compared those who attended with those who did not.

    The program ran for five weeks at six elementary schools. We matched district test records for the 1,450 invited students to daily attendance logs.

    ## 3. Findings

    Students who attended at least 20 of the 25 days scored 8 points higher on the fall reading assessment than similar invited students who did not attend, a gain equal to about six weeks of instruction. Students who attended fewer days scored no differently from non-attendees. Only 34 percent of invited students reached 20 days, and attendance fell most at the two schools without bus service, which suggests transportation limited who could benefit.

    ## 4. Limitations

    Families chose whether to attend, so the comparison may overstate the program's effect if more motivated families attended more often.

    ## 5. Recommendations and Next Steps

    The district should add bus service at the two schools without it and track whether attendance rises in summer 2026. A comparison of fall scores after that summer would show whether the gain holds for the added students.
  decoys:
  - anchor: The program served 1,450 invited students at six schools
    reason: chapter_summary
  - anchor: We matched district test records for the 1,450 invited students
    reason: methods_description
  notes: >-
    Clean, in conventional order: a limitations section after the findings and a chapter that
    opens with its own summary are both ordinary.
