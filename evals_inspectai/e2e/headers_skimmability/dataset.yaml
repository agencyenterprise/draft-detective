- input: |
    # Retaining Tutors in Rural Schools

    ## Summary

    Tutors hired as school staff stayed longer than tutors hired as contractors, but staff positions cost districts more.

    ## Staff Tutors Stayed Longer but Cost More

    **Retention.** Of the 120 tutors hired as contractors, 64 left within a year, compared with 18 of the 70 hired as school staff. Principals said contractors left for jobs with benefits.

    **Staff tutors cost districts about 30 percent more than contractors.** Health insurance accounted for most of the difference, according to district budget records.
