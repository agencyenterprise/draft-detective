# Eval samples for the headers_skimmability workflow, in inventory form: one expected issue per weak
# header (anchored on the header line), per topic-label lead sentence, per long key finding, per
# overlong key findings box (anchored on its first item), and one per document whose opening never
# states its bottom line (anchored on the introduction's header), plus decoys for every exclusion the
# skill states. The workflow proposes no edits: suggested header wording lives in the suggested action,
# which the task's own checks and the judge read. A header anchor is the header text, with an explicit
# `line` where that text also occurs in the prose. Two optional headers in the vouchers report take the
# title "Header", which each of the three header titles matches, since a vague-header and a
# missing-takeaway report of them are both fair. Decoys on one-word headers (Summary, Introduction,
# Background) anchor on the markdown line and take the title "Header": they are flagged only by a
# header issue on that line, not by any issue whose text happens to use the word.
# See evals_inspectai/common/issue_inventory.py.

# ---- vague header ---------------------------------------------------------------------------
- input: |
    # Tutoring in Rural Schools

    ## Introduction

    The state education agency asked us whether small-group tutoring raised reading scores in 38 rural schools. Tutoring raised reading scores by 0.18 standard deviations in its first year, but most principals said they could not sustain it without state funding.

    ## How We Measured Reading Gains

    We compared schools that started tutoring in 2022 with schools that started a year later, using the state's spring reading assessment.

    ## Findings

    Reading scores rose 0.18 standard deviations more in first-wave schools than in comparison schools after one year. The gain was larger for students who attended at least 80 percent of sessions.

    ## Principals Doubt They Can Sustain Tutoring

    Eleven of the 19 principals said they would keep tutoring only with continued state funding.
  expected_issues:
  - id: findings_header
    title: Vague Header
    anchor: Findings
    line: 11
    severity: medium
  decoys:
  - anchor: How We Measured Reading Gains
    reason: procedural_header
  notes: A generic "Findings" over a section with one clear result. The methods header is a label and stays.

# ---- header lacks takeaway -------------------------------------------------------------------
- input: |
    # Court Staffing in Three States

    ## Summary

    We compared court staffing with caseloads in 41 county courts in three states. Staffing fell short of caseload demand in all 41 courts, by a median of 18 percent.

    ## Sources of Caseload and Payroll Data

    We drew caseload counts from each state's court administrator and staffing counts from county payroll records for 2023.

    ## Analysis of Court Staffing Levels

    Every one of the 41 courts had fewer clerks and judges than the caseload standard calls for. The median shortfall was 18 percent, and the largest was 35 percent, in a rural county court. No court met the standard in any quarter of 2023.

    ## Courts Are Filling the Gap with Overtime

    Clerks in 29 courts worked overtime in every month of 2023. Administrators said overtime is the only way to keep up with filings.
  expected_issues:
  - id: staffing_levels
    title: Header Lacks Takeaway
    anchor: Analysis of Court Staffing Levels
    severity: low
  decoys:
  - anchor: Sources of Caseload and Payroll Data
    reason: procedural_header
  notes: The EEI editor's own example. The section plainly supports "Court Staffing Consistently Falls Short of Caseload Demand".

# ---- header does not match content ------------------------------------------------------------
- input: |
    # Free Transit Passes for Community College Students

    ## Introduction

    A county transit agency gave free passes to students at two community colleges in fall 2024. Pass holders enrolled in more credits the following spring than students without passes, and ridership on the routes serving the colleges rose 12 percent.

    ## How the Pilot Worked

    Students at the two colleges could request a pass at registration. The agency issued 3,400 passes.

    ## Program Costs

    Pass holders enrolled in an average of 1.4 more credits in spring 2025 than students without passes. Part-time students who received passes were the most likely to move to full-time enrollment.

    ## Ridership Rose on College Routes

    Weekday boardings on the four routes serving the colleges rose 12 percent between fall 2023 and fall 2024.
  expected_issues:
  - id: costs_header
    title: Header Does Not Match Content
    anchor: Program Costs
    severity: medium
  decoys:
  - anchor: How the Pilot Worked
    reason: procedural_header
  notes: The section is about enrollment, not costs. The finding is a comparison, not an effect, so a suggestion should not say the passes caused the extra credits (the judge checks that).

# ---- bottom line not up front -----------------------------------------------------------------
- input: |
    # Hospital Discharge Planning in Rural Counties

    ## Introduction

    Rural hospitals discharge patients to homes that can be far from follow-up care. The state health department asked us to examine how rural hospitals plan discharges and what happens to patients afterward. In this report, we describe discharge practices at 12 hospitals and the readmissions that followed. Chapter 2 describes our methods, Chapter 3 presents what we found, and Chapter 4 discusses implications for the department.

    ## Chapter 2: Methods

    We reviewed discharge records for 2,300 patients and interviewed discharge planners at each hospital.

    ## Chapter 3: Readmissions Were Lower Where Planners Scheduled Follow-Up

    Hospitals whose planners scheduled a follow-up visit before discharge had 30-day readmission rates of 9 percent, compared with 15 percent at hospitals that left scheduling to patients.

    ## Chapter 4: Every Hospital Could Schedule Follow-Up Before Discharge

    The department could ask every rural hospital to schedule a follow-up visit before discharge; the planners we interviewed said it takes about ten minutes per patient.
  expected_issues:
  - id: no_bluf
    title: Bottom Line Not Up Front
    anchor: "## Introduction"
    severity: high
  notes: The introduction gives purpose and structure only; the 9 versus 15 percent finding first appears in Chapter 3. Every header already states its point.

- input: |
    # Broadband Subsidies and Small Business Adoption

    ## Introduction

    Congress funded a broadband subsidy for small businesses in 2022. We examined whether the subsidy led small businesses in four states to adopt faster service. Most businesses that received the subsidy upgraded their service, but about a third dropped the faster plan when the subsidy ended. The remainder of this report is organized as follows: Chapter 2 describes our data, and Chapter 3 presents the results.

    ## Chapter 2: Data

    We matched subsidy records for 5,800 businesses with provider billing data from 2021 to 2024.

    ## Chapter 3: Most Subsidized Businesses Upgraded, but a Third Later Dropped Back

    Of the 5,800 businesses, 4,100 upgraded to a faster plan within six months of receiving the subsidy. After the subsidy ended, 1,400 of them returned to a slower plan.
  decoys:
  - anchor: The remainder of this report is organized as follows
    reason: signposting
  - anchor: Broadband Subsidies and Small Business Adoption
    reason: document_title
  - anchor: "## Introduction"
    reason: named_section
    title: Header
  notes: Clean. The bottom line sits in the introduction next to a signposting sentence; the neutral title is out of scope.

