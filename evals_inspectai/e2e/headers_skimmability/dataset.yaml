# ---- clean, whole report ----------------------------------------------------------------------
- input: |
    # Heat Emergencies and Outdoor Workers in Arizona

    ## Summary

    Emergency visits for heat illness among outdoor workers in Arizona doubled between 2018 and 2023. Construction and agricultural workers accounted for most of the increase, and three-quarters of the visits came on days when employers were not required to provide shaded rest breaks.

    ## Heat Visits Doubled in Five Years

    Emergency departments recorded 1,240 heat illness visits by outdoor workers in 2018 and 2,510 in 2023.

    ## Construction and Farm Workers Made Most of the Visits

    Construction workers made 46 percent of the 2023 visits and agricultural workers 31 percent.

    ## Most Visits Came on Days Without a Rest-Break Requirement

    Of the 2023 visits, 74 percent occurred on days when the heat index was below the threshold that triggers the state's rest-break requirement.

    ## Recommendations

    The state could lower the heat index threshold for the rest-break requirement, since most visits came on days below it.
  decoys:
  - anchor: "## Summary"
    reason: named_section
    title: Header
  - anchor: "## Recommendations"
    reason: named_section
    title: Header
  notes: Clean. Bottom line up front, every header states its section's point, and the Summary and Recommendations headers are the names readers look for.

