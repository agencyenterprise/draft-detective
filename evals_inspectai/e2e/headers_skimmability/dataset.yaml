    title: Lead Sentence Lacks Takeaway
    anchor: "**Retention.**"
    severity: low
  decoys:
  - anchor: Staff tutors cost districts about 30 percent more than contractors
    reason: argued_lead
  notes: One topic-label opener next to one that already states its point.

- input: |
    # Teacher Survey on Tutoring

    ## Summary

    Most teachers valued the tutoring sessions, but 61 percent said the sessions displaced other instruction.

    ## How We Ran the Survey

    **Survey sample.** We surveyed 212 teachers in the 38 tutoring schools in spring 2024; 174 responded.

    **Survey instrument.** The survey had 22 questions on scheduling, student engagement and coordination.

    ## Teachers Valued Tutoring but Lost Instruction Time

    **Most teachers said tutoring helped their weakest readers.** Of the 174 respondents, 139 said the students they sent to tutoring read more confidently by spring.

    **Sessions came at a cost to other subjects.** Sixty-one percent said the sessions displaced other instruction, most often science.
  decoys:
  - anchor: Survey sample.
    reason: procedural_lead
  - anchor: Survey instrument.
    reason: procedural_lead
  - anchor: Sessions came at a cost to other subjects
    reason: argued_lead
  - anchor: "## Summary"
    reason: named_section
    title: Header
  notes: Clean. Bold labels in a methods section are run-in headings, not lead sentences; the findings openers argue.

# ---- key findings -----------------------------------------------------------------------------
- input: |
    # Community Health Worker Program Evaluation

    ## Key Findings

    - Enrollment in the program grew from 400 to 2,100 patients between 2021 and 2024.
    - Patients who saw a community health worker at least monthly had fewer emergency visits.
    - Blood pressure control improved for enrolled patients with hypertension.
    - To measure costs, we drew on billing records from three clinics, interviews with 14 clinic managers and a survey of 210 patients conducted in spring 2024, and we found that the program cost about $310 per patient per year, most of which went to worker salaries, with smaller amounts for training, travel and supervision.
    - Workers who spoke patients' first language kept patients enrolled longer.
    - Clinic managers valued the workers' home visits.
    - Turnover among workers was 22 percent a year.
    - Patients rated the program 4.6 out of 5.
    - Two of the three clinics plan to expand the program.

    ## Enrollment Grew Fivefold in Three Years

    The program enrolled 400 patients in 2021 and 2,100 in 2024, most of them referred by clinic nurses.

    ## Monthly Visits Went with Fewer Emergency Visits

    Patients who saw a worker at least once a month made 0.6 emergency visits a year, compared with 1.1 for patients seen less often.
  expected_issues:
  - id: too_many
    title: Too Many Key Findings
    anchor: Enrollment in the program grew from 400 to 2,100 patients
    severity: medium
  - id: cost_item
    title: Key Finding Not Brief
    anchor: To measure costs, we drew on billing records from three clinics
    severity: low
  notes: Nine items, one of which buries a cost finding behind its method. The box's header itself must not be retitled.

# ---- protected headers ------------------------------------------------------------------------
- input: |
    # Options for Funding School Transportation

    ## RAND Education, Employment, and Infrastructure

    This research was conducted within the division's education policy program.

    ## Summary

    Rural districts spend twice the state average per student on transportation. Of the three funding options we assessed, a mileage-based formula would close most of the gap at the lowest added cost.

    ## Option 1: Raise the Per-Student Allotment

    A flat increase would cost the state $48 million a year and would send most of the money to suburban districts.

    ## Option 2: Fund by Route Mileage

    A mileage-based formula would cost $21 million a year and would direct 80 percent of it to rural districts.

    ## Option 3: Reimburse Actual Costs

    Full reimbursement would cost $65 million a year and would remove districts' incentive to contain costs.
  decoys:
  - anchor: "Option 1: Raise the Per-Student Allotment"
    reason: protected_header
  - anchor: "Option 2: Fund by Route Mileage"
    reason: protected_header
  - anchor: "Option 3: Reimburse Actual Costs"
    reason: protected_header
  - anchor: RAND Education, Employment, and Infrastructure
    reason: protected_header
  notes: Clean. Option headers and the division header are left alone even though they only label.

- input: |
    # Staffing Scenarios for State Veterans' Homes

    ## Summary

    Of the three staffing scenarios we modeled, only the one that raises nurse wages meets the state's staffing ratio by 2030.

    ## Scenario A: Current Wages

    Under current wages, the homes would fill 71 percent of nursing positions by 2030, short of the 90 percent the ratio requires.

    ## Scenario B: Signing Bonuses

    Signing bonuses would raise the fill rate to 80 percent by 2030 at a cost of $6 million a year.

    ## Scenario C: Higher Nurse Wages

    A 12 percent wage increase would fill 93 percent of positions by 2030 at a cost of $19 million a year.
  decoys:
  - anchor: "Scenario A: Current Wages"
    reason: alternative_header
  - anchor: "Scenario B: Signing Bonuses"
    reason: alternative_header
  - anchor: "Scenario C: Higher Nurse Wages"
    reason: alternative_header
  notes: Clean. Scenario headers name the alternatives being compared, like Option headers, so they keep their names.

# ---- numbered header --------------------------------------------------------------------------
- input: |
    # Workforce Training Vouchers in Ohio

    ## 1. Introduction

    Ohio offered training vouchers to 6,000 laid-off manufacturing workers in 2023. Voucher users were more likely to be employed a year later than eligible workers who did not use a voucher, and the gap was largest for workers over 50.

    ## 2. Data and Methods

    We linked voucher records to state unemployment insurance wage records for 2023 and 2024.

    ## 3. Results

    Of the workers who used a voucher, 71 percent were employed a year later, compared with 58 percent of eligible workers who did not. The gap was 19 percentage points for workers over 50 and 8 points for workers under 30.

    ## 4. Most Voucher Users Found Maintenance Jobs

    Most voucher users who found work were hired into maintenance and repair jobs, according to the wage records.
  expected_issues:
  - id: results_header
    title: Vague Header
    anchor: "3. Results"
    severity: medium
  decoys:
  - anchor: "2. Data and Methods"
    reason: procedural_header
  notes: The suggestion keeps the "3." and, since the comparison is not causal, does not say the vouchers raised employment.

# ---- procedural headers -----------------------------------------------------------------------
- input: |
    # Reducing Wait Times at Veterans' Clinics

    ## Summary

    Wait times for primary care fell at clinics that extended evening hours, from a median of 24 days to 15. Clinics that added telehealth alone saw no change.

    ## Background

    The Veterans Health Administration set a 20-day target for primary care appointments in 2019. In 2023, half of its community clinics missed it.

    ## Data and Methods

    We compared appointment records from 60 clinics before and after each changed its scheduling in 2023.

    ## Waits Fell with Evening Hours but Not with Telehealth Alone

    Median waits fell from 24 days to 15 at the 22 clinics that added evening hours. At the 18 clinics that added only telehealth, the median stayed at 23 days.

    ## Limitations

    We could not observe veterans who sought care outside the clinics.

    ## Appendix A: Clinic List

    The 60 clinics are listed by region in Table A.1.
  decoys:
  - anchor: "## Background"
    reason: procedural_header
    title: Header
  - anchor: Data and Methods
    reason: procedural_header
  - anchor: "## Limitations"
    reason: procedural_header
    title: Header
  - anchor: "Appendix A: Clinic List"
    reason: procedural_header
  - anchor: "Reducing Wait Times at Veterans' Clinics"
    reason: document_title
  - anchor: "## Summary"
    reason: named_section
    title: Header
  notes: Clean. Background, methods, limitations and appendix headers are labels by design.

