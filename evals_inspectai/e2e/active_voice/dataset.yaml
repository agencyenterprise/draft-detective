    # Scope Decisions

    ## Assumptions

    We assume that data centers will require highly reliable power. Off-grid approaches to bridging power supply, sometimes referred to as bridge power,[[26]](#footnote-27) were not considered. We considered behind-the-meter generation where appropriate.
