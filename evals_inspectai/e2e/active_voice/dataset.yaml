- input: |
    # Broadband Access in Rural Counties

    ## Summary

    We mapped broadband availability for 58 counties. We found that 14 counties fall below the federal speed benchmark. This report recommends that the state prioritize those counties in the next grant round.

    ## Method

    We combined provider filings with speed-test data. Our team validated the merged dataset against county records.
  decoys:
  - anchor: This report recommends
    reason: active
  - anchor: We mapped broadband availability
    reason: active
- input: |
    # Nurse Retention Study

    ## Sample

    Nurses were eligible if they had worked at the hospital for at least one year. Most participants were enthusiastic about the interview. The main campus is located downtown, and the term 'float pool' is known throughout the hospital.

    ## Findings

    We found that shift length predicted turnover intention.
  decoys:
  - anchor: Nurses were eligible
    reason: stative
  - anchor: were enthusiastic
    reason: stative
  - anchor: is located downtown
    reason: stative
  - anchor: is known throughout
    reason: stative
- input: |
    # Teacher Workload Survey

    ## Findings

    Teachers reported that they lacked planning time. Principals said that budgets constrained their staffing choices. One teacher told us, "We were never asked what we needed."

    ## References

    Smith, J. (2021). Planning time was cut in half after the reform. Journal of Education Policy, 12(3), 45-60.
  decoys:
  - anchor: Teachers reported that
    reason: qualifier
  - anchor: We were never asked what we needed
    reason: quoted
  - anchor: Planning time was cut in half
    reason: excluded
- input: |
    # Nuclear Siting Options

    ## Overview

    Nuclear energy can supply stable baseload power for AI data centers but is restricted to specific sites. The scope of this review is limited to plants that are already licensed. Many rural counties are underfunded for grid upgrades. The main substation is located twelve miles from the site.

    ## Method

    We compared each site against the 2030 capacity target.
  decoys:
  - anchor: is restricted to specific sites
    reason: stative
  - anchor: is limited to plants
    reason: stative
  - anchor: are underfunded for grid upgrades
    reason: stative
  - anchor: is located twelve miles
    reason: stative
- input: |
    # Grid Interconnection Barriers

    ## Findings

    The report delineates 66 constraints and offers an analysis of barriers that can be addressed in the 2030 timeline. Co-located generation choices must be tailored to the location, as no single solution is universally applicable. Additional capacity could be brought online by 2030 under several scenarios. The evidence depends on the type of load being measured.
  decoys:
  - anchor: can be addressed in the 2030 timeline
    reason: generic
  - anchor: must be tailored to the location
    reason: generic
  - anchor: could be brought online by 2030
    reason: generic
  - anchor: type of load being measured
    reason: generic
- input: |
    # Series Context

    ## Prior Work

    Through logic models and structured stakeholder consultations, the previous reports in the series have identified not only what needs to change to meet the coming electricity demand, but also how and by whom these changes might best be implemented.
  decoys:
  - anchor: by whom these changes might best be implemented
    reason: actor_is_the_point
- input: |
    # Telework Prevalence

    ## Results

    We report the share of employed persons who worked at home. A Pew Research Center survey found that 35 percent of workers whose jobs can be done from home were doing so all the time in early 2023 (Pew Research Center, 2023). One respondent told us, "We were never asked what we needed."
  decoys:
  - anchor: whose jobs can be done from home
    reason: source_definition
  - anchor: We were never asked what we needed
    reason: quoted
- input: |
    # Data Sources

    ## Approach

    We drew on three sources. First, we used county-level employment counts that the Bureau of Labor Statistics publishes each quarter. Second, we obtained utility filings from the state commission's public docket. Third, our team interviewed 22 planners between March and May 2025. We cleaned the merged dataset, dropped 41 duplicate records, and checked totals against the published state summary. Appendix A lists every source with its retrieval date.
  decoys:
  - anchor: We drew on three sources
    reason: active
  - anchor: Appendix A lists every source
    reason: active
