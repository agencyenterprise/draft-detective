# Eval samples for the active_voice workflow, in inventory form: the findings a correct
# run reports (anchored by verbatim quotes, with edit expectations) and the decoys it must
# leave alone (with the reason). See evals_inspectai/common/issue_inventory.py.
- input: |
    # Remote Work Pilot Evaluation

    ## Methods

    We surveyed 412 employees across three offices in spring 2025. Response rates were tracked weekly by the research team. Non-respondents were sent two reminders. We then interviewed 24 managers.

    ## Findings

    We found that hybrid staff reported higher satisfaction than fully remote staff.
  expected_issues:
  - id: rates_tracked
    title: Passive Voice
    anchor: Response rates were tracked weekly by the research team
    edit_expected: true
    severity: low
    edit:
      must_include:
      - The research team tracked response rates weekly
  - id: reminders_sent
    title: Passive Voice
    anchor: Non-respondents were sent two reminders
    edit_expected: true
    severity: low
    edit:
      must_include:
      - sent non-respondents two reminders
      must_not_include:
      - The authors
  decoys:
  - anchor: We surveyed 412 employees
    reason: active
  - anchor: hybrid staff reported higher satisfaction
    reason: qualifier
  notes: Both passives sit in one paragraph, so one issue should cover both. The document speaks in the first person,
    so the second actor is clear.
- input: |
    # Court Staffing Review

    ## Data

    Case filings were obtained from the state judicial council for 2019 through 2023. Staffing rosters were provided by each district.

    ## Analysis

    Filings per full-time equivalent were computed for each district. We then compared each district against the caseload benchmark.

    ## Results

    Three districts exceeded the caseload benchmark. Two districts reduced their backlogs after adding temporary staff.
  expected_issues:
  - id: filings_obtained
    title: Passive Voice
    anchor: Case filings were obtained from the state judicial council
    edit_expected: true
    edit:
      must_include:
      - obtained case filings
      must_not_include:
      - The authors
  - id: rosters_provided
    title: Passive Voice
    anchor: Staffing rosters were provided by each district
    edit_expected: true
    edit:
      must_include:
      - each district provided
  - id: filings_computed
    title: Passive Voice
    anchor: Filings per full-time equivalent were computed for each district
    edit_expected: true
    edit:
      must_include:
      - computed filings per full-time equivalent
      must_not_include:
      - The authors
  decoys:
  - anchor: Two districts reduced their backlogs
    reason: active
  - anchor: We then compared each district
    reason: active
