    edit:
      must_include:
      - (Yamamoto, 2016, p. 41)
  - id: long_et_al_three_authors
    title: Citation Format
    anchor: (Iqbal et al., 2022)
    edit_expected: true
    edit:
      must_include:
      - Iqbal, Ortiz, and Lowe, 2022
