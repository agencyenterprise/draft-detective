    # Broadband Subsidies in Practice

    ## Discussion

    Reverse auctions lowered subsidy costs per location (Moreno, 2019). Defaults among winning bidders were higher than expected (Takahashi and Byrne, 2022).

    ## References

    This list includes works consulted during the study that are not cited in the text.

    Ferreira, Ana, *Wiring Rural America*, Brookings Institution Press, 2016.

    Moreno, Felipe, "Reverse Auctions for Broadband," *Telecommunications Policy*, Vol. 43, No. 5, 2019.

    Takahashi, Yuki, and Sean Byrne, *Defaults in Broadband Subsidy Programs*, RAND Corporation, RR-A2701-1, 2022.

    Wendt, Oskar, *Spectrum Policy*, MIT Press, 2018.
  expected_issues: []
  decoys:
  - anchor: Ferreira, Ana
    reason: consulted_note
  - anchor: Wendt, Oskar
    reason: consulted_note
  notes: Headed References, but the note under the heading says the list includes works consulted, so
    uncited entries are fine.
