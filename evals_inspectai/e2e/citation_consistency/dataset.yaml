# Eval samples for the citation_consistency workflow, in inventory form: the findings a correct
# run reports (anchored by the verbatim citation, with edit expectations) and the citations it must
# leave alone (with the reason). See evals_inspectai/common/issue_inventory.py. Each sample targets
# one family of rules from skills/citation-consistency/SKILL.md; decoys sit in paragraphs of their
# own, since an issue that brackets a decoy's line flags it.
- input: |
    # Water Reuse in Arid Cities

    ## Background

    Municipal water reuse has grown steadily since 2000 (Alvarez, 2018). Indirect potable reuse now supplies a meaningful share of demand in several western cities (Bergstrom and Kale, 2021), although public acceptance remains the main constraint (Quintero, 2019).

    Treatment costs fell sharply after membrane prices dropped (Halvorsen, 2017). Desalination remains more expensive per acre-foot than reuse in every city studied (Marchetti, 2020).

    ## Findings

    Utilities that ran public demonstration sites saw higher acceptance (Bergstrom and Kale, 2021).

    We interviewed utility managers in four cities.[^1]

    Chapter 3 describes the cost model in detail.

    [^1]: A water utility manager, interview with the authors, May 2, 2024.

    ## References

    Alvarez, Teresa, *Water Reuse in the American West*, Island Press, 2018.

    Bergstrom, Nils, and Priya Kale, "Public Acceptance of Potable Reuse," *Journal of Water Policy*, Vol. 23, No. 4, 2021.

    Halverson, Erik, "Membrane Costs and Municipal Treatment," *Water Economics*, Vol. 9, 2017.

    Marchetti, Paola, *Desalination at Scale*, RAND Corporation, RR-A3001-1, 2022.

    Okonkwo, Ada, *Groundwater Recharge Methods*, Springer, 2016.
  expected_issues:
  - id: missing_quintero
    title: Citation Not in Reference List
    anchor: (Quintero, 2019)
    severity: high
    edit_expected: false
  - id: misspelled_halverson
    title: Citation Does Not Match Reference
    anchor: (Halvorsen, 2017)
    severity: medium
    edit_expected: true
    edit:
      must_include:
      - Halverson, 2017
  - id: wrong_year_marchetti
    title: Citation Does Not Match Reference
    anchor: (Marchetti, 2020)
    severity: medium
    edit_expected: true
    edit:
      must_include:
      - Marchetti, 2022
  - id: uncited_okonkwo
    title: Uncited Reference
    anchor: Okonkwo, Ada
    severity: low
    edit_expected: false
  decoys:
  - anchor: Utilities that ran public demonstration sites saw higher acceptance
    reason: correct_citation
  - anchor: A water utility manager, interview with the authors
    reason: interview
  - anchor: Chapter 3 describes the cost model in detail.
    reason: cross_reference
  notes: Author-date document with a References list. Quintero is absent from the list; Halvorsen and
    Marchetti 2020 are near misses of Halverson 2017 and Marchetti 2022; Okonkwo is never cited.
- input: |
    # Teacher Retention in Rural Districts

    ## Evidence

    Retention bonuses have a modest effect on turnover (Fischer 2019). Districts that pair bonuses with mentoring do better (Ibarra & Cole, 2020).

    Early-career teachers are the most likely to leave (Pak, Lind, and Moreau, 2018).

    The effect is strongest in the first two years (Pak et al., 2018).

    Housing support has also been tried (Sato, et al., 2021).

    Fischer (Fischer, 2019) estimates that a bonus of $5,000 lowers turnover by two percentage points.

    Mentoring programs vary widely in design (Ibarra and Cole, 2020 and Fischer, 2019).

    The largest effects were found in the smallest districts (Fischer, 2019, page 31).

    ## References

    Fischer, Hannah, *Paying to Stay: Retention Bonuses for Teachers*, RAND Corporation, RR-A1501-1, 2019.

    Ibarra, Luis, and Megan Cole, "Mentoring and Retention," *Education Policy Review*, Vol. 14, No. 2, 2020.

    Pak, Joon, Erik Lind, and Claire Moreau, *Who Leaves Teaching?* Urban Institute, 2018.

    Sato, Ken, Rosa Diaz, Amir Haddad, and Lena Vogt, "Housing Support for Rural Teachers," *Rural Education*, Vol. 41, No. 1, 2021.
  expected_issues:
  - id: missing_comma
    title: Citation Format
    anchor: (Fischer 2019)
    severity: low
    edit_expected: true
    edit:
      must_include:
      - (Fischer, 2019)
  - id: ampersand
    title: Citation Format
    anchor: (Ibarra & Cole, 2020)
    edit_expected: true
    edit:
      must_include:
      - (Ibarra and Cole, 2020)
      must_not_include:
      - '&'
  - id: et_al_three_authors
    title: Citation Format
    anchor: (Pak et al., 2018)
    edit_expected: true
    edit:
      must_include:
      - Pak, Lind, and Moreau, 2018
  - id: comma_before_et_al
    title: Citation Format
    anchor: (Sato, et al., 2021)
    edit_expected: true
    edit:
      must_include:
      - (Sato et al., 2021)
  - id: repeated_narrative_name
    title: Citation Format
    anchor: Fischer (Fischer, 2019)
    edit_expected: true
    edit:
      must_include:
      - Fischer (2019)
      must_not_include:
      - Fischer (Fischer
  - id: and_between_sources
    title: Citation Format
    anchor: (Ibarra and Cole, 2020 and Fischer, 2019)
    edit_expected: true
    edit:
      must_include:
      - ;
      must_not_include:
      - 2020 and Fischer
  - id: page_word
    title: Citation Format
    anchor: (Fischer, 2019, page 31)
    edit_expected: true
    edit:
      must_include:
      - (Fischer, 2019, p. 31)
  decoys:
  - anchor: Early-career teachers are the most likely to leave (Pak, Lind, and Moreau, 2018).
    reason: correct_citation
  notes: Every format rule the skill can fix with a determined edit, one citation each. Pak et al. is
    wrong because the entry has three authors.
- input: |
    # Urban Heat and Public Health

    ## Overview

    Heat waves are the deadliest weather events in the United States (Nguyen, 2020). Tree canopy lowers surface temperatures by several degrees (Ortiz and Webb, 2019).

    Cooling centers reduce heat deaths among older adults (Kaplan, 2021).

    ## Bibliography

    Abrams, Ruth, *Climate and the City*, Yale University Press, 2015.

    Kaplan, David, "Cooling Centers and Mortality," *American Journal of Public Health*, Vol. 111, No. 6, 2021.

    Lee, Min-jun, *Heat Islands in Asian Megacities*, Routledge, 2017.

    Nguyen, Thanh, *Heat Waves and Mortality*, RAND Corporation, RR-A2201-1, 2020.

    Ortiz, Carmen, and Daniel Webb, "Tree Canopy and Surface Temperature," *Urban Forestry*, Vol. 38, 2019.
  expected_issues: []
  decoys:
  - anchor: Abrams, Ruth
    reason: bibliography_uncited
  - anchor: Lee, Min-jun
    reason: bibliography_uncited
  - anchor: Cooling centers reduce heat deaths among older adults (Kaplan, 2021).
    reason: correct_citation
  notes: A Bibliography lists works consulted, so its uncited entries are fine. Every citation is
    correct; a clean run reports nothing.
