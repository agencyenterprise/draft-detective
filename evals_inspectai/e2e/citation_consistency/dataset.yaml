    # Peatland Restoration Costs

    ## Site Conditions

    Peat soils compress under heavy equipment, which raises the cost of access roads.[^1] Restoration crews in the northern sites relied on low-ground-pressure vehicles for that reason.[^2]

    Rewetting drained peat stops most of its carbon loss within five years.[^3]

    Costs per hectare varied by a factor of four across sites.[^4]

    [^1]: Barry G. Warner, "Peat: Nature's Compost," *Earth*, Vol. 1, No. 2, March 1992, p. 44.
    [^2]: Ibid., p. 48.
    [^3]: Ingrid Solberg and Tomas Lund, *Rewetting Northern Peatlands*, Springer, 2019, p. 112.
    [^4]: Solberg and Lund, 2019, p. 140.

    ## References

    Solberg, Ingrid, and Tomas Lund, *Rewetting Northern Peatlands*, Springer, 2019.

    Warner, Barry G., "Peat: Nature's Compost," *Earth*, Vol. 1, No. 2, March 1992.
  expected_issues:
  - id: ibid_warner
    title: Ibid. or Op. Cit.
    anchor: Ibid., p. 48.
    severity: low
    edit_expected: true
    edit:
      must_include:
      - Warner, 1992, p. 48
      must_not_include:
      - Ibid
  decoys:
  - anchor: Solberg and Lund, 2019, p. 140.
    reason: short_form
  - anchor: Ingrid Solberg and Tomas Lund, *Rewetting Northern Peatlands*, Springer, 2019, p. 112.
    reason: full_first_footnote
  notes: Full-footnote system with short forms. The first citation of each source is a full footnote,
    later ones use the author-date short form; the ibid. must become Warner's short form with its page.
- input: |
    # Wildfire Smoke and School Closures

    ## Evidence

    Smoke days rose sharply after 2015 across the western states (Hollis, 2021). School districts rarely close for smoke alone (Reyes and Grant, 2022).

    Air filtration in classrooms lowers indoor particulate levels by about half.[^1] Many districts lack the funds to install it.[^2]

    Remote instruction during closures widened achievement gaps.[^3]

    [^1]: Okada, *Clean Air in Schools*.
    [^2]: Reyes and Grant, "Smoke Days and School Budgets."
    [^3]: Hollis, *Wildfire Seasons*, p. 88.

    ## References

    Hollis, Margaret, *Wildfire Seasons: Smoke and Health in the American West*, University of California Press, 2021.

    Okada, Ren, *Clean Air in Schools*, RAND Corporation, RR-A3101-1, 2020.

    Reyes, Daniel, and Olivia Grant, "Smoke Days and School Budgets," *Education Finance*, Vol. 17, No. 3, 2022.
  expected_issues:
  - id: mixed_systems
    title: Mixed Citation Systems
    severity: medium
    edit_expected: false
  decoys: []
  notes: The body uses author-date citations while the notes use author-title citations. Which system
    is the majority is borderline (two in text, three in notes), so the issue is matched on its title
    alone, wherever it is anchored.
- input: |
    # Mobile Clinics in Rural Counties

    ## Findings

    Mobile clinics reach patients who otherwise skip preventive care.[^1] Visits fell when fuel prices rose.[^2]

    [^1]: Grace Holloway, *Care on Wheels*, Johns Hopkins University Press, 2018, p. 23.
    [^2]: Holloway, 2018, p. 57.
  expected_issues:
  - id: missing_list
    title: Missing Reference List
    severity: high
    edit_expected: false
  decoys: []
  notes: A full-footnote document with no reference list. The house style requires a list even when
    the notes carry full citations.
- input: |
    # Spectrum Sharing for Rural Coverage

    ## Analysis

    Auction results for rural licenses have been mixed (Davis and Patel, 2022).

    Programs that weigh affordability reach more low-income households [4].

    Current federal guidance is published online (https://www.ntia.gov/program/spectrum-sharing).

    Fixed wireless can serve dispersed households at lower cost (cf. Brennan, 2020).

    Capacity falls as subscribers share a tower (Davis and Patel, 2022b).

    ## References

    Brennan, Laura, *Fixed Wireless Access*, Artech House, 2020.

    Davis, Rachel, and Arun Patel, *Spectrum Auctions and Rural Coverage*, RAND Corporation, RR-A2001-1, 2022a.

    Davis, Rachel, and Arun Patel, *Fixed Wireless Access in Appalachia*, RAND Corporation, RR-A2001-2, 2022b.
  expected_issues:
  - id: ambiguous_davis
    title: Ambiguous Citation
    anchor: (Davis and Patel, 2022)
    severity: medium
    edit_expected: false
  - id: numbered
    title: Citation Form Not Allowed
    anchor: '[4]'
    severity: low
    edit_expected: false
  - id: url
    title: Citation Form Not Allowed
    anchor: (https://www.ntia.gov/program/spectrum-sharing)
    severity: low
    edit_expected: false
  - id: cf
    title: Citation Form Not Allowed
    anchor: (cf. Brennan, 2020)
    severity: low
  decoys:
  - anchor: Capacity falls as subscribers share a tower (Davis and Patel, 2022b).
    reason: correct_citation
  notes: Two Davis and Patel entries from 2022 carry year letters, so a bare 2022 citation could mean
    either. A numbered citation, a URL standing in for a citation and cf. are forms the style does not
    allow; none has a determined fix (the cf. issue leaves the edit unchecked, since dropping cf. is
    a plausible fix).
- input: |
    # Coastal Flood Insurance

    ## Premiums

    Premiums rose fastest in the most exposed counties (see Marchetti 2022, p. 4).[^1]

    Take-up fell where premiums rose most (Ostrowski, 2020).

    [^1]: Premium data cover 2015 through 2021.

    ## References

    Marchetti, Paola, *Flood Insurance Markets on the Gulf Coast*, RAND Corporation, RR-A4101-1, 2022.

    Ostrowski, Lena, "Who Drops Flood Coverage?" *Journal of Risk and Insurance*, Vol. 87, No. 2, 2020.
  expected_issues:
  - id: comma_with_see_page_and_callout
    title: Citation Format
    anchor: (see Marchetti 2022, p. 4)
    edit_expected: true
    edit:
      must_include:
      - (see Marchetti, 2022, p. 4)
      - '[^1]'
  decoys:
  - anchor: Take-up fell where premiums rose most (Ostrowski, 2020).
    reason: correct_citation
  notes: The fix adds only the comma; the refinement, the page and the footnote callout after the
    parenthesis must survive. The suite skips edit_keeps_numbers_and_markers, so these must_include
    phrases carry that guarantee for a citation with a callout.
- input: |
    # Rural Hospital Closures

    ## Findings

    Closures cluster in states that did not expand Medicaid.[^1]

    Travel times to emergency care rose by a third after a closure.[^2]

    Obstetric units closed first in most of the hospitals studied.[^3]

    [^1]: Okada and Brenner, *Closing the Doors*.
    [^2]: Lindahl, "Distance to Care After Rural Closures."
    [^3]: Mwangi, *Maternity Deserts*.

    ## References

    Lindahl, Sara, "Distance to Care After Rural Closures," *Health Affairs*, Vol. 40, No. 2, 2021.

    Okada, Ren, and Paul Brenner, *Closing the Doors: Rural Hospitals in Decline*, RAND Corporation, RR-A5101-1, 2019.
  expected_issues:
  - id: author_title_missing
    title: Citation Not in Reference List
    anchor: Mwangi, *Maternity Deserts*.
    severity: high
    edit_expected: false
  decoys:
  - anchor: Okada and Brenner, *Closing the Doors*.
    reason: author_title_match
  - anchor: Lindahl, "Distance to Care After Rural Closures."
    reason: author_title_match
  notes: An author-title document throughout. Its citations carry no year, so they match on surnames and
    main title (the subtitle is left out); Mwangi's title is in no entry.
