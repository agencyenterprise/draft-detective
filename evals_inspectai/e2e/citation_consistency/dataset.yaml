    anchor: (Lindgrin et al., 2021)
    edit_expected: true
    edit:
      must_include:
      - Lindgren et al., 2021
  - id: long_comma_before_et_al
    title: Citation Format
    anchor: (Fairbanks, et al., 2011)
    edit_expected: true
    edit:
      must_include:
      - (Fairbanks et al., 2011)
