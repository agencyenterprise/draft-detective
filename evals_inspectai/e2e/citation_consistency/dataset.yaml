    reason: cross_reference
  - anchor: Paragraph 150 of the review
    reason: correct_citation
  notes: A 473-line author-date report with a 50-entry References list and about 300 correct citations,
    long enough for the skill's sub-agent path. The planted errors sit in their own paragraphs from
    Chapter 3 on (11 faulty citations), weighted to the back half, where a single pass gives the text less attention.
    Okafor 2021, absent from the list, is cited in Chapter 2 and again in Chapter 7, which land in different
    sub-agent parts, and a correct run reports it on each line that cites it. Generated once from a seeded
    script and committed as plain markdown; Novak and Moreau are listed
    but never cited, and the two Davis and Patel 2022 entries are reached only by the ambiguous citation.
    In an author-date document the replacement for an ibid. note is the author's wording, so no edit
    is expected for it.
