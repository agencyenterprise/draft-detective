# Eval samples for the reference_validation_v2 workflow. Each record is one reference, labelled field by
# field against the reference-validation skill: `result` is the final result a correct run gives (a list
# accepts any of them), `fields` the problem type each of author, title, publisher, year and identifier
# gets (a field left out is `correct`; a list accepts any), `corrections` a phrase the field's suggested
# value or the updated reference must carry, and `not_found` a fabricated reference, whose fields are all
# incorrect or unverifiable and which gets no updated reference. `rationale` is the labeller's account,
# which the judged criterion compares the run's reasoning with. Labels follow the skill's rules where the
# old labels did not: a year within one of the source's is correct, a first-author-only list is a
# truncated list, an organization that is both author and publisher is named once, and a title may omit
# its subtitle or deck while it still identifies the work. Each of those rules has cases on both sides.
# See evals_inspectai/e2e/reference_validation_v2/records.py.

