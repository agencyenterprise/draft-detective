    # Effect of Nitrogen Addition on Grassland Plant Diversity

    ## Methods

    One meadow received nitrogen fertilizer at 100 kg per hectare per year, and a second meadow 2 km away was left unfertilized.

    Species richness was recorded in 40 quadrats per meadow in the third summer after fertilization began.

    Quadrats were placed at random coordinates generated before the survey.

    Species were identified by a botanist who did not know which meadow was fertilized.

    Richness was compared between the meadows with a t-test on the 80 quadrats.

    ## Results

    Richness was 23 percent lower in the fertilized meadow (p < 0.001).
  expected_issues:
  - id: pseudoreplication
    anchor: Richness was compared between the meadows with a t-test on the 80 quadrats.
    severity: high
    rationale: >-
      With one meadow per treatment, quadrats are pseudoreplicates (Hurlbert 1984): the treatment effect is
      confounded with site. Nutrient-addition experiments replicate treatment across plots or sites (the
      Nutrient Network) and analyse at the level of the experimental unit.
  - id: no_baseline
    anchor: in the third summer after fertilization began
    rationale: >-
      With no survey before fertilization, the pre-existing difference between meadows is unknown; a
      before-after-control-impact design is standard when treatment cannot be replicated.
  decoys:
  - anchor: Quadrats were placed at random coordinates
    reason: random_sampling
    rationale: Randomly placed quadrats are standard, sound sampling within a site.
  - anchor: identified by a botanist who did not know which meadow was fertilized
    reason: blinding
    rationale: Blind species identification guards against observer bias.

- input: |
    # Checkout Button Redesign: An Online Controlled Experiment

    ## Methods

    Users were randomized at the user level, by a hash of their account ID, to the current or the redesigned checkout button.

    The experiment was planned to run for two full weeks to cover weekly traffic cycles.

    We monitored conversion daily and ended the experiment on day five, once the difference in conversion was significant at p < 0.05.

    Assignment was configured as a 50/50 split, and the treatment arm received 54 percent of users.

    Of the 22 metrics on our dashboard, conversion showed a significant difference, and we report it here.

    Guardrail metrics for page load time and error rate were monitored throughout and showed no degradation.

    ## Results

    Conversion rose from 3.1 to 3.4 percent (p = 0.04).
  expected_issues:
  - id: peeking
    anchor: ended the experiment on day five, once the difference in conversion was significant
    severity: high
    rationale: >-
      Stopping at the first significant daily look inflates the false-positive rate; online experimentation
      practice fixes the sample size in advance or uses sequential tests (Kohavi, Tang & Xu 2020;
      always-valid p-values).
  - id: srm
    anchor: the treatment arm received 54 percent of users
    severity: high
    rationale: >-
      A 54/46 split on a configured 50/50 is a sample ratio mismatch, a sign of broken assignment or logging;
      the standard is to test for it and not trust the result until it is explained.
  - id: metric_fishing
    anchor: Of the 22 metrics on our dashboard, conversion showed a significant difference
    severity: high
    rationale: >-
      Reporting whichever of 22 metrics reached significance is a multiple-comparisons problem; practice is
      a prespecified primary metric (an overall evaluation criterion) with corrections for the rest.
  decoys:
  - anchor: randomized at the user level, by a hash of their account ID
    reason: unit_of_randomization
    rationale: User-level randomization by a stable hash is the standard, sound assignment.
  - anchor: planned to run for two full weeks to cover weekly traffic cycles
    reason: full_weekly_cycles
    rationale: Planning for full weekly cycles is recommended practice; the flaw is stopping early, not the plan.
  - anchor: Guardrail metrics for page load time and error rate
    reason: guardrail_metrics
    rationale: Monitoring guardrail metrics is standard practice in online experiments.

- input: |
    # Does Holding a Warm Cup Increase Interpersonal Warmth? A Laboratory Experiment

    ## Methods

    Twenty-four undergraduates took part, twelve per condition.

    Participants held a warm or a cold cup before rating a target person, with the order of the rating tasks counterbalanced across participants.

    The experimenter who ran each session did not know which cup temperature the participant had been assigned.

    After inspecting the data, we excluded three participants whose ratings looked implausible.

    Warmth ratings of the target were compared between conditions with an independent-samples t-test.

    ## Results

    Participants who held a warm cup rated the target as warmer (p = 0.03).
  expected_issues:
  - id: underpowered
    anchor: Twenty-four undergraduates took part, twelve per condition.
    severity: high
    rationale: >-
      Twelve per group is badly underpowered for the small effects typical of this literature, and large
      replications of this very effect failed (Lynott et al. 2014); the field now expects an a priori power
      analysis and often preregistration.
  - id: post_hoc_exclusion
    anchor: After inspecting the data, we excluded three participants
    severity: high
    rationale: >-
      Exclusions decided after seeing the data are a researcher degree of freedom (Simmons, Nelson &
      Simonsohn 2011); criteria should be set in advance and results reported with and without exclusions.
  decoys:
  - anchor: with the order of the rating tasks counterbalanced across participants
    reason: counterbalancing
    rationale: Counterbalancing task order is standard practice against order effects.
  - anchor: did not know which cup temperature the participant had been assigned
    reason: blinding
    rationale: An experimenter blind to condition guards against experimenter expectancy effects.
