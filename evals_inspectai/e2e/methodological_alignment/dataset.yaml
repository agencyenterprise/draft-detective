    # Deep Learning Detection of Pneumonia on Chest Radiographs

    ## Methods

    We collected 24,000 frontal chest radiographs of 9,800 patients from one hospital's archive, covering 2016 to 2020.

    Each image was labelled by two radiologists, with a third resolving disagreements.

    The images were randomly split 80/20 into training and test sets.

    The operating threshold was set to maximise the F1 score on the test set.

    We report the area under the ROC curve with 95 percent bootstrap confidence intervals.

    ## Results

    The model achieved an AUROC of 0.96 (95% CI 0.95 to 0.97) and an F1 score of 0.89.
  expected_issues:
  - id: patient_leakage
    anchor: The images were randomly split 80/20 into training and test sets.
    severity: high
    rationale: >-
      With several images per patient, an image-level split lets the model recognise patients rather than
      disease; medical imaging studies split at the patient level (TRIPOD-AI, the CLAIM checklist).
  - id: threshold_on_test
    anchor: The operating threshold was set to maximise the F1 score on the test set.
    severity: high
    rationale: >-
      Tuning the threshold on the test set leaks test information into the reported F1; it is set on a
      validation set or by cross-validation.
  - id: single_site
    anchor: from one hospital's archive, covering 2016 to 2020
    rationale: >-
      A single-site dataset gives no evidence of generalization across scanners and populations; the field
      expects external validation at another site (Zech et al. 2018 on site confounding).
  decoys:
  - anchor: labelled by two radiologists, with a third resolving disagreements
    reason: reference_standard
    rationale: Double reading with adjudication is a sound reference standard.
  - anchor: with 95 percent bootstrap confidence intervals
    reason: uncertainty_reported
    rationale: Reporting AUROC with bootstrap confidence intervals is standard practice.

- input: |
    # Nurses' Experiences of Night-Shift Handovers: An Interview Study

    ## Methods

    We conducted semi-structured interviews using a topic guide that was piloted with two nurses and revised.

    Six nurses from one ward were interviewed, at which point we judged that thematic saturation had been reached.

    Transcripts were coded by the first author.

    Participants reviewed a summary of the themes and confirmed that it reflected their experiences.

    We report the percentage of participants endorsing each theme as an estimate of how common it is among hospital nurses nationally.

    ## Findings

    Four of six nurses (67 percent) described handovers as rushed.
  expected_issues:
  - id: saturation
    anchor: Six nurses from one ward were interviewed
    rationale: >-
      Six interviews from one ward is a small, homogeneous sample; the literature on saturation (Guest et al.
      2006; Hennink et al. 2017) expects a justified sample size and evidence that no new codes emerged.
  - id: single_coder
    anchor: Transcripts were coded by the first author.
    rationale: >-
      Qualitative rigour standards (COREQ; Lincoln and Guba's trustworthiness criteria) expect a second
      coder, consensus coding, or an audit trail, with a reflexivity statement.
  - id: prevalence
    anchor: as an estimate of how common it is among hospital nurses nationally
    severity: high
    rationale: >-
      Interview samples are purposive and not designed to estimate prevalence; percentages generalized to a
      national population mismatch the design and the claim.
  decoys:
  - anchor: using a topic guide that was piloted with two nurses and revised
    reason: piloted_guide
    rationale: Piloting and revising the interview guide is standard qualitative practice.
  - anchor: Participants reviewed a summary of the themes and confirmed
    reason: member_checking
    rationale: Member checking is a recognised credibility procedure.

