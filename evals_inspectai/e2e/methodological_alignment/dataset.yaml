# Eval samples for the methodological_alignment workflow, in inventory form. Each record is the methods
# of a short paper with two to four planted design risks. A plant is written the way a paper states its
# choice, neutrally or by omission, never naming the flaw: the run has to know what the field does to see
# it. Each is anchored on the sentence stating the choice (for an omission, the sentence describing the
# analysis it affects), with the labeller's account of what the field does instead (`rationale`); a plant
# that undermines the main result carries `severity: high`. Titles are free-form ("Methodology: <gap>"),
# and the skill reports every missing standard component, not only the planted ones, so a report on another
# gap is not a false positive. Decoys are sound design choices a correct run must not criticise, each with
# the labeller's reason; several look like the gaps a reviewer checks for (no margin of error, a sample cut to
# the establishments a mandate covers) but are the right call here. The skill anchors an omission on the passage it
# affects, so a line cannot tell a criticism of a decoy from one of its neighbour, and decoys are judged,
# not matched. Fields vary so the baseline search varies. Every paragraph is one line.
# See evals_inspectai/common/issue_inventory.py.

- input: |
    # Impact of Four-Day Work Weeks on Software Team Output

    ## Methods

    We conducted a six-month field study across three engineering teams (N = 47 engineers) at a mid-size software company. One team kept the standard five-day schedule, while two teams moved to a compressed four-day, 32-hour week.

    Each team's manager decided whether the team would adopt the four-day week.

    Productivity was measured as the number of merged pull requests per engineer per week, extracted automatically from the version-control system.

    Burnout was measured monthly with the Maslach Burnout Inventory, administered by an external survey firm so that managers never saw individual responses.

    Weekly per-engineer pull-request counts were compared between the four-day and five-day conditions with a two-sample t-test.

    We compared the two conditions on 14 outcome measures, each tested at p < 0.05.

    ## Results

    Four-day teams merged 11 percent more pull requests per engineer per week than the five-day team (p = 0.04). Burnout scores fell in four-day teams.

    ## Conclusion

    The four-day week improved throughput without harming well-being.
  expected_issues:
  - id: self_selection
    anchor: Each team's manager decided whether the team would adopt the four-day week.
    severity: high
    rationale: >-
      Self-selected assignment confounds the schedule with team and manager differences; field studies of
      work-time interventions randomize or, failing that, use a difference-in-differences design with
      pre-intervention trends and covariate adjustment.
  - id: pr_proxy
    anchor: Productivity was measured as the number of merged pull requests per engineer per week
    rationale: >-
      A single activity count is a weak proxy for software productivity; the field uses several measures
      (the SPACE framework, DORA metrics, quality and review outcomes) because pull-request counts can be
      split or gamed.
  - id: independence
    anchor: Weekly per-engineer pull-request counts were compared between the four-day and five-day conditions with a two-sample t-test.
    severity: high
    rationale: >-
      Treatment is assigned by team and each engineer contributes many weeks, so observations are clustered;
      the field uses mixed-effects or cluster-robust models, and with three teams a t-test on engineer-weeks
      badly overstates precision.
  - id: multiplicity
    anchor: We compared the two conditions on 14 outcome measures, each tested at p < 0.05.
    rationale: >-
      Fourteen outcomes each at p < 0.05 make a false positive likely; practice is to prespecify a primary
      outcome or correct for multiplicity (Bonferroni, Holm, false discovery rate).
  decoys:
  - anchor: Burnout was measured monthly with the Maslach Burnout Inventory
    reason: validated_instrument
    rationale: >-
      The Maslach Burnout Inventory is the field's standard validated burnout measure, and third-party
      administration protects candour.
  notes: The original sample, with each plant stated neutrally.

- input: |
    # Lightweight Transformer for On-Device Intent Classification

    ## Methodology

    We fine-tune a 4-layer DistilBERT encoder on a proprietary dataset of 82,000 labeled utterances collected from 3,100 users of our assistant, spanning 30 intent classes.

    The utterances were randomly split 70/15/15 into training, validation, and test sets.

    Training used the AdamW optimizer with a learning rate of 3e-5 and batch size 64, with early stopping on validation macro-F1; the test set was used only once, for the final evaluation.

    We report macro-F1 and per-class precision and recall of our model on the held-out test set.

    All results are averaged over five random seeds and reported with standard deviations.

    ## Results

    The model reached a macro-F1 of 0.91 on the test set and ran inference in under 9 ms per utterance on a mobile CPU.
  expected_issues:
  - id: user_leakage
    anchor: The utterances were randomly split 70/15/15
    severity: high
    rationale: >-
      A random utterance-level split puts the same users' phrasing in training and test sets and inflates
      scores; the field splits by user (a grouped split) to estimate performance on new users.
  - id: no_baseline_or_benchmark
    anchor: We report macro-F1 and per-class precision and recall of our model on the held-out test set.
    severity: high
    rationale: >-
      Intent-classification papers compare against baselines (a full-size BERT, a non-neural classifier)
      and report on public benchmarks (CLINC150, Banking77, SNIPS); with neither, 0.91 macro-F1 cannot be
      interpreted.
  decoys:
  - anchor: the test set was used only once, for the final evaluation
    reason: held_out_test
    rationale: Model selection on validation data and a single use of the test set is standard practice.
  - anchor: All results are averaged over five random seeds and reported with standard deviations.
    reason: seed_variance_reported
    rationale: Reporting the mean and spread over several seeds is the standard for fine-tuning variance.
  notes: The original sample; the user leakage has to be inferred from the 3,100 users and the random split.

- input: |
    # Acupressure Wristbands for Postoperative Nausea: A Randomized Trial

    ## Methods

    The trial was registered at ClinicalTrials.gov before enrolment began, with nausea incidence at 24 hours after surgery as its primary outcome.

    We randomized 220 adults undergoing laparoscopic surgery 1:1 to acupressure wristbands or to a control group that received no wristband, using a computer-generated sequence in permuted blocks of random size, with allocation concealed in sequentially numbered opaque envelopes.

    All patients received the same anaesthetic protocol, including prophylactic ondansetron.

    Ward nurses recorded each patient's nausea on a four-point scale at 2, 6 and 24 hours.

    The sample size of 220 gave 80 percent power to detect a 15-point difference in nausea incidence at a two-sided alpha of 0.05.

    The analysis included the 171 patients who kept their wristband on, or had none, for the full 24 hours.

    Our primary outcome was nausea incidence at 6 hours after surgery.

    ## Results

    Nausea at 6 hours was lower with wristbands (21 percent vs 38 percent, p = 0.01).
  expected_issues:
  - id: no_sham
    anchor: a control group that received no wristband
    severity: high
    rationale: >-
      Nausea is a subjective outcome, and a no-wristband control lets patients and the nurses rating them
      know the allocation; acupressure trials use sham wristbands and blinded outcome assessors (CONSORT,
      Cochrane risk of bias).
  - id: per_protocol
    anchor: The analysis included the 171 patients who kept their wristband on
    severity: high
    rationale: >-
      A per-protocol analysis that drops 22 percent of patients breaks randomization; CONSORT expects an
      intention-to-treat primary analysis with missing-data handling.
  - id: outcome_switching
    anchor: Our primary outcome was nausea incidence at 6 hours after surgery.
    severity: high
    rationale: >-
      The registered primary outcome was nausea at 24 hours; reporting 6 hours as primary is outcome
      switching, which the field requires to be declared and justified, with the registered outcome reported.
  decoys:
  - anchor: permuted blocks of random size, with allocation concealed
    reason: randomization_method
    rationale: >-
      Computer-generated randomization in blocks of varying size with concealed allocation is the standard,
      sound method; varying block sizes keep the next allocation unpredictable even in an open trial.
  - anchor: gave 80 percent power to detect a 15-point difference
    reason: power_analysis
    rationale: An a priori sample-size calculation with stated power, effect and alpha is standard practice.
  - anchor: All patients received the same anaesthetic protocol
    reason: standardized_cointervention
    rationale: Standardizing anaesthesia and antiemetic prophylaxis across arms removes a co-intervention confound.
  notes: The outcome switch has to be seen by comparing the registered and reported primary outcomes.

- input: |
    # Public Attitudes to Four-Day School Weeks: A National Survey

    ## Methods

    The questionnaire was pretested with 12 cognitive interviews, and two ambiguous items were reworded before fielding.

    Respondents were recruited through posts on the research team's social media accounts, and the survey was open to anyone with the link.

    We received 1,860 complete responses, and we report the percentage choosing each option as the national adult population's view.

    The key item asked: "Given the well-documented benefits to teacher morale, would you support a four-day school week?"

    Because the sample is not a probability sample, we do not report margins of error.

    ## Results

    Sixty-eight percent of respondents supported a four-day school week.
  expected_issues:
  - id: convenience_sample
    anchor: Respondents were recruited through posts on the research team's social media accounts
    severity: high
    rationale: >-
      An opt-in social-media sample is self-selected and unrepresentative; national attitude surveys use
      probability samples (address-based sampling, probability panels) or at least quotas and weighting
      (AAPOR guidance on non-probability samples).
  - id: unweighted_national
    anchor: we report the percentage choosing each option as the national adult population's view
    severity: high
    rationale: >-
      Population estimates from a non-probability sample need weighting to known population margins and
      caution about error; unweighted percentages reported as the nation's view are unsupported.
  - id: leading_question
    anchor: Given the well-documented benefits to teacher morale
    severity: high
    rationale: >-
      The item presupposes benefits and leads respondents; questionnaire design standards call for neutral
      wording and balanced framing.
  decoys:
  - anchor: pretested with 12 cognitive interviews
    reason: pretested_instrument
    rationale: Cognitive pretesting before fielding is standard, recommended survey practice.
  - anchor: we do not report margins of error
    reason: no_margin_of_error
    rationale: >-
      AAPOR advises against reporting a margin of sampling error for a non-probability sample; declining to
      report one is correct, whatever the sample's other problems.

