    # State Paid Sick Leave Mandates and Employee Turnover

    ## Data and design

    We use quarterly establishment-level separation rates from the Quarterly Workforce Indicators, an administrative dataset built from unemployment-insurance records.

    We compare four states whose paid sick leave mandates took effect in the first quarter of 2015 with 20 states without a mandate, in a difference-in-differences design.

    Our panel runs from the fourth quarter of 2014 to the fourth quarter of 2016.

    Standard errors are heteroskedasticity-robust.

    We exclude establishments with fewer than five employees, which all four mandates exempt.

    As a placebo test, we re-estimate the model on the public-sector workforce, which the mandates did not cover, and find no effect.

    ## Results

    Separation rates fell by 1.2 percentage points in mandate states relative to controls (p < 0.01).
  expected_issues:
  - id: no_pretrends
    anchor: Our panel runs from the fourth quarter of 2014 to the fourth quarter of 2016.
    severity: high
    rationale: >-
      With mandates in 2015Q1, the panel has a single pre-treatment quarter; difference-in-differences rests
      on parallel trends, which the field shows with several pre-periods and an event-study plot of leads.
  - id: unclustered_se
    anchor: Standard errors are heteroskedasticity-robust.
    severity: high
    rationale: >-
      Treatment is at the state level, so errors are correlated within states; the field clusters by state
      (Bertrand, Duflo & Mullainathan 2004) and, with four treated states, uses a wild-cluster bootstrap or
      randomization inference.
  decoys:
  - anchor: an administrative dataset built from unemployment-insurance records
    reason: administrative_data
    rationale: The Quarterly Workforce Indicators are a standard, high-quality administrative source for separations.
  - anchor: As a placebo test, we re-estimate the model on the public-sector workforce
    reason: placebo_test
    rationale: A placebo on an uncovered group is a standard robustness check for this design.
  - anchor: We exclude establishments with fewer than five employees
    reason: coverage_restriction
    rationale: Restricting the sample to establishments the mandates cover is the correct treatment definition.
  notes: The single pre-period and the unclustered errors both have to be inferred.

