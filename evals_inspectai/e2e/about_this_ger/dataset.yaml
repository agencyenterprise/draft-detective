# Eval samples for the about_this_ger workflow, in inventory form (see
# evals_inspectai/common/issue_inventory.py). The workflow runs two validators, preface and authors, and the
# eval scores their issues together (titles tell them apart). A preface element that fails is about something
# the preface lacks, so its issue has no anchor and is matched on its "Preface: <rule> Missing" title; the same
# goes for a missing preface or authors section. An author issue is anchored on the bio it is about and matched
# on the stable "Author Bio Issue" part of its title, since the skill puts the author's name after it as written
# in the bio (with or without "Dr."); the eval's own checks read the name. Both skills give every issue severity
# medium. Where one author fails two rules the skill allows one issue per rule or one combined issue, so the
# second rule's issue is optional (required: false). Decoys are bios a correct run leaves alone, tagged with the
# rule that would misfire; each sits on a bio with no expected issue. The skills propose no edits.

