    # Wildfire Smoke and Outdoor Worker Health in Oregon

    ## Executive Summary

    Wildfire smoke now reaches hazardous levels in Oregon for several weeks most summers, and the state adopted a permanent smoke-exposure rule for outdoor workers in 2022. This report aims to assess whether that rule reduced smoke-related illness among farm and construction workers during its first two fire seasons. It is intended for occupational safety regulators, employers of outdoor workers and worker advocacy groups. It builds on California's evaluations of its 2019 emergency smoke standard and on the epidemiological literature linking fine particulate matter to acute respiratory illness. The report provides the first estimate of the rule's effect on workers' compensation claims and emergency visits, using claims linked to daily smoke forecasts. It covers the 2022 and 2023 fire seasons and agricultural and construction workers only, and it does not assess indoor workers or long-term health effects.

    ## Methods

    We linked workers' compensation claims and emergency department visits to county-level daily air quality readings and compared smoke days before and after the rule took effect.

    ## Findings

    Smoke-related respiratory claims on hazardous air days fell by roughly a third after the rule took effect. Compliance with respirator provision was lowest among small agricultural employers.

    ## Author Biographies

    Dr. Hannah Okoro is an occupational epidemiologist at the Pacific Northwest Environmental Health Institute. Her research covers heat and smoke exposure among outdoor workers, e.g., farmworkers and wildland firefighters. She holds an M.P.H. from Emory University and a Ph.D. in epidemiology from the University of Washington.

    Marcus Bell is a senior policy analyst at the Pacific Northwest Environmental Health Institute, where he works with Dr. Okoro on workplace safety standards. His work focuses on the design and enforcement of occupational safety regulation, i.e., how rules are written, inspected and penalised. He received a B.A. in economics from Reed College and an M.A. in public policy from Oregon State University.

    Dr. Yuki Tanaka is an assistant professor of environmental health at Oregon State University. She studies how low-cost sensors and satellite estimates can improve air pollution exposure assessment. She earned her Ph.D. in environmental engineering from Stanford University.
