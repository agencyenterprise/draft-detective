    # Community College Dual Enrollment in Texas

    ## About This Report

    This report aims to estimate whether taking community college courses in high school raises the chance that Texas students complete a college credential within six years. It is intended for state higher education officials, school district leaders and community college administrators who set dual-enrollment policy. It builds on An's (2013) national estimates of dual-enrollment effects and on the Community College Research Center's studies of dual-enrollment pathways. The report contributes separate estimates for students from low-income families and for students in rural districts. It covers students who graduated from Texas public high schools between 2012 and 2016 and does not examine career and technical education courses taken outside a college.

    ## Methods

    We followed each graduating cohort for six years using linked state education and workforce records and compared dual-enrollment students with similar classmates.

    ## Findings

    Dual-enrollment students were 9 percentage points more likely to earn a credential within six years, and the gap was largest for low-income students.

    ## About the Authors

    Dr. Elena Vasquez is a senior policy researcher at the Texas Education Research Consortium. Her research focuses on college access and the transition from high school to college. She holds a Ph.D. in education policy from the University of Texas at Austin.

    Brian Holloway is a senior economist with more than fifteen years of experience in education research. His work examines the returns to community college credentials and workforce training. He holds a Ph.D. in labor economics from Texas A&M University.

    Nadia Farouk is a research analyst at the Texas Education Research Consortium. She studies how school districts partner with community colleges to deliver dual-enrollment courses. She earned an M.A. in sociology from Rice University.
