    # State Data Breach Notification Laws and Consumer Harm

    ## About This Report

    Every state now requires companies to notify consumers after a data breach, but the laws differ widely in their deadlines, their definitions of personal information and whether they require notice to a state regulator. This report aims to assess whether stricter notification requirements are associated with lower rates of identity theft after breaches. It is intended for state legislators, attorneys general and privacy regulators revising their breach laws. It builds on Romanosky, Telang and Acquisti's (2011) study of breach laws and identity theft and on the National Conference of State Legislatures' compilations of state statutes. The report contributes a new index of statutory strictness that codes 14 provisions of each state's law as amended through 2024. It covers breaches reported between 2015 and 2024 and does not examine federal sector-specific rules such as those for health or financial data.

    ## Methods

    We coded each state's statute and linked the index to identity theft reports filed with the Federal Trade Commission.

    ## Findings

    States in the strictest third of the index had 12 percent fewer identity theft reports per breached record than states in the most lenient third. Short notification deadlines mattered more than notice to regulators.

    ## About the Author

    Caroline Mercer is a senior policy fellow at the Center for Technology and Law. Her research focuses on consumer privacy law and state regulation of data security. She holds a J.D. from Yale Law School.
