    # Broadband Subsidies and Rural Telehealth Use

    ## About This Report

    Rural hospitals and clinics expanded telehealth rapidly during the pandemic, but many patients in their service areas lacked a home broadband connection fast enough for video visits. This report aims to estimate whether the federal Affordable Connectivity Program increased telehealth use among rural Medicare beneficiaries. It is intended for federal broadband and health officials, rural health networks and state broadband offices deciding whether to fund successor programs. It builds on the Federal Communications Commission's broadband deployment reports and on prior studies of the digital divide in telehealth, such as Chen and Wu (2022). The report contributes the first link between program enrollment by zip code and Medicare telehealth claims. It covers rural zip codes in 12 states from 2021 through 2023 and does not examine audio-only visits or private insurance claims.

    ## Methods

    We compared changes in telehealth claims across zip codes with high and low program enrollment, controlling for provider availability.

    ## Findings

    Zip codes in the top quartile of enrollment saw telehealth video visits rise 11 percent faster than those in the bottom quartile. Effects were largest for behavioral health visits.

    ## About the Authors

    Dr. Olivia Grant is a senior health services researcher at the Rural Health Policy Center. Her research focuses on access to care in rural areas and the adoption of telehealth. She holds a Ph.D. in health services research from the University of Minnesota.

    Ethan Cole is a policy analyst at the Rural Health Policy Center. His work centres on broadband policy and federal subsidy programs. He holds an M.P.A. from Syracuse University.

    Priya Nair provided research assistance.
